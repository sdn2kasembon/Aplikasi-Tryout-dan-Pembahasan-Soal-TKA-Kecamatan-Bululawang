</div>
</div><div className="grid grid-cols-3 gap-2"><select name="birthDate" className="p-2 border rounded outline-none" onChange={handleChange}><option value="">Tgl</option>{generateDays().map(d => <option key={d} value={d}>{d}</option>)}</select><select name="birthMonth" className="p-2 border rounded outline-none" onChange={handleChange}><option value="">Bln</option>{generateMonths().map(m => <option key={m} value={m}>{m}</option>)}</select><select name="birthYear" className="p-2 border rounded outline-none" onChange={handleChange}><option value="">Thn</option>{generateYears().map(y => <option key={y} value={y}>{y}</option>)}</select></div><div className="pt-2"><input name="token" placeholder="TOKEN SOAL" className="w-full p-3 border-2 border-blue-200 rounded text-center text-xl font-bold tracking-widest uppercase outline-none focus:border-blue-500" onChange={handleChange} /></div><button type="submit" disabled={checking} className="w-full py-3 rounded font-bold mt-4 transition bg-blue-600 text-white hover:bg-blue-700 flex items-center justify-center gap-2">{checking ? "Memeriksa..." : "MULAI KERJAKAN"}</button></form></div>
                    </div>
                </div>
            );
        };

        const QuestionRenderer = ({ question, currentAnswer, onAnswer }) => {
            const labelTrue = getEffectiveStatementMode(question) === 'sa' ? 'Sesuai' : 'Benar';
            const labelFalse = getEffectiveStatementMode(question) === 'sa' ? 'Tidak Sesuai' : 'Salah';
            return (
                <div className="w-full">
                    {question.image && (<div className="mb-4"><img src={question.image} alt={question.imageAlt || question.imageDescription || "Ilustrasi soal"} className="max-w-full h-auto max-h-80 rounded-lg border border-gray-200 shadow-sm object-contain mx-auto" /></div>)}
                    {question.type === 'single' && (<div className="space-y-3">{question.options.map((opt, idx) => (<button key={idx} onClick={() => onAnswer(opt)} className={`w-full text-left p-4 rounded-lg border-2 transition-all flex flex-col md:flex-row md:items-center gap-3 ${currentAnswer === opt ? 'border-blue-500 bg-blue-50 text-blue-900' : 'border-gray-200 hover:bg-gray-50'}`}><div className="flex items-center gap-3 w-full"><div className={`w-6 h-6 rounded-full border-2 flex-shrink-0 flex items-center justify-center ${currentAnswer === opt ? 'border-blue-500 bg-blue-500' : 'border-gray-300'}`}>{currentAnswer === opt && <div className="w-2 h-2 bg-white rounded-full"></div>}</div><span className="font-medium text-lg flex-1">{opt}</span></div>{question.optionImages && question.optionImages[idx] && (<img src={question.optionImages[idx]} alt="Opsi" className="mt-2 md:mt-0 h-24 w-auto rounded border bg-white object-contain self-start md:self-center" />)}</button>))}</div>)}
                    {question.type === 'complex' && (<div className="space-y-3"><p className="text-sm text-gray-500 italic mb-2">* Pilih lebih dari satu jawaban</p>{question.options.map((opt, idx) => { const isSel = Array.isArray(currentAnswer) ? currentAnswer.includes(opt) : false; const toggle = () => { const current = Array.isArray(currentAnswer) ? currentAnswer : []; if (current.includes(opt)) onAnswer(current.filter(i => i !== opt)); else onAnswer([...current, opt]); }; return (<button key={idx} onClick={toggle} className={`w-full text-left p-4 rounded-lg border-2 transition-all flex flex-col md:flex-row md:items-center gap-3 ${isSel ? 'border-purple-500 bg-purple-50 text-purple-900' : 'border-gray-200 hover:bg-gray-50'}`}><div className="flex items-center gap-3 w-full"><div className={`w-6 h-6 rounded border-2 flex-shrink-0 flex items-center justify-center ${isSel ? 'border-purple-500 bg-purple-500' : 'border-gray-300'}`}>{isSel && <CheckSquare className="w-4 h-4 text-white" />}</div><span className="font-medium text-lg flex-1">{opt}</span></div>{question.optionImages && question.optionImages[idx] && (<img src={question.optionImages[idx]} alt="Opsi" className="mt-2 md:mt-0 h-24 w-auto rounded border bg-white object-contain self-start md:self-center" />)}</button>); })}</div>)}
                    {question.type === 'statement' && (getEffectiveStatementMode(question) === 'custom' ? <div className="border rounded-lg overflow-hidden"><table className="w-full"><thead className="bg-gray-100 border-b"><tr><th className="p-3 text-left text-gray-700">Pernyataan</th><th className="p-3 text-center text-gray-700">Pilih kategori jawaban</th></tr></thead><tbody className="divide-y">{question.statements.map(s => { const answers = currentAnswer || {}; return <tr key={s.id} className="hover:bg-gray-50"><td className="p-3"><div>{s.text}</div>{s.image && <img src={s.image} alt="Gambar pernyataan" className="mt-2 max-w-full max-h-48 object-contain rounded border bg-white"/>}</td><td className="p-3"><div className="flex flex-wrap gap-3 justify-center">{(question.categories || []).map(cat => <label key={cat} className="inline-flex items-center gap-1 text-sm cursor-pointer"><input type="radio" name={`s-${s.id}`} checked={answers[s.id] === cat} onChange={() => onAnswer({...answers, [s.id]: cat})} className="w-4 h-4"/>{cat}</label>)}</div></td></tr>; })}</tbody></table></div> : <div className="border rounded-lg overflow-hidden"><table className="w-full"><thead className="bg-gray-100 border-b"><tr><th className="p-3 text-left text-gray-700">Pernyataan</th><th className="p-3 w-28 text-center text-green-700">{labelTrue}</th><th className="p-3 w-28 text-center text-red-700">{labelFalse}</th></tr></thead><tbody className="divide-y">{question.statements.map((s) => { const answers = currentAnswer || {}; return (<tr key={s.id} className="hover:bg-gray-50"><td className="p-3"><div>{s.text}</div>{s.image && <img src={s.image} alt="Gambar pernyataan" className="mt-2 max-w-full max-h-48 object-contain rounded border bg-white"/>}</td><td className="p-3 text-center"><input type="radio" name={`s-${s.id}`} checked={answers[s.id]===true} onChange={() => onAnswer({...answers, [s.id]: true})} className="w-5 h-5 text-green-600"/></td><td className="p-3 text-center"><input type="radio" name={`s-${s.id}`} checked={answers[s.id]===false} onChange={() => onAnswer({...answers, [s.id]: false})} className="w-5 h-5 text-red-600"/></td></tr>) })}</tbody></table></div>)}
                </div>
            );
        };

       const ExamInterface = ({ examData, studentData, onFinish }) => {
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [showFinishConfirm, setShowFinishConfirm] = useState(false);
             
            // Kunci penyimpanan lokal
            const storageKeyAnswers = `tka_answers_${studentData.nisn}_${examData.token}`;
            const storageKeyDoubtful = `tka_doubtful_${studentData.nisn}_${examData.token}`;
            const storageKeyTime = `tka_time_${studentData.nisn}_${examData.token}`;
            const storageKeyDeadline = `tka_deadline_${studentData.nisn}_${examData.token}`;
            const submitLockRef = useRef(false);
            const autoSubmitAttemptRef = useRef(false);

            const safeLocalRead = (key, fallback) => {
                try {
                    const raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : fallback;
                } catch (e) {
                    console.warn('Pemulihan data lokal gagal:', key, e);
                    return fallback;
                }
            };
            const initialDeadlineAt = (() => {
                try {
                    const storedDeadlineRaw = localStorage.getItem(storageKeyDeadline);
                    const storedDeadline = Number(storedDeadlineRaw);
                    if (storedDeadlineRaw !== null && Number.isFinite(storedDeadline) && storedDeadline > 0) return storedDeadline;
                    const legacyRaw = localStorage.getItem(storageKeyTime);
                    const legacySeconds = Number(legacyRaw);
                    const seconds = legacyRaw !== null && Number.isFinite(legacySeconds)
                        ? Math.max(0, legacySeconds) : Math.max(1, Number(examData.duration) || 60) * 60;
                    const deadline = Date.now() + seconds * 1000;
                    localStorage.setItem(storageKeyDeadline, String(deadline));
                    return deadline;
                } catch (e) {
                    return Date.now() + Math.max(1, Number(examData.duration) || 60) * 60000;
                }
            })();
            const [deadlineAt] = useState(initialDeadlineAt);

            // Pulihkan jawaban/ragu dari perangkat. Kegagalan storage tidak menghentikan ujian.
            const [answers, setAnswers] = useState(() => safeLocalRead(storageKeyAnswers, {}));
            const [doubtful, setDoubtful] = useState(() => safeLocalRead(storageKeyDoubtful, {}));
            const [timeLeft, setTimeLeft] = useState(() => Math.max(0, Math.ceil((initialDeadlineAt - Date.now()) / 1000)));
            
            // Set isFullscreen awal menjadi true agar tidak langsung menampilkan layar peringatan
            const [isFullscreen, setIsFullscreen] = React.useState(true);

            React.useEffect(() => {
                const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
                const handleVisibility = () => {
                    if (document.hidden) {
                        // Catatan ini hanya tersimpan di perangkat; bukan bukti pelanggaran server.
                        try {
                            const key = `tka_visibility_events_${studentData.nisn}_${examData.token}`;
                            const events = JSON.parse(localStorage.getItem(key) || '[]');
                            events.push({ at: new Date().toISOString(), event: 'visibility-hidden' });
                            localStorage.setItem(key, JSON.stringify(events.slice(-100)));
                        } catch (e) {
                            console.warn('Catatan perpindahan tab tidak dapat disimpan lokal:', e);
                        }
                    }
                };

                document.addEventListener("fullscreenchange", handleFullscreenChange);
                document.addEventListener("visibilitychange", handleVisibility);
                return () => {
                    document.removeEventListener("fullscreenchange", handleFullscreenChange);
                    document.removeEventListener("visibilitychange", handleVisibility);
                };
            }, []);

            const forceFullscreen = () => {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.warn("Fullscreen API diblokir oleh browser:", err);
                        // Jika Iframe memblokir, kita loloskan agar siswa tetap bisa ikut ujian
                        setIsFullscreen(true);
                    });
                } else {
                    setIsFullscreen(true); // Fallback browser lama
                }
            };
            
            // Fitur Auto-Save
            useEffect(() => {
                try { localStorage.setItem(storageKeyAnswers, JSON.stringify(answers)); }
                catch (e) { console.warn('Autosave jawaban lokal gagal:', e); }
            }, [answers, storageKeyAnswers]);

            useEffect(() => {
                try { localStorage.setItem(storageKeyDoubtful, JSON.stringify(doubtful)); }
                catch (e) { console.warn('Autosave penanda ragu lokal gagal:', e); }
            }, [doubtful, storageKeyDoubtful]);

            const submitExam = async () => {
                if (submitLockRef.current) return;
                submitLockRef.current = true;
                try {
                    let correctCount = 0;
                    const totalQuestions = examData.questions.length;

                    // 1. Menghitung skor berdasarkan jawaban yang tersimpan
                    examData.questions.forEach((q) => {
                        const userAnswer = answers[q.id];
                        if (!userAnswer) return;

                        if (q.type === 'single') {
                            if (userAnswer === q.correct) correctCount++;
                        } 
                        else if (q.type === 'complex') {
                            const isCorrect = Array.isArray(userAnswer) &&
                                userAnswer.length === q.correct.length &&
                                userAnswer.every(val => q.correct.includes(val));
                            if (isCorrect) correctCount++;
                        } 
                        else if (q.type === 'statement') {
                            const isCorrect = q.statements.every(s => userAnswer[s.id] === s.correct);
                            if (isCorrect) correctCount++;
                        }
                    });

                    const score = totalQuestions > 0 ? Math.round((correctCount / totalQuestions) * 100) : 0;

                    // 2. Menyiapkan data hasil untuk dikirim
                    const questionAnalysis = examData.questions.map((q, index) => {
                        const userAnswer = answers[q.id];
                        let isBlank = userAnswer === undefined || userAnswer === null || userAnswer === '' || (Array.isArray(userAnswer) && userAnswer.length === 0) || (q.type === 'statement' && (!userAnswer || Object.keys(userAnswer).length === 0));
                        let isCorrect = false;
                        if (!isBlank && q.type === 'single') isCorrect = userAnswer === q.correct;
                        else if (!isBlank && q.type === 'complex') isCorrect = Array.isArray(userAnswer) && Array.isArray(q.correct) && userAnswer.length === q.correct.length && userAnswer.every(val => q.correct.includes(val));
                        else if (!isBlank && q.type === 'statement') isCorrect = Array.isArray(q.statements) && q.statements.every(st => userAnswer[st.id] === st.correct);
                        return {
                            questionId:q.id ?? `q-${index+1}`,
                            questionNo:index+1,
                            subject:q.subject||'-',
                            examTitle:examData.title||'-',
                            type:q.type||'-',
                            questionForm:q.questionForm || (q.type==='single'?'Pilihan Ganda Sederhana':q.type==='complex'?'PGK - MCMA':'PGK - Kategori'),
                            element:q.element||'-',
                            subelement:q.subelement||'-',
                            cakupanSubelemen:q.cakupanSubelemen||q.coverage||'-',
                            coverage:q.coverage||q.cakupanSubelemen||'-',
                            competency:q.competency||'-',
                            subcompetency:q.subcompetency||q.subCompetency||'-',
                            cognitiveLevel:q.cognitiveLevel||'-',
                            thinkingProcess:q.thinkingProcess||'-',
                            isCorrect,
                            status:isBlank?'blank':(isCorrect?'correct':'wrong'),
                            // Salin materi soal dan pembahasan agar tetap tersedia setelah ujian selesai.
                            text:q.text||'',
                            stimulus:q.stimulus||'',
                            stimulusTitle:q.stimulusTitle||'',
                            image:q.image||null,
                            imageAlt:q.imageAlt||'Gambar pendukung soal',
                            options:Array.isArray(q.options) ? q.options : [],
                            optionImages:Array.isArray(q.optionImages) ? q.optionImages : [],
                            statements:Array.isArray(q.statements) ? q.statements.map(st => ({id:st.id, text:st.text, image:st.image || null, correct:getEffectiveStatementMode(q)==='custom' ? String(st.correct ?? '') : !!st.correct})) : [],
                            statementMode:q.statementMode || 'tf', categories:Array.isArray(q.categories) ? q.categories : [],
                            correct:q.correct,
                            userAnswer:userAnswer,
                            explanation:q.explanation||'Pembahasan belum tersedia.'
                        };
                    });

                    const resultPayload = {
                        ...studentData,
                        studentName: studentData.fullName || studentData.name || "Peserta",
                        token: examData.token,
                        examTitle: examData.title,
                        teacherId: examData.teacherId,
                        correctCount, totalQuestions, score, questionAnalysis,
                        submittedAt: new Date().toISOString()
                    };

                    // 3. PENTING: Kirim ke alamat koleksi yang dibaca oleh Dashboard Guru
                    // Bersihkan seluruh payload (termasuk rincian soal, opsi, pernyataan,
                    // kunci, jawaban murid, dan identitas) sebelum dikirim ke Firestore.
                    const safeResultPayload = sanitizeFirestoreData(resultPayload);
                    // Satu sesi pengerjaan memiliki satu ID hasil yang stabil.
                    // Token dapat berubah, tetapi ID sesi tidak berubah saat pengiriman ulang.
                    const sessionId = String(examData.submissionSessionId || '');
                    if (!sessionId) throw new Error('ID sesi pengerjaan tidak ditemukan. Silakan masuk kembali melalui token ujian.');
                    const resultId = `r_${sessionId.replace(/[^a-zA-Z0-9_-]/g, '')}`;
                    const resultRef = doc(db, 'artifacts', appId, 'public', 'data', 'exam_results', resultId);
                    const attemptLimitId = makeAttemptLimitId(examData.teacherId || '', examData.title || '', studentData.nisn);
                    const attemptLimitRef = doc(db, 'artifacts', appId, 'public', 'data', 'exam_results', attemptLimitId);
                    const legacyAttemptsSnap = await getDocs(query(
                        collection(db, 'artifacts', appId, 'public', 'data', 'exam_results'),
                        where('teacherId', '==', examData.teacherId || ''),
                        where('examTitle', '==', examData.title || ''),
                        where('nisn', '==', String(studentData.nisn || ''))
                    ));
                    const legacyAttemptCount = legacyAttemptsSnap.docs.filter(d => d.data()._systemType !== 'attempt-limit').length;
                    await runTransaction(db, async (transaction) => {
                        const existing = await transaction.get(resultRef);
                        const limitSnap = await transaction.get(attemptLimitRef);
                        const lockData = limitSnap.exists() ? limitSnap.data() : {};
                        if (existing.exists()) {
                            const duplicateError = new Error('Pengiriman sesi ini sudah tersimpan. Nilai tidak dibuat ulang.');
                            duplicateError.code = 'already-submitted';
                            throw duplicateError;
                        }
                        if (String(lockData.activeSessionId || '') !== sessionId) {
                            const sessionError = new Error('Sesi ini sudah tidak aktif atau telah dikirim dari perangkat lain.');
                            sessionError.code = 'session-not-active';
                            throw sessionError;
                        }
                        const usedAttempts = Math.max(Number(lockData.count || 0), legacyAttemptCount);
                        if (usedAttempts >= MAX_EXAM_SUBMISSIONS_PER_STUDENT) {
                            const limitError = new Error(`Batas pengerjaan ujian ini sudah tercapai. Maksimal ${MAX_EXAM_SUBMISSIONS_PER_STUDENT} kali untuk NISN yang sama.`);
                            limitError.code = 'attempt-limit-reached';
                            throw limitError;
                        }
                        transaction.set(resultRef, {
                            ...safeResultPayload,
                            submissionSessionId: sessionId,
                            attemptNumber: usedAttempts + 1
                        });
                        transaction.set(attemptLimitRef, {
                            _systemType: 'attempt-limit',
                            teacherId: examData.teacherId || '',
                            examTitle: examData.title || '',
                            nisn: String(studentData.nisn || '').replace(/\D/g, ''),
                            count: usedAttempts + 1,
                            activeSessionId: null,
                            lastSubmittedAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        }, { merge: true });
                    });

                    // 4. Bersihkan penyimpanan lokal hanya setelah transaksi cloud berhasil.
                    try {
                        localStorage.removeItem(storageKeyAnswers);
                        localStorage.removeItem(storageKeyDoubtful);
                        localStorage.removeItem(storageKeyTime);
                        localStorage.removeItem(storageKeyDeadline);
                    } catch (storageError) {
                        console.warn('Pembersihan data lokal gagal:', storageError);
                    }

                    // 5. Pindah ke tampilan skor (Agar murid bisa melihat nilai)
                    if (document.fullscreenElement && document.exitFullscreen) {
                        document.exitFullscreen().catch(err => console.warn(err));
                    }
                    onFinish(safeResultPayload);

                } catch (e) {
                    console.error("Gagal mengirim jawaban:", e);
                    // Firestore mungkin sudah menyimpan hasil sebelum koneksi terputus.
                    // Verifikasi berdasarkan ID sesi sebelum mengizinkan percobaan ulang.
                    try {
                        const sessionId = String(examData.submissionSessionId || '');
                        if (sessionId) {
                            const committedRef = doc(db, 'artifacts', appId, 'public', 'data', 'exam_results', `r_${sessionId.replace(/[^a-zA-Z0-9_-]/g, '')}`);
                            const committedSnap = await getDoc(committedRef);
                            if (committedSnap.exists()) {
                                const committedResult = committedSnap.data();
                                try {
                                    localStorage.removeItem(storageKeyAnswers);
                                    localStorage.removeItem(storageKeyDoubtful);
                                    localStorage.removeItem(storageKeyTime);
                                    localStorage.removeItem(storageKeyDeadline);
                                } catch (_) {}
                                if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
                                onFinish(committedResult);
                                return;
                            }
                        }
                    } catch (verifyError) {
                        console.warn('Verifikasi hasil setelah gangguan jaringan gagal:', verifyError);
                    }
                    submitLockRef.current = false;
                    alert((e?.code === 'already-submitted' || e?.code === 'attempt-limit-reached' || e?.code === 'session-not-active')
                        ? e.message
                        : "Koneksi bermasalah. Jawaban belum berhasil dikonfirmasi tersimpan. Silakan coba kembali; ID sesi yang sama mencegah nilai ganda. Detail: " + e.message);
                }
            };

            // Hitung sisa waktu dari deadline absolut agar tetap akurat setelah reload/tab sleep.
            useEffect(() => {
                const tick = () => {
                    const remaining = Math.max(0, Math.ceil((deadlineAt - Date.now()) / 1000));
                    setTimeLeft(remaining);
                    if (remaining <= 0 && !autoSubmitAttemptRef.current) {
                        autoSubmitAttemptRef.current = true;
                        submitExam();
                    }
                };
                tick();
                const timer = setInterval(tick, 1000);
                return () => clearInterval(timer);
            }, [deadlineAt, answers]);
            useEffect(() => {
                renderMath();
            }, [currentQIndex]);
            
            const currentQ = examData.questions[currentQIndex];
            const formatTime = (s) => { const m = Math.floor(s / 60); const sec = s % 60; return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`; };

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col">
                {!isFullscreen && (
            <div className="fixed inset-0 z-[9999] bg-slate-900 flex flex-col items-center justify-center p-6 text-center text-white">
                <h2 className="text-2xl font-bold mb-4">Mode layar penuh terhenti</h2>
                <p className="mb-6 opacity-80">Anda keluar dari layar penuh. Klik tombol di bawah untuk kembali mengerjakan.</p>
                <button onClick={forceFullscreen} className="bg-blue-600 px-10 py-3 rounded-lg font-bold">
                    Kembali ke Layar Penuh
                </button>
            </div>
        )}
                    <ConfirmationModal isOpen={showFinishConfirm} title="Selesaikan Ujian?" message="Yakin sudah selesai?" confirmText="Ya, Selesai" onConfirm={() => { submitExam(); setShowFinishConfirm(false); }} onCancel={() => setShowFinishConfirm(false)} />
                    <header className="bg-white shadow px-6 py-4 flex justify-between items-center sticky top-0 z-10"><div className="flex items-center gap-3"><div className="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center font-bold">{studentData.name.charAt(0)}</div><div><h1 className="font-bold text-gray-800 text-sm">{studentData.name}</h1><p className="text-xs text-gray-500">{studentData.school}</p></div></div><div className={`font-mono font-bold text-xl px-4 py-2 rounded-lg flex items-center gap-2 ${timeLeft < 300 ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}><Clock size={20}/> {formatTime(timeLeft)}</div></header>
                    <main className="flex-1 max-w-5xl mx-auto w-full p-4 md:p-6 flex gap-6">
                        <div className="flex-1 bg-white p-6 md:p-8 rounded-xl shadow-sm min-h-[500px] flex flex-col"><div className="mb-6 flex justify-between items-start border-b pb-4"><div><h2 className="text-gray-400 font-bold uppercase tracking-wider text-xs mb-1">Soal Nomor</h2><span className="text-4xl font-extrabold text-gray-800">{currentQIndex + 1}</span></div><div className="flex flex-col items-end gap-2"><span className="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-bold">{currentQ.type === 'single' ? 'PG Sederhana' : currentQ.type === 'complex' ? 'PGK MCMA' : 'PGK Kategori'}</span><label className="flex items-center gap-2 cursor-pointer select-none border px-3 py-1 rounded-lg hover:bg-yellow-50 transition border-yellow-200"><input type="checkbox" checked={!!doubtful[currentQIndex]} onChange={() => setDoubtful(prev => ({ ...prev, [currentQIndex]: !prev[currentQIndex] }))} className="w-4 h-4 text-yellow-500 rounded focus:ring-yellow-500 accent-yellow-500" /><span className="text-yellow-700 font-bold text-xs flex items-center gap-1"><Flag size={12}/> Ragu-ragu</span></label></div></div><div className="mb-6">{currentQ.stimulus && (<div className="bg-slate-50 border border-slate-200 rounded-xl p-5 mb-6"><div className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">{currentQ.stimulusTitle || "Stimulus"}</div><div className="text-gray-700 leading-relaxed whitespace-pre-wrap">{currentQ.stimulus}</div></div>)}<p className="text-xl text-gray-800 font-medium leading-relaxed whitespace-pre-wrap">{currentQ.text}</p></div><div className="flex-1"><QuestionRenderer question={currentQ} currentAnswer={answers[currentQ.id]} onAnswer={(val) => setAnswers(p => ({...p, [currentQ.id]: val}))} /></div><div className="mt-8 pt-6 border-t flex justify-between"><button disabled={currentQIndex===0} onClick={()=>setCurrentQIndex(c=>c-1)} className="px-6 py-3 bg-gray-100 text-gray-600 rounded-lg font-bold hover:bg-gray-200 disabled:opacity-50 flex items-center gap-2"><ChevronLeft size={20}/> Sebelumnya</button>{currentQIndex === examData.questions.length - 1 ? <button onClick={() => setShowFinishConfirm(true)} className="px-8 py-3 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 shadow-lg flex items-center gap-2">Selesai Ujian <CheckCircle size={20}/></button> : <button onClick={()=>setCurrentQIndex(c=>c+1)} className="px-6 py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 flex items-center gap-2">Selanjutnya <ChevronRight size={20}/></button>}</div></div>
                        <div className="w-full md:w-80 shrink-0 order-last md:order-none mt-6 md:mt-0"><div className="bg-white p-4 rounded-xl shadow-sm sticky top-24"><h3 className="font-bold text-gray-700 mb-4 flex items-center gap-2"><Grid size={18}/> Navigasi Soal</h3><div className="grid grid-cols-6 md:grid-cols-5 gap-2">{examData.questions.map((q, idx) => { let isAnswered = false; if (q.type === 'complex') isAnswered = Array.isArray(answers[q.id]) && answers[q.id].length > 0; else if (q.type === 'statement') isAnswered = answers[q.id] && Object.keys(answers[q.id]).length > 0; else isAnswered = !!answers[q.id]; const isDoubt = !!doubtful[idx]; let btnClass = 'bg-gray-100 text-gray-500 border-transparent hover:bg-gray-200'; if (isAnswered) btnClass = 'bg-blue-600 text-white border-blue-600'; if (isDoubt) btnClass = 'bg-yellow-400 text-white border-yellow-400'; if (currentQIndex === idx) btnClass += ' ring-2 ring-offset-2 ring-blue-400'; return <button key={idx} onClick={() => setCurrentQIndex(idx)} className={`aspect-square rounded-lg font-bold text-sm border-2 transition ${btnClass}`}>{idx + 1}</button> })}</div></div></div>
                    </main>
                </div>
            );
        };

        const ResultView = ({ result, onLogout }) => {
            const [showReview, setShowReview] = useState(false);
            const analysis = Array.isArray(result.questionAnalysis) ? result.questionAnalysis : [];

            useEffect(() => {
                if (showReview) renderMath();
            }, [showReview]);

            const formatAnswer = (item) => {
                if (item.status === 'blank') return 'Tidak dijawab';

                if (item.type === 'statement') {
                    const ua = item.userAnswer || {};
                    if (!Array.isArray(item.statements) || !item.statements.length) return 'Jawaban tersimpan';
                    return item.statements.map((st, i) => {
                        const value = ua[st.id];
                        return `${i + 1}. ${getEffectiveStatementMode(item)==='custom' ? (value ?? 'Tidak dijawab') : (value === true ? getStatementAnswerLabel(item, true) : value === false ? getStatementAnswerLabel(item, false) : 'Tidak dijawab')}`;
                    }).join(' • ');
                }

                if (Array.isArray(item.userAnswer)) return item.userAnswer.join(', ');
                return String(item.userAnswer ?? 'Tidak dijawab');
            };

            const formatCorrect = (item) => {
                if (item.type === 'statement') {
                    if (!Array.isArray(item.statements)) return '-';
                    return item.statements.map((st, i) => `${i + 1}. ${getStatementAnswerLabel(item, st.correct)}`).join(' • ');
                }
                if (Array.isArray(item.correct)) return item.correct.join(', ');
                return String(item.correct ?? '-');
            };

            const answerClass = (item) => item.status === 'correct'
                ? 'bg-green-50 border-green-200 text-green-800'
                : item.status === 'blank'
                    ? 'bg-gray-50 border-gray-200 text-gray-700'
                    : 'bg-red-50 border-red-200 text-red-800';

            return (
                <div className="min-h-screen bg-gray-100 p-4 md:p-8">
                    <div className="max-w-3xl mx-auto">
                        <div className="bg-white p-6 md:p-8 rounded-2xl shadow-xl text-center">
                            <div className="text-yellow-500 mx-auto mb-4 w-20 h-20 flex items-center justify-center"><Award size={80}/></div>
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Hasil Ujian</h2>
                            <p className="text-gray-500 mb-6">{result.studentName}</p>
                            <div className="bg-blue-50 p-6 rounded-xl border border-blue-100 mb-6">
                                <div className="text-5xl font-extrabold text-blue-600 mb-2">{Number(result.score || 0).toFixed(2)}</div>
                                <div className="text-sm text-blue-800 font-medium">Nilai Akhir</div>
                                <div className="mt-2 text-sm font-bold px-3 py-1 bg-white rounded border border-blue-200 inline-block text-blue-600">{getScoreCategory(result.score || 0)}</div>
                            </div>
                            <p className="text-gray-600 mb-6">Benar {result.correctCount} dari {result.totalQuestions} Soal</p>

                            <div className="space-y-3">
                                <button
                                    onClick={() => setShowReview(true)}
                                    disabled={!analysis.length}
                                    className="w-full py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                                >
                                    <FileText size={20}/> Lihat Pembahasan Soal
                                </button>
                                {!analysis.length && (
                                    <p className="text-xs text-gray-500">Rincian pembahasan tidak tersedia untuk hasil ujian lama.</p>
                                )}
                                <button onClick={onLogout} className="w-full py-3 bg-gray-800 text-white rounded-lg font-bold hover:bg-gray-900">Kembali ke Menu</button>
                            </div>
                        </div>
                    </div>

                    {showReview && (
                        <div className="fixed inset-0 z-[100] bg-black/60 flex items-center justify-center p-3 md:p-6">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[92vh] flex flex-col">
                                <div className="px-5 py-4 border-b flex items-center justify-between sticky top-0 bg-white rounded-t-2xl">
                                    <div>
                                        <h3 className="text-xl md:text-2xl font-bold text-gray-800">Pembahasan Soal</h3>
                                        <p className="text-sm text-gray-500 mt-1">{result.examTitle || 'Hasil Ujian'} • {analysis.length} soal</p>
                                    </div>
                                    <button onClick={() => setShowReview(false)} className="p-2 rounded-lg hover:bg-gray-100 text-gray-600" aria-label="Tutup">
                                        <X size={24}/>
                                    </button>
                                </div>

                                <div className="overflow-y-auto custom-scrollbar p-4 md:p-6 space-y-5">
                                    {analysis.map((item, idx) => (
                                        <div key={item.questionId || idx} className={`border rounded-xl overflow-hidden ${answerClass(item)}`}>
                                            <div className="px-4 py-3 flex flex-wrap items-center justify-between gap-2 border-b bg-white/70">
                                                <div className="font-bold text-gray-800">Soal {item.questionNo || idx + 1}</div>
                                                <span className={`px-3 py-1 rounded-full text-xs font-bold ${
                                                    item.status === 'correct' ? 'bg-green-100 text-green-700' :
                                                    item.status === 'blank' ? 'bg-gray-100 text-gray-600' : 'bg-red-100 text-red-700'
                                                }`}>
                                                    {item.status === 'correct' ? '✓ Benar' : item.status === 'blank' ? 'Tidak Dijawab' : '✕ Salah'}
                                                </span>
                                            </div>

                                            <div className="p-4 md:p-5 bg-white text-gray-800">
                                                {item.stimulus && (
                                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                                                        <div className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">{item.stimulusTitle || 'Stimulus'}</div>
                                                        <div className="whitespace-pre-wrap leading-relaxed">{item.stimulus}</div>
                                                        
                                                    </div>
                                                )}

                                                {item.image && (
                                                    <div className="mb-4 text-center">
                                                        <img src={item.image} alt={item.imageAlt || 'Gambar soal'} className="max-h-72 max-w-full mx-auto object-contain rounded-lg border border-gray-100" />
                                                    </div>
                                                )}

                                                <div className="font-semibold leading-relaxed whitespace-pre-wrap mb-4">
                                                    {item.text || 'Teks soal tidak tersedia.'}
                                                </div>

                                                {item.options?.length > 0 && (
                                                    <div className="space-y-2 mb-4">
                                                        {item.options.map((option, oi) => {
                                                            const selected = Array.isArray(item.userAnswer) ? item.userAnswer.includes(option) : item.userAnswer === option;
                                                            const correct = Array.isArray(item.correct) ? item.correct.includes(option) : item.correct === option;
                                                            return (
                                                                <div key={oi} className={`border rounded-lg p-3 ${correct ? 'border-green-300 bg-green-50' : selected ? 'border-red-300 bg-red-50' : 'border-gray-200 bg-gray-50'}`}>
                                                                    <div className="flex gap-2">
                                                                        <span className="font-bold">{String.fromCharCode(65 + oi)}.</span>
                                                                        <span>{option}</span>
                                                                    </div>
                                                                    {(selected || correct) && (
                                                                        <div className="text-xs font-semibold mt-1 ml-6">
                                                                            {selected && correct ? 'Jawaban Anda • Kunci jawaban' : selected ? 'Jawaban Anda' : 'Kunci jawaban'}
                                                                        </div>
                                                                    )}
                                                                    {item.optionImages?.[oi] && <img src={item.optionImages[oi]} alt="" className="max-h-36 mt-2 rounded" />}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                )}

                                                {item.type === 'statement' && item.statements?.length > 0 && (
                                                    <div className="border rounded-lg overflow-hidden mb-4">
                                                        {item.statements.map((st, si) => {
                                                            const ua = item.userAnswer || {};
                                                            return (
                                                                <div key={st.id || si} className="grid grid-cols-1 md:grid-cols-3 gap-2 p-3 border-b last:border-b-0">
                                                                    <div className="md:col-span-2"><b>{si + 1}.</b> {st.text}{st.image && <img src={st.image} alt={`Gambar pernyataan ${si+1}`} className="mt-2 max-w-full max-h-48 object-contain rounded border bg-white"/>}</div>
                                                                    <div className="text-sm">
                                                                        <div>Jawaban Anda: <b>{getEffectiveStatementMode(item)==='custom' ? (ua[st.id] ?? 'Tidak dijawab') : (ua[st.id] === true || ua[st.id] === false ? getStatementAnswerLabel(item, ua[st.id]) : 'Tidak dijawab')}</b></div>
                                                                        <div>Kunci: <b>{getStatementAnswerLabel(item, st.correct)}</b></div>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                )}

                                                <div className="grid md:grid-cols-2 gap-3 mb-4">
                                                    <div className="rounded-lg border p-3 bg-slate-50">
                                                        <div className="text-xs font-bold text-slate-500 mb-1">JAWABAN ANDA</div>
                                                        <div className="font-semibold">{formatAnswer(item)}</div>
                                                    </div>
                                                    <div className="rounded-lg border p-3 bg-green-50 border-green-200">
                                                        <div className="text-xs font-bold text-green-700 mb-1">KUNCI JAWABAN</div>
                                                        <div className="font-semibold text-green-800">{formatCorrect(item)}</div>
                                                    </div>
                                                </div>

                                                <div className="rounded-lg border border-blue-200 bg-blue-50 p-4">
                                                    <div className="font-bold text-blue-800 mb-2 flex items-center gap-2"><FileText size={18}/> Pembahasan</div>
                                                    <div className="whitespace-pre-wrap leading-relaxed text-gray-800">{item.explanation || 'Pembahasan belum tersedia.'}</div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="px-5 py-4 border-t bg-gray-50 rounded-b-2xl flex justify-end">
                                    <button onClick={() => setShowReview(false)} className="px-5 py-2.5 bg-gray-800 text-white rounded-lg font-bold hover:bg-gray-900">Tutup Pembahasan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const LandingPage = ({ onRoleSelect }) => (
            <div className="min-h-screen relative overflow-hidden bg-gradient-to-br from-slate-950 via-blue-950 to-teal-800 flex items-center justify-center p-4 md:p-8">

                    <div className="inline-flex items-center gap-2 rounded-full bg-teal-50 border border-teal-100 px-4 py-1.5 text-xs sm:text-sm font-bold tracking-wide text-teal-800 mb-4">

                    </div>

                    <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 leading-tight mb-2">Tryout TKA SD/MI Online</h1>
                    <p className="text-slate-600 text-sm sm:text-base mb-6">Platform Ujian Berbasis Exam Browser</p>

                    <div className="h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent mb-6"></div>

                    <div className="space-y-3">
                        <button onClick={() => onRoleSelect('student')} className="w-full py-3.5 px-4 bg-gradient-to-r from-teal-600 to-blue-700 hover:from-teal-700 hover:to-blue-800 text-white font-bold rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-blue-900/20 focus:outline-none focus:ring-4 focus:ring-teal-200">
                            <User size={20}/> Masuk sebagai Murid
                        </button>

                        <div className="relative py-3">
                            <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-200"></div></div>
                            <div className="relative flex justify-center text-sm"><span className="px-3 bg-white text-slate-500 font-semibold">Area Guru</span></div>
                        </div>

                        <button onClick={() => onRoleSelect('teacher', 'login')} className="w-full py-3.5 px-4 bg-white border-2 border-slate-200 hover:border-blue-500 hover:bg-blue-50 text-slate-700 font-bold rounded-xl transition duration-200 flex items-center justify-center gap-2">
                            <LogIn size={20}/> Login Guru
                        </button>

                        <button onClick={() => onRoleSelect('teacher', 'register')} className="text-sm font-semibold text-blue-700 hover:text-teal-700 hover:underline mt-2">
                            Guru Baru? Daftar di sini
                        </button>
                    </div>

                    <div className="mt-2 mb-1 rounded-xl border border-teal-100 bg-teal-50 px-4 py-3">
                        <p className="text-xs sm:text-sm text-slate-600">Aplikasi ini dipersembahkan oleh</p>
                        <p className="text-sm sm:text-base font-extrabold tracking-wide text-teal-800 mt-1">KKG Kec. Bululawang</p>

        );

        const App = () => {
            const [view, setView] = useState('landing'); 
            const [authMode, setAuthMode] = useState('login'); // login | register
            const [user, setUser] = useState(null);
            
            // Data states
            const [activeExamData, setActiveExamData] = useState(null);
            const [studentData, setStudentData] = useState(null);
            const [resultData, setResultData] = useState(null);

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.log("Auto-login failed:", e);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                });
                return () => unsubscribe();
            }, []);

            // PERBAIKAN FUNGSI LOGOUT (Pindah halaman dulu, baru signout)
            const handleLogout = async () => {
                // 1. Pindah ke Landing Page TERLEBIH DAHULU
                setView('landing'); 
                
                // 2. Bersihkan data sesi
                setStudentData(null);
                setResultData(null);
                setActiveExamData(null);

                // 3. Lakukan proses Sign Out dan Re-login Anonymous di background
                try {
                    await signOut(auth);
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth); 
                    }
                } catch (error) {
                    console.error("Logout error:", error);
                }
            };

            const handleTeacherEntry = (mode = 'login') => {
                 setAuthMode(mode);
                 setView('auth');
            };

            return (
                <>
                    {!firebaseConfigReady && (
                        <div role="alert" className="fixed top-0 inset-x-0 z-[10000] bg-amber-100 border-b border-amber-300 text-amber-950 px-4 py-3 text-sm font-semibold text-center shadow">
                            Konfigurasi Firebase belum lengkap. Aplikasi dapat dibuka, tetapi login dan sinkronisasi cloud belum dapat dianggap siap. Isi konfigurasi Firebase Web yang benar tanpa mengganti projectId lama.
                        </div>
                    )}
                    {view === 'landing' && (
                        <LandingPage 
                            onRoleSelect={(role, mode) => {
                                if (role === 'teacher') handleTeacherEntry(mode);
                                else setView('student-portal');
                            }} 
                        />
                    )}

                    {view === 'auth' && (
                        <AuthPage 
                            initialMode={authMode}
                            user={user}
                            onContinue={() => setView('teacher')}
                            onLogout={handleLogout}
                        />
                    )}
       
                    {view === 'student-portal' && (
                        <StudentPortal
                            onRead={() => setView('materials')}
                            onTryout={() => setView('student')}
                            onBack={() => setView('landing')}
                        />
                    )}

                    {view === 'materials' && (
                        <TkaMaterials onBack={() => setView('student-portal')} />
                    )}

                    {view === 'student' && (
                        <StudentLogin 
                            onStartExam={(sData, examData) => {
                                setStudentData(sData);
                                setActiveExamData(examData);
                                setView('exam');
                                const elem = document.documentElement;
                                if (elem.requestFullscreen) {
                                    elem.requestFullscreen().catch(err => console.warn("Fullscreen diblokir:", err));
                                }
                            }} 
                            onBack={() => setView('landing')}
                        />
                    )}
                    
                    {view === 'teacher' && user && !user.isAnonymous && (
                        <TeacherDashboard 
                            user={user} 
                            onLogout={handleLogout} 
                        />
                    )}

                    {/* Loading/Fallback State */}
                    {view === 'teacher' && (!user || user.isAnonymous) && (
                         <div className="flex flex-col items-center justify-center h-screen bg-gray-100 text-gray-600">
                            <Loader2 className="animate-spin mb-2" size={32}/>
                            <p>Memuat sesi guru...</p>
                            {setTimeout(() => { if(!user || user.isAnonymous) setView('auth'); }, 2000) && ""}
                         </div>
                    )}

                    {view === 'login' && (
                        <StudentLogin 
                            onBack={() => setView('landing')} 
                            onStartExam={(sData, examData) => {
                                setStudentData(sData);
                                setActiveExamData(examData);
                                setView('exam');
                                
                                // --- FITUR FULLSCREEN ---
                                const elem = document.documentElement;
                                if (elem.requestFullscreen) {
                                    elem.requestFullscreen().catch(err => console.warn("Fullscreen diblokir:", err));
                                }
                            }} 
                        />
                    )}
                   
                    {view === 'exam' && activeExamData && studentData && (
                        <ExamInterface 
                            examData={activeExamData} 
                            studentData={studentData} 
                            onFinish={(res) => {
                                setResultData(res);
                                setView('result');
                                
                                // --- KELUAR DARI FULLSCREEN ---
                                if (document.fullscreenElement && document.exitFullscreen) {
                                    document.exitFullscreen().catch(err => console.warn("Exit Fullscreen diblokir:", err));
                                }
                            }} 
                        />
                    )}
                    
                    {view === 'result' && resultData && (
                        <ResultView 
                            result={resultData} 
                            onLogout={() => {
                                setView('landing');
                                setStudentData(null);
                                setActiveExamData(null);
                            }} 
                        />
                    )}
                </>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

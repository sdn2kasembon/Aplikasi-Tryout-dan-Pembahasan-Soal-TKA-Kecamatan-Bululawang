                { title:'Operasi Bilangan Cacah', category:'Bilangan', desc:'Memahami nilai tempat serta operasi hitung dalam soal sehari-hari.', sections:[
                    {heading:'1. Nilai tempat dan urutan operasi',body:'Bilangan cacah adalah 0, 1, 2, 3, dan seterusnya. Nilai sebuah angka bergantung pada tempatnya. Pada 4.582, angka 4 bernilai 4.000, angka 5 bernilai 500, angka 8 bernilai 80, dan angka 2 bernilai 2. Saat ada beberapa operasi, kerjakan tanda kurung terlebih dahulu, lalu perkalian atau pembagian, kemudian penjumlahan atau pengurangan.'},
                    {heading:'2. Strategi menghitung',body:'Gunakan pemecahan bilangan, pengelompokan, atau perkiraan untuk memeriksa kewajaran jawaban. Dalam soal cerita, tentukan informasi yang diketahui, hal yang ditanyakan, operasi yang sesuai, lalu tuliskan satuan jawaban.'}],
                  examples:[{q:'Perpustakaan memiliki 248 buku. Datang lagi 6 kotak, setiap kotak berisi 24 buku. Berapa buku sekarang?',a:'Buku tambahan = 6 × 24 = 144. Jumlah seluruhnya = 248 + 144 = 392 buku.'},{q:'Hitung 36 + 4 × 7.',a:'Perkalian dikerjakan lebih dahulu: 4 × 7 = 28, lalu 36 + 28 = 64.'}],practice:'Sebuah toko memiliki 375 pensil. Toko menerima 8 kotak, tiap kotak berisi 25 pensil, lalu menjual 96 pensil. Berapa pensil yang tersisa?',answer:'479 pensil',explain:'Pensil datang: 8 × 25 = 200. Setelah menerima: 375 + 200 = 575. Setelah terjual: 575 − 96 = 479.'},
                { title:'Pecahan Senilai', category:'Bilangan', desc:'Mengenali pecahan yang nilainya sama melalui gambar, benda, dan simbol.', sections:[
                    {heading:'Apa itu pecahan senilai?',body:'Pecahan menyatakan bagian dari keseluruhan yang dibagi sama besar. Pecahan senilai memiliki nilai yang sama walaupun pembilang dan penyebutnya berbeda. Kalikan atau bagi pembilang dan penyebut dengan bilangan yang sama dan bukan nol.'},
                    {heading:'Model gambar dan simbol',body:'Jika satu pizza dibagi 2 dan satu bagiannya diambil, bagian yang diambil adalah 1/2. Jika pizza lain dibagi 4 dan 2 bagian diambil, bagian itu adalah 2/4. Keduanya sama besar sehingga 1/2 = 2/4 = 4/8.'}],
                  examples:[{q:'Tentukan pecahan yang senilai dengan 3/5 dengan penyebut 20.',a:'5 × 4 = 20, maka pembilang juga dikali 4. Jadi 3/5 = 12/20.'},{q:'Apakah 6/8 senilai dengan 3/4?',a:'Ya. Pembilang dan penyebut 6/8 dibagi 2 menjadi 3/4.'}],practice:'Tuliskan pecahan yang senilai dengan 2/3 dengan penyebut 12.',answer:'8/12',explain:'3 dikali 4 menjadi 12, maka 2 juga dikali 4 menjadi 8.'},
                { title:'Membandingkan dan Mengurutkan Pecahan', category:'Bilangan', desc:'Membandingkan pecahan dengan penyebut sama, pembilang sama, atau menyamakan penyebut.', sections:[
                    {heading:'Cara membandingkan',body:'Jika penyebut sama, pecahan dengan pembilang lebih besar nilainya lebih besar. Jika pembilang sama dan pembilang positif, pecahan dengan penyebut lebih kecil nilainya lebih besar karena keseluruhan dibagi menjadi bagian yang lebih sedikit. Jika keduanya berbeda, ubah menjadi pecahan senilai dengan penyebut sama atau gunakan garis bilangan.'},
                    {heading:'Mengurutkan',body:'Untuk mengurutkan beberapa pecahan, bandingkan nilainya secara sistematis. Pastikan tanda < berarti lebih kecil dan > berarti lebih besar.'}],
                  examples:[{q:'Bandingkan 3/8 dan 5/8.',a:'Penyebut sama, bandingkan pembilang: 3 < 5, jadi 3/8 < 5/8.'},{q:'Bandingkan 2/3 dan 3/5.',a:'Samakan penyebut menjadi 15: 2/3 = 10/15 dan 3/5 = 9/15. Jadi 2/3 > 3/5.'}],practice:'Urutkan dari yang terkecil: 1/2, 3/4, 2/8.',answer:'2/8, 1/2, 3/4',explain:'2/8 = 1/4. Urutannya 1/4 < 1/2 < 3/4.'},
                { title:'Hubungan Pecahan, Desimal, dan Persen', category:'Bilangan', desc:'Mengubah bentuk bilangan dan memahami penggunaannya dalam konteks.', sections:[
                    {heading:'Tiga cara menulis bagian yang sama',body:'Pecahan, desimal, dan persen dapat menyatakan nilai yang sama. Persen berarti per seratus. Untuk mengubah pecahan menjadi desimal, lakukan pembagian pembilang dengan penyebut. Untuk mengubah desimal menjadi persen, kalikan 100%. Untuk mengubah persen menjadi pecahan, tulis di atas 100 lalu sederhanakan.'},
                    {heading:'Nilai yang sering digunakan',body:'1/2 = 0,5 = 50%; 1/4 = 0,25 = 25%; 3/4 = 0,75 = 75%; 1/10 = 0,1 = 10%. Gunakan hubungan ini untuk membaca diskon, bagian yang terisi, atau hasil survei.'}],
                  examples:[{q:'Ubah 3/5 menjadi desimal dan persen.',a:'3 ÷ 5 = 0,6. Kemudian 0,6 × 100% = 60%.'},{q:'Berapa 25% dari 80 buku?',a:'25% = 1/4. Seperempat dari 80 adalah 80 ÷ 4 = 20 buku.'}],practice:'Dalam sebuah kelas, 0,4 bagian murid mengikuti klub sains. Tuliskan dalam bentuk persen.',answer:'40%',explain:'0,4 × 100% = 40%.'},
                { title:'Operasi Penjumlahan dan Pengurangan Pecahan', category:'Bilangan', desc:'Menjumlahkan atau mengurangkan pecahan dengan penyebut sama dan berbeda.', sections:[
                    {heading:'Penyebut sama',body:'Jika penyebut sama, jumlahkan atau kurangkan pembilang dan pertahankan penyebut. Contoh: 2/7 + 3/7 = 5/7.'},
                    {heading:'Penyebut berbeda',body:'Samakan penyebut menggunakan pecahan senilai, kemudian operasikan pembilang. Sederhanakan hasil jika pembilang dan penyebut memiliki faktor persekutuan.'}],
                  examples:[{q:'Hitung 1/4 + 2/4.',a:'Penyebut sama, jadi (1 + 2)/4 = 3/4.'},{q:'Hitung 1/2 + 1/3.',a:'Penyebut sama 6: 1/2 = 3/6 dan 1/3 = 2/6. Hasilnya 5/6.'}],practice:'Ibu menggunakan 3/8 kg tepung, lalu 2/8 kg lagi. Berapa kilogram tepung yang digunakan?',answer:'5/8 kg',explain:'Penyebut sama, jadi 3/8 + 2/8 = 5/8 kg.'},
                { title:'Perkalian dan Pembagian Pecahan dengan Bilangan Asli', category:'Bilangan', desc:'Menggunakan pecahan sebagai bagian dari kelompok atau pembagian sama rata.', sections:[
                    {heading:'Perkalian pecahan dengan bilangan asli',body:'Untuk mengalikan pecahan dengan bilangan asli, kalikan pembilang dengan bilangan tersebut dan pertahankan penyebut, lalu sederhanakan jika perlu. Contoh: 3 × 1/4 = 3/4.'},
                    {heading:'Pembagian pecahan dengan bilangan asli',body:'Membagi pecahan dengan bilangan asli berarti membagi bagian itu menjadi kelompok yang sama. Secara hitung, a/b ÷ n = a/(b × n), untuk n bukan nol.'}],
                  examples:[{q:'Hitung 4 × 2/5.',a:'4 × 2/5 = 8/5 = 1 3/5.'},{q:'Hitung 3/4 ÷ 2.',a:'3/4 dibagi 2 menjadi 3/8.'}],practice:'Ada 5 potong pita, setiap potong panjangnya 2/3 meter. Berapa panjang seluruh pita?',answer:'10/3 meter atau 3 1/3 meter',explain:'5 × 2/3 = 10/3 = 3 1/3 meter.'},
                { title:'Faktor, Kelipatan, KPK, dan FPB', category:'Bilangan', desc:'Menentukan faktor dan kelipatan serta memilih KPK atau FPB untuk masalah.', sections:[
                    {heading:'Faktor dan kelipatan',body:'Faktor suatu bilangan membagi bilangan itu tanpa sisa. Faktor 12 antara lain 1, 2, 3, 4, 6, dan 12. Kelipatan 4 adalah 4, 8, 12, 16, dan seterusnya.'},
                    {heading:'KPK dan FPB',body:'KPK adalah kelipatan persekutuan terkecil; gunakan untuk kejadian berulang yang ingin diketahui waktu bersamaan. FPB adalah faktor persekutuan terbesar; gunakan untuk membagi benda menjadi kelompok sama banyak sebesar mungkin tanpa sisa.'}],
                  examples:[{q:'Tentukan KPK dari 6 dan 8.',a:'Kelipatan 6: 6, 12, 18, 24. Kelipatan 8: 8, 16, 24. KPK = 24.'},{q:'Tentukan FPB dari 18 dan 24.',a:'Faktor persekutuan terbesar adalah 6, jadi FPB = 6.'}],practice:'Lampu A berkedip setiap 4 detik dan lampu B setiap 6 detik. Jika sekarang berkedip bersama, berapa detik lagi keduanya berkedip bersama?',answer:'12 detik',explain:'Cari KPK 4 dan 6. KPK = 12.'},
                { title:'Bangun Datar dan Sifatnya', category:'Geometri dan Pengukuran', desc:'Mengenali dan membandingkan sifat segitiga, segiempat, dan segi banyak berdasarkan sisi, sudut, serta ciri bentuknya.', sections:[
                    {heading:'Sisi, sudut, dan titik sudut',body:'Bangun datar adalah bentuk dua dimensi. Segitiga memiliki 3 sisi dan jumlah sudut 180°. Persegi memiliki 4 sisi sama panjang dan 4 sudut siku-siku. Persegi panjang memiliki sisi berhadapan sama panjang dan 4 sudut siku-siku. Jajar genjang memiliki dua pasang sisi berhadapan sejajar.'},
                    {heading:'Membedakan bentuk',body:'Perhatikan jumlah sisi, panjang sisi, kesejajaran, dan jenis sudut. Bangun segi banyak adalah bangun tertutup yang dibatasi ruas garis lurus.'}],
                  examples:[{q:'Bangun memiliki empat sisi sama panjang dan empat sudut siku-siku. Bangun apakah itu?',a:'Persegi, karena semua sisinya sama panjang dan semua sudutnya siku-siku.'},{q:'Berapa jumlah sudut dalam segitiga?',a:'Jumlah sudut dalam segitiga adalah 180°.'}],practice:'Sebutkan dua sifat yang dimiliki persegi panjang.',answer:'Sisi yang berhadapan sama panjang dan sejajar; keempat sudutnya siku-siku.',explain:'Sifat tersebut membedakan persegi panjang dari bangun segiempat lain.'},
                { title:'Keliling dan Luas Bangun Datar', category:'Geometri dan Pengukuran', desc:'Menghitung panjang batas dan ukuran daerah segitiga, segiempat, serta segi banyak sederhana.', sections:[
                    {heading:'Keliling',body:'Keliling adalah jumlah panjang semua sisi. Persegi: K = 4 × sisi. Persegi panjang: K = 2 × (panjang + lebar). Untuk segitiga, jumlahkan ketiga sisi.'},
                    {heading:'Luas',body:'Luas mengukur daerah di dalam bangun. Persegi: L = sisi × sisi. Persegi panjang: L = panjang × lebar. Segitiga: L = 1/2 × alas × tinggi. Satuan luas ditulis persegi, misalnya cm² atau m².'}],
                  examples:[{q:'Persegi panjang panjang 9 cm dan lebar 4 cm. Tentukan keliling dan luasnya.',a:'Keliling = 2 × (9 + 4) = 26 cm. Luas = 9 × 4 = 36 cm².'},{q:'Segitiga memiliki alas 10 cm dan tinggi 6 cm. Berapa luasnya?',a:'Luas = 1/2 × 10 × 6 = 30 cm².'}],practice:'Taman berbentuk persegi dengan sisi 7 m. Berapa keliling dan luas taman?',answer:'Keliling 28 m; luas 49 m².',explain:'Keliling = 4 × 7 = 28 m. Luas = 7 × 7 = 49 m².'},
                { title:'Bangun Ruang dan Visualisasi Spasial', category:'Geometri dan Pengukuran', desc:'Memahami kubus, balok, gabungan bangun ruang, serta tampak depan, atas, dan samping.', sections:[
                    {heading:'Ciri kubus dan balok',body:'Kubus memiliki 6 sisi berbentuk persegi yang sama besar, 12 rusuk sama panjang, dan 8 titik sudut. Balok memiliki 6 sisi berbentuk persegi panjang (pasangan sisi berhadapan sama ukuran), 12 rusuk, dan 8 titik sudut.'},
                    {heading:'Membaca tampak',body:'Tampak depan, atas, dan samping menunjukkan apa yang terlihat dari arah berbeda. Pada susunan kubus satuan, hitung banyak kubus yang terlihat dari tiap arah. Kubus yang tertutup oleh kubus lain mungkin tidak terlihat pada tampak tertentu.'}],
                  examples:[{q:'Sebuah benda tersusun dari 3 kubus berjajar. Berapa kubus terlihat dari tampak atas?',a:'Jika ketiganya berjajar satu lapis, tampak atas menunjukkan 3 persegi satuan.'},{q:'Berapa banyak rusuk pada kubus?',a:'Kubus memiliki 12 rusuk.'}],practice:'Sebuah susunan terdiri atas 4 kubus satuan berjajar dalam satu lapis. Berapa persegi satuan terlihat pada tampak atas?',answer:'4 persegi satuan',explain:'Setiap kubus pada satu lapis memiliki satu sisi atas yang terlihat; empat kubus menghasilkan empat persegi.'},
                { title:'Pengukuran Panjang', category:'Geometri dan Pengukuran', desc:'Memilih satuan panjang dan mengubah satuan mm, cm, dm, m, dam, hm, dan km.', sections:[
                    {heading:'Memilih satuan',body:'Gunakan mm atau cm untuk benda kecil, m untuk panjang ruang atau benda besar, dan km untuk jarak antartempat. Dalam tangga satuan metrik, turun satu tingkat dikali 10; naik satu tingkat dibagi 10.'},
                    {heading:'Konversi',body:'1 m = 100 cm; 1 km = 1.000 m; 1 cm = 10 mm. Sebelum menjumlahkan ukuran, samakan satuannya terlebih dahulu.'}],
                  examples:[{q:'Ubah 3,5 m menjadi cm.',a:'1 m = 100 cm, maka 3,5 × 100 = 350 cm.'},{q:'Jarak 2 km 300 m sama dengan berapa meter?',a:'2 km = 2.000 m. Tambahkan 300 m menjadi 2.300 m.'}],practice:'Pita sepanjang 4 m dipotong 75 cm. Berapa sentimeter pita yang tersisa?',answer:'325 cm',explain:'4 m = 400 cm. Sisa = 400 − 75 = 325 cm.'},
                { title:'Pengukuran Volume dan Kapasitas', category:'Geometri dan Pengukuran', desc:'Mengukur isi benda cair dan mengubah satuan ml, cl, dl, l, dal, hl, dan kl.', sections:[
                    {heading:'Volume dan kapasitas',body:'Volume menyatakan ruang yang ditempati benda, sedangkan kapasitas menyatakan banyaknya cairan yang dapat ditampung wadah. Satuan yang sering digunakan adalah mililiter (ml) dan liter (l). 1 l = 1.000 ml.'},
                    {heading:'Konversi satuan',body:'Samakan satuan sebelum menjumlah atau mengurangkan. Contohnya, 1,5 l = 1.500 ml. Periksa apakah jawaban masuk akal dibandingkan ukuran wadah.'}],
                  examples:[{q:'Dua botol masing-masing berisi 750 ml air. Berapa liter seluruhnya?',a:'2 × 750 = 1.500 ml = 1,5 liter.'}],practice:'Sebuah wadah berisi 2 liter air. Sebanyak 650 ml digunakan. Berapa mililiter air yang tersisa?',answer:'1.350 ml',explain:'2 liter = 2.000 ml. Sisa = 2.000 − 650 = 1.350 ml.'},
                { title:'Pengukuran Berat atau Massa', category:'Geometri dan Pengukuran', desc:'Memilih satuan mg, g, kg dan mengubahnya untuk menghitung massa benda.', sections:[
                    {heading:'Satuan massa',body:'Gunakan mg untuk massa yang sangat kecil, g untuk benda ringan, dan kg untuk benda yang lebih berat. 1 kg = 1.000 g; 1 g = 1.000 mg. Satuan dag dan hg juga termasuk tangga satuan metrik.'},
                    {heading:'Menghitung total atau sisa',body:'Ubah semua massa ke satuan yang sama sebelum menjumlahkan atau mengurangkan. Tuliskan satuan pada jawaban.'}],
                  examples:[{q:'Beras 2 kg ditambah gula 500 g. Berapa gram massanya?',a:'2 kg = 2.000 g. Total = 2.000 + 500 = 2.500 g.'}],practice:'Satu paket memiliki 1,5 kg tepung dan 250 g kacang. Berapa gram massa seluruhnya?',answer:'1.750 g',explain:'1,5 kg = 1.500 g. Total = 1.500 + 250 = 1.750 g.'},
                { title:'Waktu dan Hubungan Antarsatuan Waktu', category:'Geometri dan Pengukuran', desc:'Menghitung durasi, mengubah satuan waktu, dan menyelesaikan jadwal.', sections:[
                    {heading:'Satuan waktu',body:'1 menit = 60 detik; 1 jam = 60 menit; 1 hari = 24 jam; 1 pekan = 7 hari. Jumlah hari dalam bulan tidak selalu sama, jadi gunakan informasi kalender bila soal menyangkut tanggal.'},
                    {heading:'Menghitung durasi',body:'Untuk mencari lama kegiatan, hitung selisih waktu mulai dan selesai. Jika melewati satu jam, ubah ke menit atau hitung bagian waktunya secara bertahap.'}],
                  examples:[{q:'Kegiatan dimulai pukul 08.35 dan selesai pukul 10.05. Berapa lama?',a:'08.35 ke 09.35 = 1 jam; ke 10.05 = 30 menit. Total 1 jam 30 menit.'}],practice:'Film mulai pukul 13.45 dan berlangsung 95 menit. Pukul berapa film selesai?',answer:'Pukul 15.20',explain:'95 menit = 1 jam 35 menit. 13.45 + 1 jam = 14.45; tambah 35 menit = 15.20.'},
                { title:'Kecepatan dan Laju Perubahan', category:'Geometri dan Pengukuran', desc:'Menghubungkan jarak, waktu, dan kecepatan rata-rata dalam situasi sehari-hari.', sections:[
                    {heading:'Hubungan jarak, waktu, dan kecepatan',body:'Kecepatan rata-rata = jarak ÷ waktu. Jarak = kecepatan × waktu, sedangkan waktu = jarak ÷ kecepatan. Pastikan satuan sesuai, misalnya kilometer dan jam untuk km/jam.'},
                    {heading:'Memeriksa kewajaran',body:'Jika jarak tetap, waktu yang lebih singkat berarti kecepatan rata-rata lebih besar. Jika kecepatan tetap, waktu lebih lama berarti jarak yang ditempuh lebih jauh.'}],
                  examples:[{q:'Sepeda menempuh 24 km dalam 2 jam. Berapa kecepatan rata-ratanya?',a:'24 ÷ 2 = 12 km/jam.'}],practice:'Bus menempuh 150 km dengan kecepatan rata-rata 50 km/jam. Berapa lama perjalanan tanpa berhenti?',answer:'3 jam',explain:'Waktu = jarak ÷ kecepatan = 150 ÷ 50 = 3 jam.'},
                { title:'Volume Kubus, Balok, dan Gabungannya', category:'Geometri dan Pengukuran', desc:'Menghitung banyak ruang dalam kubus, balok, dan bentuk gabungan sederhana.', sections:[
                    {heading:'Rumus volume',body:'Volume kubus = sisi × sisi × sisi. Volume balok = panjang × lebar × tinggi. Jika ukuran dalam cm, volume dinyatakan dalam cm³. Satu kubus satuan berukuran 1 cm × 1 cm × 1 cm memiliki volume 1 cm³.'},
                    {heading:'Bangun gabungan',body:'Untuk bangun gabungan yang tersusun dari bagian-bagian tanpa tumpang tindih, hitung volume setiap bagian lalu jumlahkan. Jika ada bagian yang dipotong atau kosong, kurangkan volume bagian itu.'}],
                  examples:[{q:'Kubus memiliki rusuk 4 cm. Berapa volumenya?',a:'4 × 4 × 4 = 64 cm³.'},{q:'Balok berukuran 5 cm × 3 cm × 2 cm. Berapa volumenya?',a:'5 × 3 × 2 = 30 cm³.'}],practice:'Akuarium berbentuk balok berukuran panjang 8 dm, lebar 4 dm, dan tinggi 5 dm. Berapa volumenya?',answer:'160 dm³',explain:'Volume = 8 × 4 × 5 = 160 dm³.'},
                { title:'Besar Sudut dan Penaksiran Ukuran', category:'Geometri dan Pengukuran', desc:'Mengenali sudut dan memperkirakan ukuran secara masuk akal.', sections:[
                    {heading:'Jenis sudut',body:'Sudut lancip kurang dari 90°, sudut siku-siku tepat 90°, sudut tumpul lebih dari 90° tetapi kurang dari 180°, dan sudut lurus 180°. Gunakan sudut siku-siku sebagai acuan untuk memperkirakan sudut lain.'},
                    {heading:'Penaksiran ukuran',body:'Taksiran adalah perkiraan yang masuk akal, bukan hasil pengukuran tepat. Bandingkan dengan benda yang ukurannya dikenal, misalnya panjang pensil sekitar belasan sentimeter atau tinggi pintu sekitar dua meter. Sesuaikan taksiran dengan konteks.'}],
                  examples:[{q:'Sudut 35° termasuk jenis sudut apa?',a:'Sudut lancip karena kurang dari 90°.'},{q:'Sudut 120° termasuk jenis sudut apa?',a:'Sudut tumpul karena lebih dari 90° dan kurang dari 180°.'}],practice:'Sebuah sudut lebih besar daripada 90° tetapi lebih kecil daripada 180°. Termasuk jenis apakah sudut itu?',answer:'Sudut tumpul',explain:'Sudut tumpul besarnya di antara 90° dan 180°.'},
                { title:'Penyajian Data: Tabel Frekuensi', category:'Data', desc:'Menyusun data ke dalam tabel, membaca frekuensi, dan membandingkan informasi.', sections:[
                    {heading:'Apa itu tabel data?',body:'Tabel adalah cara menyajikan informasi dalam baris dan kolom agar data mudah dibaca. Judul menjelaskan isi tabel; kepala kolom menyebutkan kategori atau ukuran; setiap baris berisi data untuk satu kategori. Tabel harus memiliki label yang jelas dan angka yang sesuai dengan satuannya.'},
                    {heading:'Membaca frekuensi dan total',body:'Frekuensi menunjukkan banyaknya objek atau kejadian pada suatu kategori. Untuk mencari jumlah seluruh data, jumlahkan semua frekuensi. Untuk mencari selisih, kurangkan nilai terbesar dengan nilai terkecil. Periksa kembali apakah angka yang dihitung berasal dari baris dan kolom yang tepat.'},
                    {heading:'Membuat tabel dari data cerita',body:'Baca informasi satu per satu, tentukan kategori yang akan dibandingkan, lalu catat jumlahnya pada baris yang sesuai. Pastikan tidak ada data yang tercatat dua kali atau terlewat. Jika data berupa hasil pilihan, satu kategori harus memiliki jumlah yang konsisten dengan informasi soal.'},
                    {heading:'Strategi menjawab soal TKA',body:'Soal dapat meminta menemukan nilai terbesar/terkecil, menghitung total atau selisih, membandingkan dua kategori, atau menilai kesimpulan yang didukung tabel. Jangan menambahkan dugaan yang tidak tercantum pada data.'}],
                  examples:[{q:'Tabel peminjaman buku menunjukkan Senin 12 buku, Selasa 15 buku, dan Rabu 9 buku. Berapa total buku yang dipinjam?',a:'12 + 15 + 9 = 36 buku.'},{q:'Berapakah selisih peminjaman terbanyak dan tersedikit?',a:'Terbanyak 15 dan tersedikit 9, sehingga selisihnya 15 − 9 = 6 buku.'}],
                  practice:'Kelas IV mengumpulkan botol bekas: kelompok A 14 botol, B 18 botol, dan C 11 botol. Berapa jumlah botol seluruhnya dan selisih kelompok terbanyak dengan tersedikit?',
                  answer:'Jumlah 43 botol; selisih 7 botol.',
                  explain:'Jumlah = 14 + 18 + 11 = 43. Selisih = 18 − 11 = 7 botol.'},
                { title:'Penyajian Data: Piktogram dan Kunci Gambar', category:'Data', desc:'Membaca piktogram, memahami nilai satu gambar, dan menghitung data bergambar.', sections:[
                    {heading:'Apa itu piktogram?',body:'Piktogram menyajikan data menggunakan gambar atau simbol. Setiap gambar mewakili sejumlah objek tertentu. Keterangan yang menjelaskan nilai satu gambar disebut kunci. Contoh: jika 1 gambar buku mewakili 2 buku, maka 4 gambar mewakili 4 × 2 = 8 buku.'},
                    {heading:'Membaca kunci gambar',body:'Selalu periksa kunci sebelum menghitung. Jika satu gambar mewakili 5 benda, tiga gambar berarti 15 benda, bukan 3 benda. Gambar dapat mewakili satuan yang berbeda pada piktogram lain, sehingga jangan menggunakan kunci dari soal sebelumnya.'},
                    {heading:'Setengah gambar dan data yang tidak genap',body:'Pada beberapa piktogram, setengah gambar dapat digunakan untuk mewakili setengah dari nilai satu gambar. Misalnya, jika satu gambar mewakili 4 buah, setengah gambar mewakili 2 buah. Gunakan cara ini hanya jika keterangan atau soal mengizinkannya.'},
                    {heading:'Membandingkan dan menghitung',body:'Untuk mencari total, jumlahkan nilai setiap kelompok berdasarkan kunci. Untuk mencari selisih, ubah gambar menjadi jumlah benda terlebih dahulu, lalu kurangkan. Nilai terbanyak ditunjukkan oleh kelompok dengan nilai data paling besar, bukan selalu gambar yang tampak lebih besar.'},
                    {heading:'Strategi menjawab soal TKA',body:'Tentukan kunci, hitung nilai setiap baris, lalu jawab pertanyaan. Jika diminta memeriksa pernyataan, cocokkan setiap pernyataan dengan hasil hitungan dan jangan menebak hanya dari banyaknya gambar.'}],
                  examples:[{q:'Pada piktogram, 1 gambar apel mewakili 3 apel. Jika kelompok Merah memiliki 5 gambar, berapa apel yang dikumpulkan?',a:'5 × 3 = 15 apel.'},{q:'Kelompok A memiliki 4 gambar dan kelompok B 6 gambar. Jika satu gambar mewakili 2 benda, berapa selisih jumlah benda?',a:'A = 4 × 2 = 8; B = 6 × 2 = 12. Selisih = 12 − 8 = 4 benda.'}],
                  practice:'Pada piktogram, satu gambar pensil mewakili 4 pensil. Kelas A memiliki 3 gambar, kelas B 5 gambar, dan kelas C 2 gambar. Berapa jumlah pensil seluruhnya?',
                  answer:'40 pensil.',
                  explain:'Jumlah gambar = 3 + 5 + 2 = 10. Setiap gambar mewakili 4 pensil, sehingga 10 × 4 = 40 pensil.'},
                { title:'Penyajian Data: Diagram Batang', category:'Data', desc:'Membaca sumbu dan skala serta membandingkan tinggi batang pada diagram.', sections:[
                    {heading:'Bagian-bagian diagram batang',body:'Diagram batang menggunakan batang berbentuk persegi panjang untuk membandingkan jumlah antar kategori. Sumbu mendatar biasanya memuat nama kategori, sedangkan sumbu tegak memuat angka atau skala. Judul menyebutkan data yang dibandingkan. Tinggi batang menunjukkan nilai kategori tersebut.'},
                    {heading:'Membaca skala dengan benar',body:'Perhatikan jarak antar garis pada sumbu tegak. Jika angka bertambah 2 setiap garis, satu garis mewakili 2 satuan; jangan menganggap setiap garis selalu bernilai 1. Batang harus dibaca dari garis dasar dan disesuaikan dengan angka pada skala.'},
                    {heading:'Membandingkan nilai',body:'Batang tertinggi menunjukkan nilai terbesar dan batang terendah menunjukkan nilai terkecil. Selisih diperoleh dengan mengurangkan kedua nilai. Total beberapa kategori diperoleh dengan menjumlahkan nilai yang dibaca dari masing-masing batang.'},
                    {heading:'Membuat diagram batang',body:'Tentukan kategori dan nilainya, buat sumbu mendatar serta tegak, pilih skala yang teratur, lalu gambar batang dengan lebar seragam. Beri jarak antarb batang dan tulis judul serta label sumbu. Semua batang harus dimulai dari garis dasar yang sama agar perbandingan tidak menyesatkan.'},
                    {heading:'Strategi menjawab soal TKA',body:'Baca judul, label, dan skala terlebih dahulu. Setelah itu, catat nilai kategori yang diperlukan, lakukan perhitungan, dan nilai apakah kesimpulan benar-benar didukung diagram.'}],
                  examples:[{q:'Diagram batang menunjukkan jumlah buku: Rani 6, Dito 9, dan Sari 4. Siapa yang meminjam buku paling banyak?',a:'Dito, karena 9 buku adalah nilai terbesar.'},{q:'Berapa jumlah buku ketiganya dan selisih Dito dengan Sari?',a:'Jumlah = 6 + 9 + 4 = 19 buku. Selisih = 9 − 4 = 5 buku.'}],
                  practice:'Diagram batang menunjukkan peserta klub: Sains 12, Seni 8, Olahraga 15, dan Musik 5 murid. Berapa total peserta dan selisih klub dengan peserta terbanyak dan tersedikit?',
                  answer:'Total 40 murid; selisih 10 murid.',
                  explain:'Total = 12 + 8 + 15 + 5 = 40. Selisih = 15 − 5 = 10 murid.'}
                ,{ title:'Penyajian Data: Gambar', category:'Data', desc:'Membaca dan menggunakan gambar sebagai cara menyajikan data, termasuk memastikan satu gambar mewakili satu atau beberapa benda.', sections:[
                    {heading:'Gambar sebagai penyajian data',body:'Data dapat disajikan dengan gambar benda yang mewakili jumlah tertentu. Sebelum menghitung, periksa judul, nama kategori, dan keterangan gambar. Jangan menganggap satu gambar selalu berarti satu benda; nilai gambar harus mengikuti keterangan pada penyajian data.'},
                    {heading:'Membandingkan dan menggunakan informasi',body:'Hitung jumlah yang diwakili setiap kategori, lalu bandingkan sesuai pertanyaan. Jika gambar mewakili satu benda, hitung gambarnya. Jika gambar mewakili beberapa benda, kalikan banyak gambar dengan nilai setiap gambar. Untuk membuat keputusan, gunakan data yang benar-benar tersedia dan hindari kesimpulan yang tidak didukung.'},
                    {heading:'Strategi penalaran',body:'Baca keterangan gambar terlebih dahulu, ubah gambar menjadi jumlah, lalu periksa total atau selisih yang dibutuhkan. Jika dua penyajian tampak berbeda, periksa apakah nilai satu gambar sama atau berbeda.'}],
                  examples:[{q:'Dalam laporan kerja bakti, satu gambar kantong mewakili 5 kantong sampah. Kelompok Melati mengumpulkan 4 gambar dan kelompok Kenanga 6 gambar. Berapa kantong yang dikumpulkan kedua kelompok dan berapa selisihnya?',a:'Melati: 4 × 5 = 20 kantong. Kenanga: 6 × 5 = 30 kantong. Total = 50 kantong dan selisih = 10 kantong.'},{q:'Papan kelas menampilkan 7 gambar buku untuk kelompok A dan 5 gambar buku untuk kelompok B. Keterangan menyatakan satu gambar mewakili 2 buku. Seorang murid menyimpulkan kelompok A mengumpulkan 2 buku lebih banyak. Apakah kesimpulannya tepat?',a:'Tidak. Selisih gambar adalah 7 − 5 = 2 gambar, tetapi setiap gambar mewakili 2 buku. Selisih sebenarnya 2 × 2 = 4 buku.'}],
                  practice:'Pada papan pengumpulan botol, satu gambar botol mewakili 4 botol. Kelas 5A memiliki 8 gambar dan kelas 5B memiliki 6 gambar. Berapa jumlah botol seluruhnya, dan apakah benar kelas 5A mengumpulkan 8 botol lebih banyak?',answer:'56 botol; pernyataan selisih 8 botol benar.',explain:'Total gambar = 8 + 6 = 14, sehingga total botol = 14 × 4 = 56. Selisih gambar = 2, jadi selisih botol = 2 × 4 = 8.'},
                { title:'Pengambilan Informasi dan Penggunaan Data', category:'Data', desc:'Menarik informasi, membandingkan data, memeriksa pernyataan, dan menggunakan data untuk mengambil keputusan yang masuk akal.', sections:[
                    {heading:'Informasi langsung dan hasil pengolahan',body:'Informasi langsung dapat dibaca dari angka atau kategori yang ditampilkan. Informasi lain perlu diperoleh dengan menghitung jumlah, selisih, urutan, atau gabungan beberapa kategori. Pastikan satuan dan kategori yang dibandingkan sama.'},
                    {heading:'Memeriksa klaim berdasarkan data',body:'Sebuah pernyataan dapat didukung data, bertentangan dengan data, atau tidak dapat dipastikan dari data yang tersedia. Periksa setiap angka dan lakukan perhitungan yang diperlukan sebelum menerima kesimpulan.'},
                    {heading:'Menggunakan data untuk mengambil keputusan',body:'Data dapat membantu memilih jadwal, menentukan kebutuhan, atau membandingkan hasil kegiatan. Keputusan yang baik menggunakan informasi yang relevan, mempertimbangkan batasan yang disebutkan, dan tidak membuat asumsi yang tidak tercantum.'}],
                  examples:[{q:'Catatan perpustakaan menunjukkan buku yang dipinjam: Senin 18, Selasa 24, Rabu 16, dan Kamis 22. Petugas ingin menambah jam layanan pada hari dengan peminjaman terbanyak. Hari mana yang dipilih, dan berapa selisihnya dengan hari terendah?',a:'Selasa memiliki jumlah terbanyak, 24 buku. Rabu terendah, 16 buku. Selisihnya 24 − 16 = 8 buku.'},{q:'Dari 40 murid, 15 memilih olahraga, 12 memilih seni, dan sisanya memilih sains. Seorang murid mengatakan bahwa pemilih sains lebih banyak daripada pemilih olahraga. Apakah pernyataan itu benar?',a:'Jumlah pemilih sains = 40 − 15 − 12 = 13. Karena 13 lebih kecil daripada 15, pernyataan tersebut tidak benar.'}],
                  practice:'Panitia memiliki 60 kupon. Sebanyak 18 kupon digunakan pada pagi hari, 23 pada siang hari, dan sisanya pada sore hari. Panitia ingin menyimpan sedikitnya 15 kupon untuk kegiatan besok. Apakah kupon sore hari boleh digunakan seluruhnya tanpa mengurangi target simpanan? Jelaskan.',answer:'Tidak. Sisa kupon sore hari 19, sehingga jika seluruhnya digunakan, tidak ada 15 kupon yang tersisa.',explain:'Sisa setelah pagi dan siang = 60 − 18 − 23 = 19 kupon. Jika semuanya digunakan pada sore hari, sisa akhir 0, kurang dari target 15 kupon. Paling banyak 4 kupon sore yang dapat digunakan agar 15 tetap tersimpan.'},

                { title:'Bilangan Rasional dan Operasi Hitung Campuran', category:'Bilangan', desc:'Memahami bilangan rasional serta urutan operasi hitung campuran bilangan cacah dan pecahan.', sections:[
                    {heading:'Bilangan rasional',body:'Bilangan rasional dapat ditulis sebagai a/b dengan a dan b bilangan bulat serta b tidak sama dengan nol. Contohnya pecahan 3/4, bilangan bulat 5 (= 5/1), dan desimal 0,25 (= 1/4). Bentuk pecahan, desimal, dan persen dapat mewakili nilai yang sama.'},
                    {heading:'Urutan operasi hitung campuran',body:'Kerjakan operasi dalam tanda kurung terlebih dahulu. Berikutnya kerjakan perkalian dan pembagian dari kiri ke kanan, lalu penjumlahan dan pengurangan dari kiri ke kanan. Periksa kembali apakah hasilnya masuk akal dan tuliskan satuan jika soal berbentuk cerita.'},
                    {heading:'Strategi menyelesaikan soal cerita',body:'Tandai informasi yang diketahui dan yang ditanyakan. Tentukan operasi yang sesuai, lakukan perhitungan sesuai urutan, lalu tafsirkan hasil sesuai konteks. Jangan langsung menghitung dari kiri ke kanan jika terdapat perkalian, pembagian, atau tanda kurung.'}],
                  examples:[{q:'Hitung 36 + 4 × 7.',a:'Kerjakan perkalian dahulu: 4 × 7 = 28. Kemudian 36 + 28 = 64.'},{q:'Sebuah kelompok memiliki 48 kue. Sebanyak 12 kue dibagikan, lalu sisanya dimasukkan sama banyak ke 6 kotak. Berapa kue per kotak?',a:'Sisa kue = 48 − 12 = 36. Setiap kotak berisi 36 ÷ 6 = 6 kue.'}],
                  practice:'Ibu membeli 5 kantong jeruk, setiap kantong berisi 8 jeruk. Sebanyak 7 jeruk diberikan kepada tetangga. Berapa jeruk yang tersisa?',answer:'33 jeruk',explain:'Jumlah awal 5 × 8 = 40 jeruk. Setelah 7 diberikan, tersisa 40 − 7 = 33 jeruk.'},
                { title:'Hubungan Antarsatuan Panjang, Volume, dan Berat', category:'Geometri dan Pengukuran', desc:'Mengubah satuan panjang, kapasitas/volume, dan berat sesuai konteks pengukuran.', sections:[
                    {heading:'Satuan panjang',body:'Satuan panjang yang umum digunakan antara lain kilometer (km), meter (m), sentimeter (cm), dan milimeter (mm). Hubungan penting: 1 km = 1.000 m, 1 m = 100 cm, dan 1 cm = 10 mm. Saat mengubah ke satuan yang lebih kecil, nilai angka biasanya dikalikan; ke satuan yang lebih besar, dibagi sesuai faktor konversi.'},
                    {heading:'Satuan volume dan kapasitas',body:'Volume benda dapat dinyatakan dengan satuan kubik, misalnya cm³ atau dm³. Kapasitas cairan sering dinyatakan dalam liter dan mililiter: 1 L = 1.000 mL. Untuk satuan kubik, 1 dm³ = 1.000 cm³. Perhatikan apakah soal menanyakan ruang yang ditempati benda atau kapasitas wadah.'},
                    {heading:'Satuan berat atau massa',body:'Satuan yang umum dipakai adalah kilogram (kg), gram (g), dan miligram (mg). Hubungan penting: 1 kg = 1.000 g dan 1 g = 1.000 mg. Samakan satuan terlebih dahulu sebelum membandingkan, menjumlahkan, atau mencari selisih berat.'},
                    {heading:'Memilih satuan dan memeriksa hasil',body:'Pilih satuan yang sesuai dengan benda dan konteks. Panjang kelas lebih sesuai dinyatakan dalam meter daripada milimeter; isi botol dalam liter atau mililiter; berat buah dalam gram atau kilogram. Setelah menghitung, periksa apakah besarnya hasil wajar.'}],
                  examples:[{q:'Pita sepanjang 2,4 m dipotong 35 cm. Berapa sentimeter pita yang tersisa?',a:'2,4 m = 240 cm. Sisa pita = 240 − 35 = 205 cm.'},{q:'Sebuah wadah berisi 1,5 L air. Berapa mililiter air tersebut?',a:'1,5 × 1.000 = 1.500 mL.'}],
                  practice:'Ibu memiliki 3 kg tepung dan menggunakan 750 g. Berapa gram tepung yang tersisa?',answer:'2.250 gram',explain:'3 kg = 3.000 g. Sisa = 3.000 − 750 = 2.250 g.'}
            ];

            // Panduan belajar tambahan dengan bahasa sederhana, langkah kerja, dan kesalahan umum.
            // Dipakai pada tampilan materi dan pada PDF agar materi yang diunduh tetap lengkap.
            // Perincian tambahan mengacu pada cakupan materi dalam lampiran Matematika TKA SD.
            // Konten ini sengaja menjadi bagian dari sections agar muncul pada tampilan materi dan PDF.
            const mathReferenceExpansions = {
              'Operasi Bilangan Cacah': [
                {heading:'3. Membaca dan menulis bilangan berdasarkan nilai tempat',body:'Kelompokkan angka dari kanan: satuan, puluhan, ratusan, ribuan, dan seterusnya. Contoh 32.506 dibaca tiga puluh dua ribu lima ratus enam. Nilai angka 2 pada bilangan ini adalah 2.000 karena menempati tempat ribuan. Nol berfungsi sebagai penanda tempat agar posisi angka lain tidak bergeser.'},
                {heading:'4. Memilih operasi dari situasi sehari-hari',body:'Penjumlahan digunakan untuk menggabungkan jumlah; pengurangan untuk mencari sisa atau selisih; perkalian untuk kelompok sama banyak; pembagian untuk membagi sama rata atau mengetahui banyak kelompok. Kata dalam soal hanya petunjuk—pastikan operasi cocok dengan hubungan antarbilangan.'},
                {heading:'5. Memeriksa hasil dengan operasi kebalikan',body:'Periksa penjumlahan dengan pengurangan, perkalian dengan pembagian, dan pengurangan dengan penjumlahan. Pembulatan juga dapat digunakan untuk memeriksa kewajaran. Jika 398 + 205, hasilnya seharusnya dekat dengan 600, bukan 60 atau 6.000.'}
              ],
              'Pecahan Senilai': [
                {heading:'3. Menghubungkan gambar, bagian, dan simbol pecahan',body:'Penyebut menunjukkan banyaknya bagian sama besar dalam satu keseluruhan, sedangkan pembilang menunjukkan banyak bagian yang diperhatikan. Jika satu bentuk dibagi 4 bagian sama besar dan 2 bagian diarsir, pecahannya 2/4. Jika bentuk lain dibagi 8 bagian sama besar dan 4 bagian diarsir, pecahannya 4/8. Kedua gambar menunjukkan bagian yang sama, sehingga 2/4 = 4/8 = 1/2.'},
                {heading:'4. Menentukan pecahan senilai dengan menyederhanakan',body:'Untuk menyederhanakan pecahan, bagilah pembilang dan penyebut dengan faktor yang sama sampai tidak dapat disederhanakan lagi. Contoh 12/18 dibagi 6 menjadi 2/3. Nilai pecahan tidak berubah karena pembilang dan penyebut dibagi bilangan yang sama.'}
              ],
              'Membandingkan dan Mengurutkan Pecahan': [
                {heading:'3. Menggunakan garis bilangan dan acuan 0, 1/2, serta 1',body:'Pada garis bilangan, pecahan yang terletak lebih ke kanan bernilai lebih besar. Untuk memperkirakan nilai, gunakan acuan 0, 1/2, dan 1. Misalnya 3/8 kurang dari 1/2, sedangkan 5/8 lebih dari 1/2. Cara ini membantu memeriksa hasil perbandingan.'},
                {heading:'4. Mengurutkan pecahan dengan penyebut yang sama',body:'Jika penyebut berbeda, ubah pecahan menjadi pecahan senilai dengan penyebut yang sama. Contoh 1/2, 2/3, dan 3/4 dapat ditulis menjadi 6/12, 8/12, dan 9/12. Jadi urutan dari terkecil adalah 1/2, 2/3, lalu 3/4.'}
              ],
              'Hubungan Pecahan, Desimal, dan Persen': [
                {heading:'3. Mengubah bentuk bilangan secara bertahap',body:'Pecahan a/b diubah menjadi desimal dengan membagi a oleh b. Desimal diubah menjadi persen dengan mengalikan 100. Persen diubah menjadi pecahan dengan menuliskannya di atas 100, lalu menyederhanakan. Contoh 3/4 = 3 ÷ 4 = 0,75 = 75/100 = 75%.'},
                {heading:'4. Menentukan bagian dari suatu jumlah',body:'Untuk mencari 20% dari 150, ubah 20% menjadi 20/100 atau 0,2, lalu hitung 0,2 × 150 = 30. Cara lain: 20% = 1/5, sehingga 150 ÷ 5 = 30. Pilih cara yang paling mudah dan periksa apakah jumlah yang diperoleh masuk akal.'}
              ],
              'Operasi Penjumlahan dan Pengurangan Pecahan': [
                {heading:'3. Pecahan berpenyebut berbeda',body:'Penyebut harus sama sebelum pembilang dijumlahkan atau dikurangkan. Contoh 1/2 + 1/4: ubah 1/2 menjadi 2/4, lalu 2/4 + 1/4 = 3/4. Untuk 5/6 − 1/3, ubah 1/3 menjadi 2/6, sehingga 5/6 − 2/6 = 3/6 = 1/2.'},
                {heading:'4. Pecahan campuran dalam soal cerita',body:'Pecahan campuran terdiri atas bilangan bulat dan pecahan, misalnya 1 1/2 meter. Samakan satuan dan ubah ke bentuk yang memudahkan perhitungan bila diperlukan. Setelah operasi selesai, sederhanakan hasil dan tuliskan satuannya.'}
              ],
              'Perkalian dan Pembagian Pecahan dengan Bilangan Asli': [
                {heading:'3. Menentukan beberapa bagian yang sama',body:'Jika setiap paket membutuhkan 2/3 meter pita dan dibuat 4 paket, kebutuhan total adalah 4 × 2/3 = 8/3 = 2 2/3 meter. Perkalian pecahan dengan bilangan asli dapat dipahami sebagai penjumlahan berulang bagian yang sama.'},
                {heading:'4. Membagi pecahan atau jumlah secara merata',body:'Baca dengan teliti apakah yang dibagi adalah jumlah benda atau ukuran pecahan. Jika 3 meter tali dipotong menjadi 6 bagian sama panjang, tiap bagian 3 ÷ 6 = 1/2 meter. Gambarkan situasinya bila masih sulit membedakan jumlah bagian dan ukuran tiap bagian.'}
              ],
              'Faktor, Kelipatan, KPK, dan FPB': [
                {heading:'3. Mengenali bilangan prima dan faktorisasi sederhana',body:'Bilangan prima memiliki tepat dua faktor positif, yaitu 1 dan bilangan itu sendiri; contohnya 2, 3, 5, dan 7. Faktorisasi prima menuliskan bilangan sebagai perkalian bilangan prima. Contoh 12 = 2 × 2 × 3. Faktorisasi dapat membantu menentukan FPB dan KPK.'},
                {heading:'4. Memilih FPB atau KPK dalam soal cerita',body:'Gunakan FPB ketika beberapa benda hendak dibagi menjadi kelompok sama besar sebanyak mungkin tanpa sisa. Gunakan KPK ketika mencari waktu dua kegiatan berulang terjadi bersamaan lagi. Periksa konteks: “membagi tanpa sisa” biasanya mengarah ke FPB, sedangkan “bersamaan lagi” biasanya mengarah ke KPK.'}
              ],
              'Bangun Datar dan Sifatnya': [
                {heading:'3. Ciri bangun datar yang perlu dibandingkan',body:'Persegi mempunyai empat sisi sama panjang dan empat sudut siku-siku. Persegi panjang memiliki sisi berhadapan sama panjang dan empat sudut siku-siku. Segitiga memiliki tiga sisi; jenisnya dapat dikenali dari panjang sisi atau besar sudut. Jajargenjang memiliki dua pasang sisi berhadapan sejajar, sedangkan trapesium memiliki sepasang sisi sejajar menurut definisi yang digunakan di materi ini.'},
                {heading:'4. Mengenali bangun meskipun posisinya diputar',body:'Sifat bangun tidak berubah saat gambar diputar atau dimiringkan. Persegi yang berdiri seperti wajik tetap persegi jika keempat sisinya sama panjang dan sudutnya siku-siku. Gunakan jumlah sisi, kesamaan panjang, kesejajaran, dan sudut—bukan hanya arah gambar.'}
              ],
              'Keliling dan Luas Bangun Datar': [
                {heading:'3. Membedakan keliling dan luas',body:'Keliling adalah panjang seluruh garis tepi bangun, sehingga satuannya satu dimensi seperti cm atau m. Luas adalah ukuran daerah di dalam bangun, sehingga satuannya persegi seperti cm² atau m². Pagar mengelilingi kebun berkaitan dengan keliling; rumput yang menutup permukaan kebun berkaitan dengan luas.'},
                {heading:'4. Rumus dasar dan satuan',body:'Persegi: keliling = 4 × sisi dan luas = sisi × sisi. Persegi panjang: keliling = 2 × (panjang + lebar) dan luas = panjang × lebar. Untuk bangun gabungan, pecah menjadi bentuk sederhana, hitung bagian yang diperlukan, lalu jumlahkan atau kurangkan sesuai konteks. Pastikan semua ukuran memakai satuan yang sama.'}
              ],
              'Bangun Ruang dan Visualisasi Spasial': [
                {heading:'3. Sisi, rusuk, titik sudut, dan jaring-jaring',body:'Sisi adalah bidang pembatas bangun ruang, rusuk adalah pertemuan dua sisi, dan titik sudut adalah pertemuan beberapa rusuk. Kubus mempunyai 6 sisi persegi, 12 rusuk sama panjang, dan 8 titik sudut. Balok juga mempunyai 6 sisi, 12 rusuk, dan 8 titik sudut, tetapi ukuran sisi-sisinya dapat berbeda. Jaring-jaring adalah susunan bidang datar yang dapat dilipat menjadi bangun ruang.'},
                {heading:'4. Membaca tampak depan, samping, dan atas',body:'Satu susunan kubus dapat terlihat berbeda dari arah yang berbeda. Tampak depan menunjukkan bagian yang terlihat dari depan; tampak samping dari samping; tampak atas dari atas. Saat menghitung kubus satuan, perhatikan kubus yang mungkin tertutup di belakang atau di bawah susunan.'}
              ],
              'Pengukuran Panjang': [
                {heading:'3. Mengukur dengan alat dan satuan baku',body:'Gunakan penggaris untuk benda kecil, meteran untuk benda atau ruangan yang lebih panjang, dan alat ukur jarak sesuai kebutuhan. Letakkan titik awal benda tepat pada angka nol, baca skala sejajar dengan ujung benda, dan tulis satuannya. Jika alat tidak dimulai dari nol, panjang benda adalah selisih angka pada kedua ujung.'},
                {heading:'4. Memilih satuan panjang yang masuk akal',body:'Milimeter dan sentimeter cocok untuk benda kecil, meter untuk tinggi pintu atau panjang ruangan, sedangkan kilometer untuk jarak antartempat. Pilih satuan yang sesuai agar angka tidak terlalu besar atau terlalu kecil. Sebelum menjumlahkan atau mengurangkan panjang, samakan satuannya.'}
              ],
              'Pengukuran Volume dan Kapasitas': [

            const mathLearningGuide = (m) => {
                const t = (m?.title || '').toLowerCase();
                let idea = 'Pahami arti setiap informasi, tentukan apa yang ditanyakan, pilih cara yang sesuai, lalu periksa kembali hasilnya.';
                let steps = ['Baca soal perlahan dan tandai informasi yang diketahui.', 'Tuliskan hal yang ditanyakan dengan kata-kata sendiri.', 'Pilih operasi, gambar, tabel, atau rumus yang membantu.', 'Kerjakan langkah demi langkah, lalu tuliskan jawaban beserta satuannya.', 'Periksa apakah jawaban masuk akal dan menjawab pertanyaan.'];
                let reminders = ['Jangan terburu-buru memilih operasi hanya karena melihat satu kata dalam soal.', 'Pastikan satuan atau label yang digunakan sesuai dengan pertanyaan.', 'Jika jawaban terasa tidak masuk akal, periksa kembali perhitungan dan informasi soal.'];
                let key = 'Informasi diketahui → strategi → perhitungan → jawaban → pemeriksaan.';
                if (/operasi bilangan cacah/.test(t)) { idea='Bilangan cacah dimulai dari 0 dan terus bertambah: 0, 1, 2, 3, dan seterusnya. Setiap digit memiliki nilai sesuai posisinya. Contoh 4.582 terdiri atas 4 ribuan, 5 ratusan, 8 puluhan, dan 2 satuan.'; steps=['Uraikan bilangan menurut nilai tempat jika diperlukan.', 'Untuk soal cerita, tentukan apakah jumlah bertambah, berkurang, dikelompokkan sama banyak, atau dihitung berulang.', 'Jika ada beberapa operasi, kerjakan tanda kurung terlebih dahulu, lalu perkalian/pembagian, kemudian penjumlahan/pengurangan.', 'Tuliskan perhitungan antara agar mudah diperiksa.', 'Periksa hasil dengan perkiraan atau operasi kebalikan.']; reminders=['Jangan mengerjakan operasi campuran hanya dari kiri ke kanan.', 'Angka 0 pada suatu posisi tetap menunjukkan nilai tempat, meskipun nilainya nol.']; key='Nilai digit = digit × nilai tempat. Urutan operasi: kurung → kali/bagi → tambah/kurang.'; }
                else if (/pecahan senilai/.test(t)) { idea='Pecahan menunjukkan bagian dari satu keseluruhan yang dibagi menjadi bagian sama besar. Pecahan senilai tampak berbeda, tetapi nilainya sama, misalnya 1/2 = 2/4 = 4/8.'; steps=['Pastikan keseluruhan dibagi menjadi bagian yang sama besar.', 'Kalikan atau bagi pembilang dan penyebut dengan bilangan yang sama dan bukan nol.', 'Periksa bahwa nilai pecahan tidak berubah.', 'Gunakan gambar, potongan kertas, atau garis bilangan untuk membayangkan ukurannya.']; reminders=['Pembilang dan penyebut harus diubah dengan faktor yang sama.', 'Menambah angka yang sama pada pembilang dan penyebut tidak selalu menghasilkan pecahan senilai.']; key='Pecahan senilai: pembilang dan penyebut dikali/dibagi faktor yang sama.'; }
                else if (/membandingkan dan mengurutkan pecahan/.test(t)) { idea='Membandingkan pecahan berarti menentukan bagian mana yang lebih kecil atau lebih besar dari keseluruhan yang sama.'; steps=['Jika penyebut sama, bandingkan pembilang.', 'Jika pembilang sama dan positif, pecahan dengan penyebut lebih kecil memiliki bagian lebih besar.', 'Jika pembilang dan penyebut berbeda, ubah ke penyebut sama atau gunakan gambar/garis bilangan.', 'Setelah membandingkan, urutkan dari nilai terkecil ke terbesar atau sebaliknya sesuai perintah.']; reminders=['Jangan membandingkan pecahan hanya dari besar angka penyebutnya.', 'Periksa apakah soal meminta urutan terkecil ke terbesar atau terbesar ke terkecil.']; key='Tanda < berarti lebih kecil; tanda > berarti lebih besar; tanda = berarti sama nilainya.'; }
                else if (/pecahan, desimal, dan persen/.test(t)) { idea='Pecahan, desimal, dan persen dapat menyatakan bagian yang sama. Persen berarti “per seratus”. Contoh: 1/2 = 0,5 = 50%.'; steps=['Pecahan ke desimal: bagi pembilang dengan penyebut.', 'Desimal ke persen: kalikan nilainya dengan 100 lalu beri tanda %.', 'Persen ke pecahan: tulis persen di atas 100, kemudian sederhanakan.', 'Untuk mencari p% dari jumlah, ubah p% menjadi pecahan/desimal lalu kalikan dengan jumlah.']; reminders=['50% bukan 50 kali; 50% berarti 50 dari setiap 100.', 'Saat mengubah ke persen, jangan lupa tanda %.']; key='1/2 = 0,5 = 50%; 1/4 = 0,25 = 25%; 3/4 = 0,75 = 75%; 1/10 = 0,1 = 10%.'; }
                else if (/penjumlahan dan pengurangan pecahan/.test(t)) { idea='Pecahan hanya dapat dijumlahkan atau dikurangkan langsung jika menunjukkan ukuran bagian yang sejenis. Karena itu, penyebut perlu sama terlebih dahulu.'; steps=['Periksa penyebut kedua pecahan.', 'Jika sama, jumlahkan/kurangkan pembilang dan pertahankan penyebut.', 'Jika berbeda, ubah menjadi pecahan senilai dengan penyebut sama.', 'Lakukan operasi pada pembilang.', 'Sederhanakan hasil jika memungkinkan dan tuliskan satuan pada soal cerita.']; reminders=['Jangan menjumlahkan penyebut.', 'Samakan penyebut terlebih dahulu jika nilainya berbeda.']; key='a/c + b/c = (a+b)/c. Jika penyebut berbeda, buat penyebut sama sebelum menghitung.'; }
                else if (/perkalian dan pembagian pecahan/.test(t)) { idea='Pecahan dari suatu jumlah dapat dimaknai sebagai bagian dari jumlah tersebut. Pembagian sama rata berarti membagi jumlah menjadi kelompok dengan ukuran sama.'; steps=['Untuk bilangan asli × pecahan, kalikan bilangan asli dengan pembilang.', 'Pertahankan penyebut, lalu sederhanakan jika perlu.', 'Untuk membagi jumlah benda sama rata, tentukan jumlah benda dan banyak kelompok.', 'Baca kembali konteks untuk memastikan apakah yang dicari jumlah bagian atau ukuran tiap bagian.']; reminders=['Jangan tertukar antara “berapa bagian yang diambil” dan “berapa banyak dalam setiap bagian”.', 'Tuliskan satuan akhir sesuai benda pada soal.']; key='n × a/b = (n × a)/b. Pembagian sama rata: jumlah seluruh benda ÷ banyak kelompok.'; }
                else if (/faktor, kelipatan, kpk, dan fpb/.test(t)) { idea='Faktor membagi suatu bilangan tanpa sisa. Kelipatan diperoleh dengan mengalikan bilangan dengan 1, 2, 3, dan seterusnya. FPB adalah faktor persekutuan terbesar; KPK adalah kelipatan persekutuan terkecil.'; steps=['Tuliskan faktor atau kelipatan dari setiap bilangan.', 'Cari bilangan yang sama pada kedua daftar.', 'Untuk FPB, pilih faktor persekutuan paling besar.', 'Untuk KPK, pilih kelipatan persekutuan paling kecil yang bukan nol.', 'Dalam soal cerita, FPB sering terkait membagi atau mengelompokkan; KPK sering terkait kejadian berulang bersama.']; reminders=['Jangan menukar arti FPB dan KPK.', 'KPK dicari dari kelipatan, sedangkan FPB dicari dari faktor.']; key='FPB: faktor bersama terbesar. KPK: kelipatan bersama terkecil.'; }
                else if (/bangun datar dan sifatnya/.test(t)) { idea='Bangun datar adalah bentuk dua dimensi yang memiliki panjang dan lebar. Kenali bangun dari jumlah sisi, titik sudut, sisi sejajar, dan sudutnya.'; steps=['Hitung jumlah sisi dan titik sudut.', 'Periksa apakah sisi berhadapan sama panjang atau sejajar.', 'Perhatikan sudut, termasuk sudut siku-siku.', 'Gunakan sifat tersebut untuk membedakan persegi, persegi panjang, segitiga, jajargenjang, trapesium, dan bangun lain.']; reminders=['Persegi juga termasuk persegi panjang karena memiliki empat sudut siku-siku.', 'Jangan menilai bangun hanya dari posisi atau arah gambarnya.']; key='Kenali bangun berdasarkan sifatnya, bukan hanya penampilan atau kemiringan gambar.'; }
                else if (/keliling dan luas bangun datar/.test(t)) { idea='Keliling adalah panjang seluruh garis tepi bangun. Luas adalah besar daerah yang ditutupi bangun. Keduanya berbeda: keliling memakai satuan panjang, luas memakai satuan persegi.'; steps=['Gambar atau tandai ukuran yang diketahui.', 'Untuk keliling, jumlahkan panjang semua sisi.', 'Untuk luas, pilih rumus sesuai bangun.', 'Masukkan angka dengan satuan yang konsisten.', 'Periksa apakah jawaban yang diminta keliling (cm, m) atau luas (cm², m²).']; reminders=['Jangan menggunakan rumus luas saat yang ditanya keliling.', 'Luas tidak ditulis dalam satuan panjang biasa; gunakan satuan persegi.']; key='Persegi: K = 4 × sisi, L = sisi × sisi. Persegi panjang: K = 2 × (p+l), L = p × l. Segitiga: L = 1/2 × alas × tinggi.'; }
                else if (/bangun ruang dan visualisasi spasial/.test(t)) { idea='Bangun ruang memiliki panjang, lebar, dan tinggi serta menempati ruang. Tampak depan, atas, dan samping menunjukkan bangun dari arah pandang yang berbeda.'; steps=['Perhatikan jumlah sisi, rusuk, dan titik sudut jika diperlukan.', 'Bayangkan atau gambar bangun dari arah depan, atas, dan samping.', 'Gunakan kubus satuan untuk membantu membayangkan susunan benda.', 'Hitung bagian yang terlihat dan ingat bahwa sebagian kubus mungkin tertutup dari satu arah.']; reminders=['Gambar tampak atas tidak selalu memperlihatkan tinggi bangun.', 'Kubus dan balok memiliki sisi datar; jangan menyamakan rusuk dengan sisi.']; key='Sisi adalah bidang, rusuk adalah pertemuan dua sisi, dan titik sudut adalah pertemuan rusuk.'; }
                else if (/pengukuran panjang/.test(t)) { idea='Panjang menyatakan jarak dari satu ujung ke ujung lain. Gunakan alat dan satuan baku yang sesuai agar hasil pengukuran dapat dibandingkan.'; steps=['Pilih alat ukur yang sesuai, misalnya penggaris atau meteran.', 'Letakkan titik awal benda pada angka nol alat ukur.', 'Baca skala tepat di ujung benda.', 'Tuliskan hasil dan satuannya.', 'Jika membandingkan dua panjang, samakan satuannya terlebih dahulu.']; reminders=['Jangan mulai mengukur dari ujung penggaris jika tidak tepat di angka nol.', 'Jangan menulis angka tanpa satuan.']; key='1 m = 100 cm; 1 cm = 10 mm; 1 km = 1.000 m.'; }
                else if (/pengukuran volume dan kapasitas/.test(t)) { idea='Kapasitas menyatakan banyaknya cairan yang dapat ditampung wadah. Liter dan mililiter sering digunakan untuk cairan; volume ruang dapat pula dinyatakan dalam satuan kubik.'; steps=['Perhatikan apakah soal membahas isi cairan atau ruang bangun.', 'Samakan satuan sebelum menjumlahkan atau mengurangkan.', 'Gunakan 1 L = 1.000 mL untuk konversi liter dan mililiter.', 'Lakukan operasi, lalu tuliskan satuan hasil.']; reminders=['Jangan mencampur liter dan mililiter dalam satu perhitungan tanpa mengubah satuan.', 'Kapasitas wadah dan jumlah cairan saat ini tidak selalu sama.']; key='1 L = 1.000 mL; 1 dm³ = 1 L; 1 cm³ = 1 mL.'; }
                else if (/pengukuran berat atau massa/.test(t)) { idea='Massa benda sering disebut berat dalam percakapan sehari-hari. Satuan yang digunakan antara lain kilogram, gram, dan miligram.'; steps=['Pilih satuan yang sesuai dengan ukuran benda.', 'Ubah ke satuan yang sama sebelum menghitung.', 'Jumlahkan atau kurangkan nilainya.', 'Tulis satuan pada jawaban dan periksa kewajarannya.']; reminders=['1 kg bukan 100 g, melainkan 1.000 g.', 'Pastikan semua angka sudah memakai satuan yang sama.']; key='1 kg = 1.000 g; 1 g = 1.000 mg.'; }

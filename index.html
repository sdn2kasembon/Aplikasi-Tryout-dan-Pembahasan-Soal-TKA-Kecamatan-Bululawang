            const readingPassages = {
    "Memahami Teks Fiksi": "Pada Sabtu pagi, Nara datang ke taman baca di balai desa. Ia membawa buku cerita yang sudah selesai dibacanya. Di dekat rak, Nara melihat Bimo duduk murung sambil membolak-balik tas. Bimo ternyata lupa membawa buku untuk kegiatan membaca bersama. Ia takut tidak dapat mengikuti diskusi kelompok.\n\nNara menawarkan buku ceritanya untuk dibaca bersama. Namun, ia lebih dulu bertanya kepada penjaga taman baca apakah buku itu boleh dipakai berdua. Setelah mendapat izin, mereka duduk di dekat jendela dan membaca bergantian. Nara tidak langsung menceritakan akhir cerita karena ingin Bimo menemukan sendiri bagian yang menarik.\n\nKetika kegiatan dimulai, Bimo menyampaikan pendapat tentang tokoh utama. Ia menjelaskan bahwa tokoh itu berani mengakui kesalahan dan memperbaikinya. Nara menambahkan contoh dari bagian cerita yang mereka baca. Teman-teman kelompok mendengarkan dan mengajukan pertanyaan.\n\nSebelum pulang, Bimo berterima kasih kepada Nara. Nara merasa senang karena dapat membantu tanpa mengambil alih tugas temannya. Ia juga belajar bahwa berbagi bukan berarti melakukan semuanya untuk orang lain, melainkan memberi kesempatan agar orang lain tetap ikut berusaha.",
    "Memahami Teks Informasi": "Sekolah Cendekia membuat program pengumpulan sampah kertas untuk mengurangi sampah di kelas. Setiap kelas menyediakan kotak khusus di dekat pintu. Murid memasukkan kertas bekas yang masih dapat didaur ulang, seperti lembar latihan yang sudah tidak digunakan dan potongan karton bersih. Tisu kotor serta kertas yang terkena minyak tidak dimasukkan karena sulit diolah kembali.\n\nSetiap Jumat, petugas kelas menimbang kertas yang terkumpul dan mencatat beratnya pada tabel. Catatan itu ditempel di papan informasi agar semua kelas dapat membandingkan hasil pengumpulan. Guru mengingatkan bahwa tujuan program bukan untuk berlomba menghasilkan sampah terbanyak, melainkan membiasakan murid menggunakan kertas secara bijak.\n\nSebagian kertas yang terkumpul diberikan kepada bank sampah setempat. Sebagian karton bersih digunakan kembali untuk membuat label tanaman dan bahan prakarya. Murid juga mulai memakai kedua sisi kertas saat membuat rancangan, selama tulisan sebelumnya tidak mengganggu.\n\nSetelah satu bulan, jumlah kertas yang dibuang ke tempat sampah biasa berkurang. Sekolah menyimpulkan bahwa pemilahan dan penggunaan ulang dapat membantu mengurangi sampah. Program tersebut berhasil karena dilakukan bersama, dicatat secara teratur, dan disertai perubahan kebiasaan sehari-hari.",
    "Gagasan Utama dan Gagasan Pendukung": "SD Harapan mengadakan kegiatan kebun kelas untuk mengenalkan murid pada cara merawat tanaman. Setiap kelas mendapat satu petak kecil di belakang sekolah. Sebelum menanam, murid mengamati keadaan tanah dan memilih tanaman yang sesuai. Kelas IV menanam bayam karena tanaman itu dapat dipanen dalam waktu relatif singkat. Kelas V memilih cabai dan tomat, sedangkan kelas VI menanam bunga untuk menarik kupu-kupu.\n\nSetiap kelompok membagi tugas. Ada murid yang menyiram, mencatat pertumbuhan, membersihkan gulma, dan mengukur tinggi tanaman setiap pekan. Catatan pertumbuhan ditulis dalam tabel agar perubahan mudah dibandingkan. Jika daun tampak layu, kelompok memeriksa kelembapan tanah sebelum menambah air. Dengan cara itu, murid tidak menyiram tanaman secara berlebihan.\n\nGuru meminta setiap kelompok menyampaikan hasil pengamatan pada akhir bulan. Mereka menjelaskan tanaman yang tumbuh baik, kendala yang ditemukan, dan tindakan yang membantu tanaman berkembang. Kegiatan ini bukan sekadar membuat halaman sekolah lebih hijau. Murid juga belajar bekerja sama, membaca perubahan berdasarkan bukti, serta mencatat informasi secara teratur. Dari kegiatan tersebut, sekolah menyimpulkan bahwa kebun kelas menjadi sarana belajar yang menggabungkan pengamatan, tanggung jawab, dan kerja kelompok.",
    "Informasi Tersurat": "Perpustakaan SD Tunas Ilmu membuka layanan setiap hari sekolah. Pada Senin sampai Kamis, murid dapat meminjam buku mulai pukul 07.15 hingga 12.30. Pada Jumat, layanan peminjaman berakhir lebih awal, yaitu pukul 10.30, karena petugas perlu menata kembali buku dan memeriksa ruang baca. Murid yang ingin meminjam buku harus membawa kartu anggota perpustakaan.\n\nSetiap murid boleh meminjam paling banyak dua buku selama tujuh hari. Jika belum selesai membaca, buku dapat diperpanjang satu kali dengan melapor kepada petugas sebelum batas pengembalian. Buku referensi, seperti kamus besar dan atlas sekolah, hanya boleh dibaca di ruang perpustakaan agar dapat digunakan oleh banyak murid.\n\nPerpustakaan menyediakan rak cerita, rak pengetahuan, dan rak majalah anak. Label warna pada rak membantu murid menemukan buku. Label hijau digunakan untuk cerita, label biru untuk buku pengetahuan, sedangkan label kuning untuk majalah. Murid diminta mengembalikan buku ke meja petugas, bukan menaruhnya sembarangan di rak.\n\nPada akhir bulan, petugas mencatat jumlah peminjaman dan jenis buku yang paling sering dibaca. Catatan itu digunakan untuk menentukan buku tambahan yang perlu dibeli sekolah. Dengan demikian, layanan perpustakaan disusun berdasarkan kebutuhan pembaca dan aturan yang jelas.",
    "Inferensi dan Kesimpulan": "Pagi itu, halaman sekolah tampak lebih gelap daripada biasanya. Awan tebal menutupi sebagian langit, dan angin mulai menggoyangkan daun-daun di dekat lapangan. Siswa kelas VI yang sedang menyiapkan pameran karya segera memindahkan beberapa poster dari meja luar ke teras. Mereka juga menutup kotak berisi kertas warna agar tidak terkena air.\n\nAlya memeriksa daftar perlengkapan, lalu meminta dua temannya membantu membawa maket dari halaman. Ia tidak mengatakan bahwa hujan pasti turun, tetapi ia melihat beberapa tanda yang membuatnya khawatir. Guru yang mendampingi mereka menyetujui keputusan itu dan menyarankan agar semua bahan diletakkan di tempat beratap.\n\nBeberapa menit kemudian, rintik hujan mulai jatuh. Angin membawa percikan air hingga ke tepi teras. Poster yang sudah dipindahkan tetap kering, sedangkan satu kain penutup yang tertinggal di lapangan menjadi basah. Kelompok itu lalu memeriksa kembali barang-barang mereka dan memastikan tidak ada bahan yang tertinggal.\n\nSetelah hujan reda, pameran tetap dapat disiapkan sesuai jadwal. Alya menyadari bahwa keputusan yang baik kadang dibuat sebelum masalah benar-benar terjadi. Petunjuk kecil, seperti perubahan awan dan angin, dapat membantu seseorang memperkirakan kemungkinan keadaan, tetapi perkiraan tetap berbeda dari kepastian.",
    "Evaluasi dan Apresiasi": "Dalam pelajaran sains, kelompok Rafi diminta membuat penyaring air sederhana dari botol bekas, pasir, kerikil, dan kain bersih. Ketika kelompok mulai bekerja, hasil saringan pertama masih keruh. Rafi ingin segera mengulang dengan menambahkan lebih banyak pasir, tetapi Siska mengusulkan agar mereka memeriksa susunan bahan terlebih dahulu.\n\nMereka membaca kembali petunjuk kegiatan. Ternyata, kain harus diletakkan di bagian bawah dan kerikil di atas lapisan pasir. Kelompok itu memperbaiki susunan bahan, lalu menuangkan air secara perlahan. Hasilnya tampak lebih jernih, meskipun guru mengingatkan bahwa air tersebut belum tentu aman diminum tanpa pengolahan lebih lanjut.\n\nRafi mengakui bahwa ia tadi terburu-buru mengambil keputusan. Siska tidak mengejeknya; ia mengajak semua anggota mencatat perubahan yang dilakukan dan membandingkan hasil sebelum serta sesudah perbaikan. Catatan kelompok menunjukkan bahwa mengikuti petunjuk dan menguji dugaan membantu mereka memahami proses dengan lebih baik.\n\nSaat mempresentasikan hasil, mereka menjelaskan keberhasilan sekaligus keterbatasan percobaan. Guru memuji kejujuran mereka karena tidak menyebut air hasil saringan itu sebagai air minum yang pasti aman. Kelompok tersebut belajar bahwa penilaian yang baik perlu didukung bukti, dan kesalahan dapat menjadi kesempatan untuk memperbaiki cara kerja.",
    "Kosakata, Makna, dan Ungkapan": "Di kebun sekolah, murid kelas V mempelajari berbagai tanaman yang tumbuh di lingkungan mereka. Bu Maya menjelaskan bahwa kata “tanaman” merupakan kata umum karena mencakup banyak jenis. Cabai, bayam, melati, dan pohon mangga merupakan contoh yang lebih khusus. Murid lalu menempelkan kartu nama tanaman pada kelompok yang sesuai.\n\nSaat mengamati kebun, Dimas membaca tulisan pada papan: “Gunakan air secara hemat.” Ia bertanya arti kata hemat. Bu Maya menjelaskan bahwa hemat berarti menggunakan sesuatu secukupnya dan tidak boros. Petunjuknya terlihat dari kegiatan murid yang menyiram tanaman dengan jumlah air yang diperlukan, bukan membiarkan keran terus terbuka.\n\nDi dekat pagar, terdapat kalimat “Mawar itu tumbuh subur.” Kata subur berarti tumbuh dengan baik. Sementara itu, ungkapan “tangan kanan ketua kelompok” pada catatan tugas tidak berarti tangan secara harfiah, melainkan orang yang dipercaya membantu pekerjaan penting.\n\nMurid juga menemukan kata “mereka” dalam paragraf laporan. Kata itu merujuk pada murid yang merawat kebun. Dengan melihat kalimat sebelum dan sesudahnya, murid dapat mengetahui rujukan kata tanpa menebak. Mereka menyimpulkan bahwa makna kata perlu dipahami dari bentuk kata, kelompok makna, dan konteks penggunaannya.",
    "Menyusun Ikhtisar dan Bagan": "Kelas V menjalankan program membaca selama empat pekan. Setiap Selasa dan Kamis, murid membaca buku pilihan selama lima belas menit sebelum pelajaran dimulai. Setelah membaca, mereka menulis satu informasi baru atau satu pertanyaan pada kartu baca. Pada akhir pekan, kartu dikumpulkan untuk membantu guru mengetahui bagian yang sudah dipahami dan bagian yang masih membingungkan.\n\nPada pekan kedua, murid mulai berbagi isi buku dalam kelompok kecil. Setiap anggota menyampaikan gagasan utama, satu rincian penting, dan alasan memilih buku tersebut. Teman lain boleh mengajukan pertanyaan, tetapi mereka harus mendengarkan sampai pembicara selesai. Kegiatan ini membuat murid belajar merangkum tanpa menyalin seluruh isi buku.\n\nGuru kemudian meminta setiap kelompok membuat bagan sederhana. Di bagian atas, mereka menuliskan tujuan program, yaitu membangun kebiasaan membaca dan memahami informasi. Di bawahnya terdapat tiga cabang: membaca rutin, mencatat informasi, dan berbagi pemahaman. Setiap cabang diberi contoh kegiatan.\n\nPada akhir program, guru membandingkan kartu baca dari awal dan akhir pekan. Catatan menunjukkan bahwa sebagian besar murid mulai menulis ringkasan lebih jelas. Ikhtisar yang baik cukup memuat tujuan, kegiatan utama, dan hasil penting. Bagan membantu pembaca melihat hubungan antarbagian secara cepat tanpa harus membaca uraian panjang.",
    "Menilai Relevansi dan Kesesuaian": "Kelurahan Melati mengajak warga mengurangi sampah plastik sekali pakai. Dalam pengumuman, warga dianjurkan membawa tas belanja sendiri, menggunakan botol minum isi ulang, dan memilah sampah sesuai jenisnya. Pengurus menjelaskan bahwa perubahan kecil yang dilakukan secara rutin dapat mengurangi jumlah sampah yang harus dibawa ke tempat pembuangan.\n\nPada hari kerja bakti, beberapa warga menyiapkan tempat terpisah untuk botol plastik, kertas, dan sisa makanan. Anak-anak membantu menempelkan label agar orang mudah membedakan tempat sampah. Seorang warga mengusulkan agar semua sampah dimasukkan ke satu kantong supaya lebih cepat. Namun, pengurus menjelaskan bahwa cara itu menyulitkan proses pemilahan dan penggunaan kembali bahan yang masih berguna.\n\nSetelah dua pekan, pengurus mencatat bahwa lebih banyak warga membawa tas belanja sendiri. Jumlah botol sekali pakai yang terkumpul juga berkurang, walaupun belum hilang sepenuhnya. Catatan tersebut menunjukkan perubahan, tetapi belum membuktikan bahwa semua warga telah menerapkan kebiasaan baru.\n\nSaat membaca laporan, siswa diminta menilai apakah tindakan tertentu sesuai dengan tujuan kegiatan. Membawa botol isi ulang mendukung tujuan pengurangan plastik. Sebaliknya, mengambil kantong baru padahal tas sendiri tersedia tidak sesuai dengan anjuran. Penilaian harus menghubungkan tindakan dengan tujuan dan bukti, bukan sekadar berdasarkan kesukaan pribadi.",
    "Mengidentifikasi Objek dalam Teks Fiksi dan Nonfiksi": "Di tepi taman sekolah, Lani menemukan seekor kupu-kupu hinggap pada bunga kertas yang dibuat kelompoknya. Dalam cerita yang ditulis Lani, kupu-kupu itu disebut sebagai tamu kecil yang menari di antara warna. Ungkapan tersebut membuat suasana taman terasa hidup. Objek yang digambarkan adalah kupu-kupu, sedangkan kata menari merupakan bahasa kias untuk gerak kupu-kupu yang berpindah dari satu bunga ke bunga lain.\n\nPada hari berikutnya, Lani membaca teks informasi tentang kupu-kupu. Teks itu menjelaskan bahwa kupu-kupu termasuk serangga yang memiliki dua pasang sayap dan enam kaki. Banyak kupu-kupu mengisap nektar dari bunga menggunakan alat mulut yang menyerupai belalai. Beberapa jenis kupu-kupu juga membantu proses penyerbukan ketika berpindah dari satu bunga ke bunga lain.\n\nKedua bacaan membicarakan objek yang sama, tetapi menyajikannya dengan cara berbeda. Cerita Lani menggunakan ungkapan yang membangun gambaran dan suasana, sedangkan teks informasi menyampaikan ciri-ciri berdasarkan fakta. Untuk mengenali objek, pembaca perlu memperhatikan kata yang menyebut objek dan rincian yang menjelaskannya. Dalam teks fiksi, kata kias tidak selalu bermakna harfiah. Dalam teks nonfiksi, ciri objek perlu dipahami sesuai informasi yang disampaikan, bukan ditambah dengan dugaan sendiri." ,
    "Strategi Menjawab Soal TKA": "Sebelum menjawab soal membaca, perhatikan kata kerja pada pertanyaan. “Sebutkan” atau “kapan” biasanya meminta informasi yang dapat ditemukan langsung. “Mengapa” dapat meminta alasan yang tertulis atau hubungan sebab-akibat. “Simpulan” meminta pembaca menghubungkan beberapa petunjuk, sedangkan “penilaian” meminta alasan yang sesuai dengan isi teks.\n\nBacalah bacaan secara utuh terlebih dahulu agar mengetahui topik dan alurnya. Setelah itu, baca pertanyaan dan tandai kata kunci. Jika pertanyaan menanyakan makna kata, baca kalimat sebelum dan sesudah kata tersebut. Jika menanyakan gagasan utama, cari ide yang menaungi sebagian besar informasi, bukan rincian yang hanya muncul sekali.\n\nSaat memilih jawaban, periksa semua pilihan. Ada pilihan yang benar-benar didukung teks, ada yang bertentangan, dan ada yang terdengar masuk akal tetapi tidak disebutkan. Untuk soal pilihan ganda kompleks, nilai setiap pilihan secara mandiri karena lebih dari satu jawaban dapat benar. Untuk soal kategori, periksa setiap pernyataan satu per satu.\n\nSebelum mengumpulkan jawaban, baca kembali pertanyaan dan jawaban pilihanmu. Pastikan kamu tidak melewatkan kata seperti “paling tepat”, “semua”, “kecuali”, atau “tidak sesuai”. Strategi ini membantu mengurangi kesalahan karena terburu-buru. Jawaban yang baik selalu memiliki alasan yang dapat dijelaskan berdasarkan bacaan."
    ,"Menentukan Unsur Teks": "Pada Minggu pagi, Dita dan kakaknya, Ranu, pergi ke rumah baca di dekat lapangan desa. Mereka membawa beberapa buku cerita untuk disumbangkan. Ketika tiba, penjaga rumah baca sedang memindahkan buku dari kardus ke rak karena ruangan akan dipakai untuk kegiatan mendongeng. Dita membantu mengelompokkan buku berdasarkan jenisnya, sedangkan Ranu menempelkan label pada rak.\n\nTidak lama kemudian, seorang anak kecil mencari buku tentang hewan. Dita menunjukkan rak pengetahuan dan membantu anak itu menemukan buku yang sesuai. Setelah kegiatan selesai, penjaga rumah baca mengucapkan terima kasih kepada mereka. Dita merasa senang karena sumbangan buku dapat dimanfaatkan banyak orang.\n\nCerita tersebut berlangsung pada Minggu pagi di rumah baca dekat lapangan desa. Dita dan Ranu menjadi tokoh yang melakukan kegiatan utama. Peristiwa pentingnya adalah mereka menyumbangkan buku dan membantu menata koleksi. Latar, tokoh, dan rangkaian peristiwa saling berkaitan untuk membentuk cerita yang utuh.",
    "Menentukan Pernyataan Sesuai Isi Paragraf": "Warga Kampung Sari membuat taman kecil di lahan kosong dekat balai warga. Sebelum menanam, mereka membersihkan sampah dan menggemburkan tanah. Setiap keluarga membawa satu jenis bibit, seperti cabai, tomat, atau tanaman obat. Anak-anak membuat papan nama agar setiap tanaman mudah dikenali.\n\nPengurus membagi jadwal perawatan. Pada pagi hari, dua orang menyiram tanaman, sedangkan kelompok sore memeriksa daun dan membersihkan gulma. Warga tidak menyiram ketika tanah masih basah setelah hujan. Mereka juga mencatat pertumbuhan tanaman setiap pekan. Catatan itu membantu warga mengetahui tanaman yang tumbuh baik dan yang membutuhkan perhatian.\n\nSetelah enam pekan, taman mulai menghasilkan beberapa cabai dan tomat. Hasilnya digunakan bersama saat kegiatan memasak di balai warga. Taman itu belum menghasilkan banyak bahan pangan, tetapi warga merasa kegiatan tersebut membuat lingkungan lebih rapi dan mempererat kerja sama. Informasi dalam paragraf perlu diperiksa berdasarkan apa yang benar-benar disebutkan, bukan berdasarkan dugaan pembaca.",
    "Menyimpulkan Amanat": "Setiap kelompok kelas V mendapat tugas membuat poster hemat air. Kelompok Seno ingin segera selesai sehingga ia mengusulkan menyalin poster dari internet tanpa memeriksa sumbernya. Mira mengingatkan bahwa poster harus dibuat dengan kata-kata sendiri dan informasi yang benar. Seno merasa usulnya lebih cepat, tetapi anggota kelompok lain setuju mengikuti saran Mira.\n\nMereka membaca buku panduan sekolah, mencatat tiga cara menghemat air, lalu membuat gambar keran yang ditutup setelah digunakan. Ketika guru memeriksa poster, ada satu angka yang belum jelas sumbernya. Kelompok itu menghapus angka tersebut dan menggantinya dengan ajakan yang sesuai dengan panduan.\n\nPada hari pameran, poster mereka mendapat pujian karena mudah dipahami dan tidak memuat informasi yang meragukan. Seno mengakui bahwa menyelesaikan tugas dengan cepat tidak cukup jika caranya tidak tepat. Ia belajar bahwa karya yang baik perlu dibuat dengan jujur, teliti, dan bertanggung jawab. Pembaca dapat menyimpulkan amanat dari pilihan tokoh, akibat tindakannya, dan perubahan sikap yang terjadi.",
    "Menyimpulkan Peristiwa dan Nilai dalam Teks": "Hujan deras turun ketika latihan paduan suara hampir dimulai. Beberapa murid melihat air mengalir menuju kotak berisi lembar lagu yang diletakkan dekat pintu. Tanpa menunggu perintah, Arga memindahkan kotak itu ke atas meja. Lila mengambil kain pel dan meminta teman-temannya mengeringkan lantai agar tidak licin.\n\nSetelah keadaan aman, mereka memeriksa lembar lagu satu per satu. Beberapa kertas di bagian luar basah, tetapi sebagian besar masih dapat digunakan. Arga mengusulkan agar semua lembar yang basah dibuang. Lila menyarankan mengeringkan kertas yang masih terbaca dan mencetak ulang hanya bagian yang rusak. Guru menyetujui usul tersebut.\n\nLatihan dimulai sedikit terlambat, tetapi semua murid tetap dapat mengikuti kegiatan. Mereka kemudian sepakat memindahkan perlengkapan ke tempat yang lebih aman setiap kali cuaca buruk. Peristiwa itu menunjukkan kepedulian, kerja sama, dan penggunaan barang secara bijak. Nilai cerita dapat disimpulkan dengan melihat tindakan tokoh, masalah yang dihadapi, serta keputusan yang membawa hasil baik.",
    "Menyimpulkan Perubahan Objek, Karakter, atau Latar": "Pada awal semester, halaman belakang sekolah dipenuhi daun kering dan beberapa pot kosong. Beni sering melewati halaman itu tanpa memperhatikan keadaannya. Suatu hari, guru mengajak kelasnya membuat kebun sederhana. Beni mendapat tugas mencatat pertumbuhan tanaman dan pada awalnya menganggap pekerjaan itu membosankan.\n\nSetiap pekan, Beni mengukur tinggi tanaman dan menuliskan hasilnya. Ia mulai memperhatikan bahwa tanaman yang cukup air tumbuh lebih baik daripada tanaman yang terlupakan. Ketika satu tanaman layu, Beni memeriksa tanah dan menemukan bahwa potnya tersumbat sehingga air tidak mengalir dengan baik. Ia melaporkan hal itu kepada kelompok, lalu mereka memperbaiki lubang pot.\n\nMenjelang akhir semester, halaman tampak lebih hijau dan rapi. Beni pun berubah: ia menjadi lebih teliti dan tidak lagi menganggap pencatatan sebagai tugas sia-sia. Perubahan latar terlihat dari halaman yang semula kurang terawat menjadi kebun kecil. Perubahan karakter Beni dapat dipahami melalui pengalaman dan tindakannya selama merawat tanaman.",
    "Menentukan Makna Kata, Simbol, dan Kias": "Di ruang pamer sekolah, terdapat lukisan matahari terbit di balik pegunungan. Pemandu menjelaskan bahwa matahari pada lukisan itu bukan hanya benda langit, tetapi juga lambang harapan baru bagi tokoh dalam cerita yang mengilhami lukisan tersebut. Di sampingnya, ada gambar burung yang terbang keluar dari sangkar terbuka. Gambar itu digunakan sebagai simbol kebebasan.\n\nPada keterangan lukisan tertulis, “Setelah gagal, Naya bangkit dan menata kembali langkahnya.” Kata bangkit di sini tidak berarti berdiri dari posisi duduk, melainkan berusaha kembali setelah mengalami kesulitan. Di bagian lain, kalimat “waktu berlari begitu cepat” tidak menyatakan bahwa waktu memiliki kaki. Ungkapan itu menggambarkan waktu yang terasa berlalu dengan cepat.\n\nPengunjung diminta membaca keterangan bersama gambar agar dapat memahami maknanya. Kata, simbol, dan ungkapan dapat memiliki arti yang lebih luas daripada arti harfiahnya. Makna yang tepat ditentukan oleh konteks, bukan dengan menafsirkan satu kata secara terpisah.",
    "Menggali Informasi Tersirat dalam Karya Sastra": "Ketika bel pulang berbunyi, Rani masih duduk di dekat jendela kelas. Di tangannya ada kertas pengumuman lomba menggambar. Ia telah membuat beberapa sketsa, tetapi selalu merobeknya karena merasa hasilnya belum cukup baik. Di meja sebelah, Fajar sedang merapikan pensil warna yang dipinjam dari kelas.\n\nFajar melihat tumpukan kertas yang diremas, lalu meletakkan satu pensil warna biru di samping Rani. “Langit sore tidak harus selalu sama,” katanya sambil menunjukkan gambar sederhana di buku catatannya. Ia tidak meminta Rani meniru gambar itu. Rani memperhatikan perpaduan warna yang tidak biasa, kemudian membuka lembar baru dan mulai menggambar lagi.\n\nSaat guru datang, Rani belum menyelesaikan gambarnya, tetapi ia tidak lagi meremas kertas. Ia menyimpan sketsa itu untuk dilanjutkan esok hari. Cerita tidak menyatakan secara langsung perasaan Rani atau maksud Fajar. Pembaca dapat menyimpulkan bahwa Rani semula kurang percaya diri, sedangkan Fajar berusaha memberi dukungan tanpa mengambil alih pekerjaan temannya. Simpulan itu didukung oleh tindakan dan perubahan perilaku tokoh.",
    "Menentukan Keteladanan Tokoh Cerita": "Pak Hasan menjaga perpustakaan kecil di kampung. Suatu sore, setelah anak-anak selesai membaca, ia menemukan sebuah dompet di bawah meja. Di dalamnya ada kartu anggota dan sejumlah uang. Seorang warga menyarankan agar dompet itu disimpan dahulu sampai ada yang mencari. Pak Hasan memilih mencatat tempat penemuan dan segera menghubungi pemiliknya melalui nomor yang tercantum pada kartu.\n\nPemilik dompet datang tidak lama kemudian. Ia memeriksa isinya dan mengucapkan terima kasih karena uang itu akan digunakan untuk membeli obat bagi ibunya. Pak Hasan tidak meminta imbalan. Ia hanya berpesan agar semua pengunjung segera menyerahkan barang temuan kepada petugas.\n\nKeesokan harinya, anak-anak membicarakan kejadian tersebut. Mereka menyadari bahwa kejujuran bukan hanya mengatakan hal yang benar, tetapi juga melakukan tindakan yang menjaga hak orang lain. Sikap Pak Hasan menjadi teladan karena ia memilih mengembalikan barang yang bukan miliknya, bertindak cepat, dan tidak mengharapkan hadiah. Keteladanan tokoh sebaiknya disimpulkan dari tindakan nyata dalam cerita.",
    "Jenis Majas": "Dalam cerita pendek karya kelas VI, malam digambarkan dengan kalimat “angin berbisik di sela-sela jendela”. Kalimat itu membuat suasana terasa hidup seolah-olah angin dapat berbicara. Pada bagian lain, penulis menyebut tas sekolah Riko “seberat gunung” untuk menegaskan bahwa tas itu terasa sangat berat. Ketika tokoh melihat sahabatnya, ia berkata, “Kamu adalah matahari di hari mendung,” sebagai ungkapan bahwa sahabatnya membawa semangat.\n\nGuru meminta murid memperhatikan cara bahasa digunakan. Angin tidak benar-benar memiliki mulut untuk berbisik; benda atau gejala alam digambarkan seolah-olah bertindak seperti manusia. Tas Riko juga tidak seberat gunung secara harfiah. Ungkapan itu melebih-lebihkan keadaan untuk memberi penekanan. Sementara itu, menyebut seseorang sebagai matahari merupakan perbandingan langsung yang menyatakan bahwa orang itu memberi kehangatan atau semangat.\n\nMajas membantu penulis membangun suasana, memperjelas kesan, dan membuat cerita lebih menarik. Untuk mengenalinya, pembaca perlu memperhatikan hubungan makna dalam kalimat, bukan hanya menghafal nama majas.",
    "Makna Istilah, Ungkapan, dan Peribahasa": "Dalam kegiatan literasi, Bu Rika meminta murid membaca pengumuman tentang kerja bakti. Pengumuman itu menggunakan istilah “daur ulang”, yaitu proses mengolah bahan bekas agar dapat dimanfaatkan kembali. Beberapa murid juga menemukan ungkapan “buah tangan” pada cerita pengalaman seorang anak yang pulang dari rumah nenek. Bu Rika menjelaskan bahwa buah tangan berarti oleh-oleh, bukan buah yang tumbuh di tangan.\n\nDi akhir bacaan, terdapat peribahasa “berat sama dipikul, ringan sama dijinjing”. Peribahasa itu menggambarkan pekerjaan yang dilakukan bersama-sama, baik ketika terasa sulit maupun mudah. Murid lalu menghubungkan makna peribahasa dengan kegiatan membersihkan kelas. Jika semua anggota mengambil bagian, tugas akan terasa lebih ringan.\n\nBu Rika mengingatkan bahwa istilah biasanya memiliki makna khusus dalam bidang tertentu, ungkapan memiliki arti yang tidak selalu sama dengan arti kata penyusunnya, sedangkan peribahasa menyampaikan nasihat atau pandangan hidup. Makna ketiganya perlu ditentukan dengan melihat konteks kalimat dan situasi penggunaannya.",
    "Melengkapi Teks Laporan, Iklan, dan Pidato": "Kelas VI mengadakan pameran karya daur ulang. Panitia membuat tiga jenis teks untuk menyampaikan informasi. Laporan kegiatan memuat waktu, tempat, peserta, proses, dan hasil kegiatan secara objektif. Iklan dibuat singkat agar pengunjung tertarik datang, sedangkan pidato disampaikan untuk mengajak warga sekolah mendukung kegiatan. Setiap jenis teks memiliki tujuan dan pilihan bahasa yang berbeda.\n\nDalam laporan, panitia menuliskan bahwa pameran berlangsung pada Jumat di aula sekolah dan menampilkan 35 karya dari enam kelas. Kalimat laporan harus berisi fakta yang dapat diperiksa. Pada iklan, panitia menggunakan kalimat ajakan yang jelas dan mencantumkan waktu serta tempat. Pada pidato, pembicara menyapa hadirin, menjelaskan manfaat kegiatan, menyampaikan ajakan, lalu menutup dengan ucapan terima kasih.\n\nKetika melengkapi teks yang belum selesai, pembaca perlu mengenali tujuan dan struktur teks. Bagian yang dipilih harus menyambung dengan kalimat sebelum dan sesudahnya. Kalimat yang menarik belum tentu tepat jika tidak sesuai jenis teks atau menambahkan informasi yang tidak didukung.",
    "Menyimpulkan Respons Emosional terhadap Teks Fiksi": "Sebelum pentas kelas dimulai, Sari berdiri di belakang panggung sambil memegang naskah. Ia telah berlatih selama berminggu-minggu, tetapi ketika mendengar nama kelompoknya dipanggil, ia mendadak merasa gugup. Temannya, Niko, mengingatkan bahwa mereka sudah berlatih bersama dan tidak harus tampil sempurna. Sari menarik napas, mengangguk, lalu melangkah ke panggung.\n\nPada awal penampilan, suara Sari terdengar pelan. Namun, setelah melihat teman-temannya memberi isyarat dukungan, ia mulai berbicara lebih jelas. Kelompok itu menyelesaikan cerita tanpa berhenti. Penonton bertepuk tangan, dan Sari tersenyum lega. Ia tahu masih ada bagian yang dapat diperbaiki, tetapi ia bangga karena tidak menyerah pada rasa gugupnya.\n\nPembaca mungkin merasa ikut tegang ketika Sari menunggu giliran, kemudian merasa lega atau senang saat ia berhasil menyelesaikan penampilan. Respons emosional itu muncul dari peristiwa dan perubahan keadaan tokoh. Jawaban yang kuat tidak hanya menyebut perasaan, tetapi juga menjelaskan bagian cerita yang menimbulkan perasaan tersebut."

            const renderTextual = () => <><p className="text-gray-700 leading-7">Informasi tersurat adalah informasi yang dinyatakan secara langsung dalam teks. Jawabannya dapat ditemukan pada kata, kalimat, tabel, atau keterangan yang terlihat jelas.</p><h3 className="text-lg font-bold mt-5 mb-2">Langkah menemukan informasi tersurat</h3><ol className="list-decimal pl-6 text-gray-700 space-y-2"><li>Kenali kata kunci dalam pertanyaan, misalnya nama tokoh, waktu, tempat, jumlah, atau tujuan.</li><li>Cari bagian bacaan yang memuat kata kunci atau makna yang sama.</li><li>Baca kalimat di sekitarnya agar informasi tidak terpotong.</li><li>Pilih jawaban yang sesuai persis dengan isi teks.</li></ol><div className="rounded-xl bg-amber-50 p-4 mt-5"><strong>Contoh:</strong><p className="text-gray-700 mt-2">“Perpustakaan dibuka pukul 07.30 dan ditutup pukul 13.00.”</p><p className="text-gray-700 mt-2">Pertanyaan: Pukul berapa perpustakaan mulai dibuka?</p><p className="font-bold text-amber-900 mt-1">Jawaban: Pukul 07.30.</p><p className="text-gray-700 mt-1">Jawaban disebutkan secara langsung sehingga tidak perlu menebak.</p></div><h3 className="text-lg font-bold mt-5 mb-2">Kesalahan yang perlu dihindari</h3><ul className="list-disc pl-6 text-gray-700 space-y-2"><li>Memilih jawaban yang terdengar masuk akal tetapi tidak ada dalam teks.</li><li>Mengabaikan kata pembatas seperti “paling awal”, “kecuali”, atau “berdasarkan bacaan”.</li><li>Membaca hanya satu kata tanpa memperhatikan kalimat lengkap.</li></ul></>;

            const renderInference = () => <><p className="text-gray-700 leading-7">Inferensi adalah pemahaman yang diperoleh dengan menghubungkan petunjuk dalam bacaan. Informasinya mungkin tidak ditulis secara langsung, tetapi kesimpulan harus tetap masuk akal dan didukung bukti.</p><h3 className="text-lg font-bold mt-5 mb-2">Cara membuat inferensi</h3><ol className="list-decimal pl-6 text-gray-700 space-y-2"><li>Temukan dua atau lebih petunjuk yang relevan.</li><li>Hubungkan petunjuk tersebut.</li><li>Gunakan pengetahuan sehari-hari yang sesuai, tanpa menambahkan cerita baru.</li><li>Pilih kesimpulan yang paling kuat didukung bacaan.</li></ol><div className="rounded-xl bg-violet-50 p-4 mt-5"><strong>Contoh:</strong><p className="text-gray-700 mt-2">“Langit semakin gelap. Sinta segera mengangkat pakaian yang dijemur dan menutup jendela.”</p><p className="text-gray-700 mt-2">Inferensi: Sinta memperkirakan hujan akan turun. Petunjuknya adalah langit yang semakin gelap dan tindakan mengangkat pakaian.</p></div><h3 className="text-lg font-bold mt-5 mb-2">Sebab dan akibat</h3><p className="text-gray-700 leading-7">Sebab adalah alasan suatu kejadian, sedangkan akibat adalah hasilnya. Kata “karena”, “sehingga”, “akibatnya”, dan “oleh sebab itu” sering membantu, tetapi hubungan sebab-akibat juga bisa dipahami dari makna kalimat.</p><h3 className="text-lg font-bold mt-5 mb-2">Menyimpulkan isi bacaan</h3><p className="text-gray-700 leading-7">Kesimpulan merangkum inti teks. Kesimpulan harus mencakup informasi penting, tidak terlalu sempit, dan tidak menambahkan hal yang tidak didukung oleh bacaan.</p></>;

            const renderEvaluate = () => <><p className="text-gray-700 leading-7">Evaluasi dan apresiasi berarti memahami isi sekaligus menilai atau menanggapi bacaan dengan alasan yang jelas. Penilaian tidak boleh hanya didasarkan pada suka atau tidak suka.</p><h3 className="text-lg font-bold mt-5 mb-2">Hal yang dapat dinilai</h3><ul className="list-disc pl-6 text-gray-700 space-y-2"><li>Apakah tindakan tokoh sesuai dengan masalah yang dihadapi?</li><li>Apakah alasan atau kesimpulan didukung bukti dalam teks?</li><li>Apakah pesan cerita sesuai dengan peristiwa dan akhir cerita?</li><li>Bagaimana pilihan kata atau suasana membantu pembaca memahami cerita?</li><li>Apakah suatu pernyataan sesuai, tidak sesuai, atau tidak dapat dipastikan dari bacaan?</li></ul><div className="rounded-xl bg-rose-50 p-4 mt-5"><strong>Contoh:</strong><p className="text-gray-700 mt-2">Tokoh membantu temannya membawa buku tanpa diminta. Penilaian yang didukung teks: tindakan itu menunjukkan kepedulian. Pernyataan “tokoh ingin mendapat hadiah” tidak dapat dipastikan jika cerita tidak menyebutkan alasan tersebut.</p></div><h3 className="text-lg font-bold mt-5 mb-2">Menentukan amanat</h3><p className="text-gray-700 leading-7">Untuk menemukan amanat, perhatikan masalah yang terjadi, keputusan tokoh, akibat keputusan, dan penyelesaian. Pilih pesan yang merangkum cerita secara wajar, bukan nasihat yang tidak berkaitan dengan peristiwa.</p></>;

            const renderStrategy = () => <><p className="text-gray-700 leading-7">Soal TKA dapat menanyakan informasi yang tertulis langsung, kesimpulan, alasan tindakan tokoh, hubungan peristiwa, atau penilaian terhadap isi bacaan. Strategi berikut membantu menjawab dengan cermat.</p><div className="space-y-3 mt-5">{[['Sebelum membaca','Perhatikan instruksi dan pertanyaan. Kenali apa yang diminta: informasi, watak, sebab-akibat, kesimpulan, atau penilaian.'],['Saat membaca','Baca teks secara utuh. Tandai nama, waktu, tempat, kata penghubung, perubahan peristiwa, dan tindakan tokoh.'],['Saat memilih jawaban','Cari bukti yang paling sesuai. Singkirkan pilihan yang bertentangan dengan teks, terlalu luas, terlalu sempit, atau menambahkan informasi baru.'],['Untuk soal kompleks','Nilai setiap pilihan secara mandiri. Jangan menganggap jumlah jawaban benar selalu satu.'],['Untuk pernyataan benar/salah','Periksa setiap pernyataan terhadap bacaan. Jika informasi tidak cukup untuk memastikan, jangan menganggapnya benar hanya karena terdengar masuk akal.'],['Setelah menjawab','Baca kembali pertanyaan dan pilihan yang dipilih. Pastikan jawaban menjawab pertanyaan yang sebenarnya.']].map(([a,b],i)=><div key={a} className="flex gap-3 rounded-xl border border-gray-200 p-4"><div className="shrink-0 rounded-full bg-blue-100 text-blue-800 w-9 h-9 flex items-center justify-center font-extrabold">{i+1}</div><div><h4 className="font-bold text-gray-800">{a}</h4><p className="text-gray-700 mt-1 leading-6">{b}</p></div></div>)}</div></>;

            const renderVocabulary = () => <>
                <p className="text-gray-700 leading-7">Kosakata adalah kumpulan kata yang kita pahami dan gunakan. Dalam soal TKA Bahasa Indonesia, murid dapat diminta mengenali kata umum dan kata khusus, memahami makna kata berdasarkan konteks bacaan, menemukan persamaan atau lawan kata, memahami kata berimbuhan, mengenali kata rujukan, serta menafsirkan ungkapan sederhana. Kuncinya: jangan menebak hanya dari satu kata; baca kalimat sebelum dan sesudahnya.</p>

                <h3 className="text-lg font-bold text-gray-800 mt-5 mb-2">1. Kata umum dan kata khusus</h3>
                <p className="text-gray-700 leading-7"><strong>Kata umum</strong> mempunyai cakupan makna lebih luas. <strong>Kata khusus</strong> mempunyai cakupan makna lebih sempit dan menunjuk jenis atau contoh yang lebih tertentu. Kata khusus biasanya termasuk dalam kelompok kata umum.</p>
                <div className="overflow-x-auto mt-3"><table className="w-full border-collapse text-sm"><thead><tr className="bg-blue-50"><th className="border p-3 text-left">Kata umum</th><th className="border p-3 text-left">Contoh kata khusus</th><th className="border p-3 text-left">Penjelasan</th></tr></thead><tbody>{[['hewan','kucing, kambing, kupu-kupu','Kucing dan kambing termasuk kelompok hewan.'],['buah','mangga, pisang, rambutan','Mangga adalah satu jenis buah.'],['kendaraan','sepeda, bus, kapal','Bus dan kapal merupakan jenis kendaraan.'],['tanaman','padi, mawar, cabai','Mawar merupakan jenis tanaman.'],['peralatan sekolah','penggaris, pensil, penghapus','Penggaris adalah salah satu alat yang digunakan di sekolah.'],['pekerjaan','dokter, petani, nelayan','Petani dan nelayan merupakan jenis pekerjaan.']].map(r=><tr key={r[0]}>{r.map(c=><td key={c} className="border p-3 text-gray-700 align-top">{c}</td>)}</tr>)}</tbody></table></div>
                <div className="rounded-xl bg-sky-50 border border-sky-100 p-4 mt-4"><strong className="text-sky-900">Contoh dalam bacaan</strong><p className="text-gray-700 mt-2 leading-7">“Di kebun sekolah tumbuh beberapa <strong>tanaman</strong>. Kelompok Sari merawat <strong>cabai</strong>, sedangkan kelompok Bima menanam <strong>mawar</strong>.”</p><p className="text-gray-700 mt-2">Kata <em>tanaman</em> adalah kata umum. Kata <em>cabai</em> dan <em>mawar</em> adalah kata khusus karena menyebut jenis tanaman tertentu.</p></div>
                <h4 className="font-bold text-gray-800 mt-4">Cara menjawab soal kata umum/khusus</h4><ol className="list-decimal pl-6 text-gray-700 space-y-2"><li>Tanyakan, “Apakah kata ini mencakup banyak jenis atau hanya satu jenis tertentu?”</li><li>Jika cakupannya luas, kata itu cenderung merupakan kata umum.</li><li>Jika menunjuk jenis atau contoh yang lebih tertentu, kata itu cenderung merupakan kata khusus.</li><li>Pastikan hubungan kelompoknya tepat. Misalnya, <em>mawar</em> termasuk <em>tanaman</em>, tetapi <em>tanaman</em> bukan jenis khusus dari <em>mawar</em>.</li></ol>

                <h3 className="text-lg font-bold text-gray-800 mt-6 mb-2">2. Makna kata berdasarkan konteks</h3>
                <p className="text-gray-700 leading-7">Konteks adalah kata, kalimat, atau peristiwa di sekitar sebuah kata yang membantu kita memahami artinya. Satu kata bisa memiliki makna berbeda pada kalimat yang berbeda. Gunakan petunjuk berupa penjelasan, contoh, sebab-akibat, atau keadaan yang diceritakan.</p>
                <div className="rounded-2xl border border-gray-200 overflow-hidden mt-3"><div className="bg-emerald-700 text-white p-4"><h4 className="font-bold text-lg">Bacaan: Air untuk Kebun</h4><p className="text-emerald-100 text-sm">Bacalah bacaan berikut sebelum melihat analisisnya.</p></div><div className="p-5 text-gray-700 leading-7 space-y-3"><p>Selama beberapa hari, hujan tidak turun di Desa Sukaasri. Tanah di kebun sekolah mulai <strong>kering</strong> dan daun beberapa tanaman tampak layu. Rani dan teman-temannya kemudian membuat jadwal untuk menyiram tanaman secara bergiliran.</p><p>Pak Danu menjelaskan bahwa air harus digunakan dengan <strong>hemat</strong>. Murid-murid menampung air hujan dari hari sebelumnya dalam wadah tertutup. Mereka juga menyiram tanaman pada pagi hari agar air tidak cepat menguap karena panas matahari.</p><p>Seminggu kemudian, tanaman terlihat lebih segar. Rani merasa lega karena usaha kelompoknya mulai menunjukkan <strong>hasil</strong>.</p></div></div>
                <div className="space-y-3 mt-4">{[['kering','Tidak cukup mengandung air atau tidak basah.','Petunjuk: hujan tidak turun dan daun tanaman layu.'],['hemat','Menggunakan sesuatu secukupnya dan tidak boros.','Petunjuk: air perlu digunakan dengan bijak dan ditampung untuk dipakai.'],['mengelap (contoh lain)','Mengeringkan atau membersihkan permukaan dengan kain.','Makna ini berbeda dari “menguap”; perhatikan kata yang benar-benar muncul di kalimat.'],['hasil','Sesuatu yang diperoleh setelah melakukan usaha.','Petunjuk: tanaman lebih segar setelah kelompok menyiramnya secara teratur.']].map(([a,b,c])=><div key={a} className="rounded-xl border border-gray-200 p-4"><div className="font-bold text-blue-900">Kata: {a}</div><p className="text-gray-700 mt-1">{b}</p><p className="text-sm text-gray-500 mt-1">{c}</p></div>)}</div>
                <h4 className="font-bold text-gray-800 mt-5">Langkah mencari makna kata</h4><ol className="list-decimal pl-6 text-gray-700 space-y-2"><li>Baca kalimat yang memuat kata tersebut.</li><li>Baca satu kalimat sebelum dan sesudahnya.</li><li>Temukan petunjuk: contoh, penjelasan, akibat, atau lawan keadaan.</li><li>Coba ganti kata itu dengan arti yang diperkirakan.</li><li>Baca ulang kalimat. Jika maknanya tetap masuk akal dan sesuai bacaan, arti itu mungkin tepat.</li></ol>

                <h3 className="text-lg font-bold text-gray-800 mt-6 mb-2">3. Makna denotatif dan konotatif</h3>
                <p className="text-gray-700 leading-7"><strong>Makna denotatif</strong> adalah makna lugas atau makna sebenarnya. <strong>Makna konotatif</strong> adalah makna tambahan atau kias yang muncul dalam konteks tertentu. Jangan menganggap semua kata bermakna kias; periksa apakah kalimat sedang menjelaskan kejadian sebenarnya atau menggunakan ungkapan.</p>
                <div className="overflow-x-auto mt-3"><table className="w-full border-collapse text-sm"><thead><tr className="bg-amber-50"><th className="border p-3 text-left">Kalimat</th><th className="border p-3 text-left">Jenis makna</th><th className="border p-3 text-left">Alasan</th></tr></thead><tbody>{[['“Ibu membeli buah tangan berupa mangga.”','Denotatif jika yang dimaksud buah yang dibawa dengan tangan, tetapi kalimatnya kurang lazim.','Makna ditentukan oleh susunan dan konteks kalimat.'],['“Ayah membawa buah tangan dari Bandung.”','Konotatif/ungkapan','“Buah tangan” berarti oleh-oleh, bukan buah yang tumbuh di pohon.'],['“Adik mencuci tangan sebelum makan.”','Denotatif','Tangan benar-benar dicuci.'],['“Dina menjadi tangan kanan ketua kelas.”','Konotatif/ungkapan','“Tangan kanan” berarti orang kepercayaan atau pembantu utama.'],['“Bintang terlihat di langit malam.”','Denotatif','Bintang merujuk pada benda langit.'],['“Raka adalah bintang kelas.”','Konotatif','“Bintang kelas” berarti murid yang menonjol atau berprestasi.']].map(r=><tr key={r[0]}>{r.map(c=><td key={c} className="border p-3 text-gray-700 align-top">{c}</td>)}</tr>)}</tbody></table></div>
                <p className="text-sm text-gray-500 mt-2">Catatan: beberapa ungkapan dapat memiliki arti berbeda sesuai kalimat. Makna selalu perlu diuji dengan konteks lengkap.</p>

                <h3 className="text-lg font-bold text-gray-800 mt-6 mb-2">4. Sinonim dan antonim</h3>
                <p className="text-gray-700 leading-7"><strong>Sinonim</strong> adalah kata yang maknanya sama atau hampir sama. <strong>Antonim</strong> adalah kata yang maknanya berlawanan. Kata yang dianggap bersinonim belum tentu dapat saling menggantikan pada semua kalimat, jadi perhatikan konteks dan tingkat kesopanannya.</p>
                <div className="overflow-x-auto mt-3"><table className="w-full border-collapse text-sm"><thead><tr className="bg-violet-50"><th className="border p-3 text-left">Kata</th><th className="border p-3 text-left">Sinonim yang sesuai</th><th className="border p-3 text-left">Antonim</th></tr></thead><tbody>{[['rajin','tekun','malas'],['gembira','senang','sedih'],['luas','lapang','sempit'],['cepat','lekas','lambat'],['indah','elok','buruk (bergantung konteks)'],['hemat','irit','boros'],['memulai','mengawali','mengakhiri'],['meningkat','bertambah/naik','menurun']].map(r=><tr key={r[0]}>{r.map(c=><td key={c} className="border p-3 text-gray-700">{c}</td>)}</tr>)}</tbody></table></div>
                <div className="rounded-xl bg-violet-50 p-4 mt-4"><strong>Contoh:</strong><p className="text-gray-700 mt-2">“Murid bekerja sama membersihkan kelas sehingga ruangan tampak rapi.”</p><ul className="list-disc pl-6 text-gray-700 mt-2 space-y-1"><li>Sinonim yang dekat dengan <em>rapi</em>: tertata.</li><li>Antonim <em>rapi</em>: berantakan.</li><li>Penggantian kata harus tetap cocok: “ruangan tampak tertata” terdengar sesuai dengan konteks.</li></ul></div>

                <h3 className="text-lg font-bold text-gray-800 mt-6 mb-2">5. Kata dasar, imbuhan, dan perubahan makna</h3>
                <p className="text-gray-700 leading-7">Kata berimbuhan dibentuk dari kata dasar yang mendapat awalan, akhiran, atau gabungan imbuhan. Imbuhan dapat menunjukkan kegiatan, pelaku, hasil, atau keadaan. Perhatikan bentuk kata dan fungsinya di dalam kalimat.</p>
                <div className="overflow-x-auto mt-3"><table className="w-full border-collapse text-sm"><thead><tr className="bg-sky-50"><th className="border p-3 text-left">Kata dasar</th><th className="border p-3 text-left">Kata turunan</th><th className="border p-3 text-left">Makna dalam contoh</th></tr></thead><tbody>{[['tanam','menanam','melakukan kegiatan memasukkan benih atau tanaman ke tanah'],['tanam','tanaman','tumbuhan yang ditanam atau tumbuh'],['rawat','merawat','menjaga dan memelihara'],['baca','bacaan','sesuatu yang dibaca'],['ajar','pelajaran','hal atau materi yang dipelajari'],['bersih','membersihkan','membuat sesuatu menjadi bersih'],['guna','berguna','mempunyai manfaat']].map(r=><tr key={r[0]+r[1]}>{r.map(c=><td key={c} className="border p-3 text-gray-700 align-top">{c}</td>)}</tr>)}</tbody></table></div>

                <h3 className="text-lg font-bold text-gray-800 mt-6 mb-2">6. Kata rujukan dan kata penghubung</h3>
                <p className="text-gray-700 leading-7">Kata rujukan seperti <em>ia</em>, <em>mereka</em>, <em>ini</em>, <em>itu</em>, dan <em>tersebut</em> menunjuk pada orang, benda, atau informasi yang disebutkan. Kata penghubung membantu menjelaskan hubungan antargagasan.</p>
                <div className="grid md:grid-cols-2 gap-3 mt-3">{[['Kata rujukan','“Lina membawa bibit cabai. Bibit itu ditanam di pot.” Kata “itu” merujuk pada bibit cabai.'],['Penambahan','“Murid menyiram tanaman. Selain itu, mereka membersihkan gulma.” Informasi kedua ditambahkan.'],['Contoh','“Mereka menanam sayuran, misalnya bayam dan kangkung.” Kata “misalnya” memperkenalkan contoh.'],['Penjelasan','“Kompos, yaitu pupuk dari bahan organik, digunakan di kebun.” Kata “yaitu” memperjelas istilah kompos.'],['Sebab','“Tanaman layu karena tanah terlalu kering.” Kata “karena” memperkenalkan sebab.'],['Akibat','“Hujan turun deras sehingga pertandingan ditunda.” Kata “sehingga” memperkenalkan akibat.']].map(([a,b])=><div key={a} className="rounded-xl border border-gray-200 p-4"><h4 className="font-bold text-gray-800">{a}</h4><p className="text-gray-700 mt-1 leading-6">{b}</p></div>)}</div>

                <h3 className="text-lg font-bold text-gray-800 mt-6 mb-2">7. Latihan pemahaman kosakata</h3>
                <div className="rounded-2xl bg-gray-50 border border-gray-200 p-5 space-y-4"><p className="text-gray-700 leading-7"><strong>Bacaan singkat:</strong> “Saat musim kemarau, warga menanam tanaman yang tidak membutuhkan banyak air. Mereka memilih jenis yang tahan kering. Cara ini dilakukan agar persediaan air tetap cukup untuk kebutuhan sehari-hari.”</p><div><p className="font-bold text-gray-800">A. Kata umum yang tepat untuk “padi” adalah ....</p><p className="text-gray-700 mt-1">Jawaban: <strong>tanaman</strong>, karena padi merupakan salah satu jenis tanaman.</p></div><div><p className="font-bold text-gray-800">B. Makna kata “persediaan” pada bacaan adalah ....</p><p className="text-gray-700 mt-1">Jawaban: sesuatu yang disimpan atau disiapkan agar dapat digunakan saat diperlukan. Petunjuknya adalah air perlu tetap tersedia untuk kebutuhan sehari-hari.</p></div><div><p className="font-bold text-gray-800">C. Antonim kata “cukup” yang sesuai adalah ....</p><p className="text-gray-700 mt-1">Jawaban: <strong>kurang</strong>, karena keduanya berlawanan makna dalam konteks jumlah atau kebutuhan.</p></div></div>
                <div className="rounded-xl bg-amber-50 border border-amber-100 p-4 mt-5"><strong className="text-amber-900">Checklist sebelum memilih jawaban</strong><ul className="list-disc pl-6 text-gray-700 mt-2 space-y-1"><li>Apakah saya sudah membaca kalimat lengkap?</li><li>Apakah arti kata cocok dengan kejadian dalam bacaan?</li><li>Apakah pilihan terlalu luas, terlalu sempit, atau justru bertentangan?</li><li>Apakah saya menggunakan bukti dari teks, bukan hanya ingatan?</li></ul></div>
            </>;

            const renderSummary = () => <>
                <p className="text-gray-700 leading-7">Ikhtisar dan bagan membantu kita menyusun kembali informasi dari bacaan. <strong>Ikhtisar</strong> menyampaikan inti bacaan secara singkat dalam bentuk kalimat atau paragraf. <strong>Bagan</strong> menyajikan informasi secara visual agar hubungan, urutan, kelompok, atau perbandingan mudah dilihat. Keduanya harus tetap setia pada isi bacaan dan tidak menambahkan informasi yang tidak disebutkan.</p>

                <h3 className="text-lg font-bold text-gray-800 mt-5 mb-2">1. Membedakan topik, gagasan utama, rincian, dan ikhtisar</h3>
                <div className="space-y-3">{[['Topik','Hal umum yang dibicarakan. Contoh: kebun sekolah.'],['Gagasan utama','Pernyataan inti tentang topik. Contoh: kebun sekolah digunakan sebagai tempat belajar dan merawat lingkungan.'],['Rincian pendukung','Fakta, contoh, alasan, atau penjelasan yang mendukung gagasan utama. Contoh: murid menanam sayuran, membuat kompos, dan mencatat pertumbuhan.'],['Ikhtisar','Gabungan inti informasi yang disampaikan secara ringkas dengan kata-kata sendiri. Contoh: kebun sekolah menjadi tempat belajar karena murid menanam sayuran, mengolah daun kering menjadi kompos, dan mengamati pertumbuhan tanaman.']].map(([a,b])=><div key={a} className="rounded-xl border border-gray-200 p-4"><h4 className="font-bold text-blue-900">{a}</h4><p className="text-gray-700 mt-1 leading-6">{b}</p></div>)}</div>

                <h3 className="text-lg font-bold text-gray-800 mt-6 mb-2">2. Bacaan contoh untuk latihan ikhtisar</h3>
                <div className="rounded-2xl border border-gray-200 overflow-hidden"><div className="bg-emerald-700 text-white p-4"><h4 className="text-lg font-bold">Program Membaca Pagi</h4><p className="text-emerald-100 text-sm">Contoh teks informasi</p></div><div className="p-5 text-gray-700 leading-7 space-y-3"><p>SD Tunas Bangsa mengadakan program membaca pagi setiap Selasa dan Kamis selama lima belas menit sebelum pelajaran dimulai. Murid boleh memilih buku cerita, ensiklopedia anak, atau buku pengetahuan sesuai minatnya.</p><p>Setelah membaca, murid menuliskan satu informasi baru atau bagian cerita yang paling menarik pada kartu baca. Pada akhir bulan, guru mengajak murid berbagi isi buku dalam kelompok kecil. Kegiatan ini membantu murid berlatih memahami bacaan, menyampaikan pendapat, dan mendengarkan teman.</p><p>Sekolah menyediakan rak buku di beberapa sudut kelas agar buku mudah dijangkau. Murid juga diajak mengembalikan buku ke tempat semula supaya dapat digunakan bersama.</p></div></div>

                <h3 className="text-lg font-bold text-gray-800 mt-5 mb-2">3. Mengolah bacaan menjadi ikhtisar</h3>
                <ol className="list-decimal pl-6 text-gray-700 space-y-2"><li><strong>Tentukan topik:</strong> program membaca pagi di sekolah.</li><li><strong>Temukan gagasan utama:</strong> program membaca melatih pemahaman bacaan dan kebiasaan berbagi informasi.</li><li><strong>Pilih rincian penting:</strong> dilaksanakan Selasa dan Kamis selama 15 menit; murid menulis kartu baca; kegiatan berbagi dilakukan pada akhir bulan; buku dikembalikan ke rak.</li><li><strong>Pilih rincian yang perlu dipertahankan:</strong> jadwal dan cara kegiatan dilakukan penting untuk menjelaskan program. Daftar semua jenis buku boleh diringkas menjadi “berbagai buku sesuai minat”.</li><li><strong>Tulis dengan kata sendiri:</strong> gabungkan gagasan utama dan rincian yang paling penting tanpa menyalin seluruh teks.</li><li><strong>Periksa kembali:</strong> pastikan ikhtisar tidak menambah klaim, tidak mengubah jadwal, dan tidak menghilangkan tujuan utama.</li></ol>
                <div className="rounded-xl bg-emerald-50 border border-emerald-100 p-4 mt-4"><strong className="text-emerald-900">Contoh ikhtisar yang baik</strong><p className="text-gray-700 mt-2 leading-7">SD Tunas Bangsa mengadakan membaca pagi setiap Selasa dan Kamis selama 15 menit. Murid mencatat informasi atau bagian menarik dari buku, lalu berbagi bacaan pada akhir bulan. Program ini melatih pemahaman, kemampuan menyampaikan pendapat, dan kebiasaan menggunakan buku bersama.</p><p className="text-sm text-gray-600 mt-2">Mengapa baik? Ikhtisar memuat kegiatan, cara pelaksanaan, dan tujuan utama tanpa menyalin setiap rincian.</p></div>
                <div className="rounded-xl bg-rose-50 border border-rose-100 p-4 mt-3"><strong className="text-rose-900">Contoh ikhtisar yang kurang tepat</strong><p className="text-gray-700 mt-2">“Semua murid membaca setiap hari selama satu jam dan wajib menyelesaikan satu buku.”</p><p className="text-gray-700 mt-1">Kesalahan: jadwal dan durasi berubah, serta ada kewajiban yang tidak disebutkan dalam bacaan.</p></div>

                <h3 className="text-lg font-bold text-gray-800 mt-6 mb-2">4. Apa perbedaan ikhtisar dan menyalin kalimat?</h3>
                <div className="overflow-x-auto"><table className="w-full border-collapse text-sm"><thead><tr className="bg-blue-50"><th className="border p-3 text-left">Menyalin</th><th className="border p-3 text-left">Ikhtisar</th></tr></thead><tbody><tr><td className="border p-3 text-gray-700">Mengambil kalimat dari teks tanpa mengolahnya.</td><td className="border p-3 text-gray-700">Memilih inti informasi dan menyatakannya secara lebih ringkas.</td></tr><tr><td className="border p-3 text-gray-700">Dapat terlalu panjang jika banyak kalimat disalin.</td><td className="border p-3 text-gray-700">Menghilangkan pengulangan dan rincian yang tidak diperlukan.</td></tr><tr><td className="border p-3 text-gray-700">Berisiko mengambil rincian yang kurang penting.</td><td className="border p-3 text-gray-700">Menjaga gagasan utama dan rincian pendukung yang paling penting.</td></tr></tbody></table></div>

                <h3 className="text-lg font-bold text-gray-800 mt-6 mb-2">5. Mengenali jenis bagan</h3>
                <div className="grid md:grid-cols-2 gap-3">{[['Bagan pengelompokan','Menunjukkan kategori dan anggota kelompok. Contoh: jenis buku—cerita, pengetahuan, ensiklopedia anak.'],['Bagan urutan proses','Menunjukkan langkah yang dilakukan secara berurutan. Contoh: memilih buku → membaca → menulis kartu baca → berbagi isi buku.'],['Bagan sebab-akibat','Menjelaskan penyebab dan hasil. Contoh: buku mudah dijangkau → murid lebih mudah memilih bacaan.'],['Bagan perbandingan','Menunjukkan persamaan atau perbedaan. Contoh: membaca sendiri dan membaca bersama.'],['Peta konsep','Menunjukkan topik utama dan cabang-cabang informasi terkait.'],['Tabel ringkasan','Menyusun informasi dalam baris dan kolom agar mudah dibandingkan.']].map(([a,b])=><div key={a} className="rounded-xl border border-gray-200 p-4"><h4 className="font-bold text-gray-800">{a}</h4><p className="text-gray-700 mt-1 leading-6">{b}</p></div>)}</div>

                <h3 className="text-lg font-bold text-gray-800 mt-6 mb-2">6. Contoh membuat bagan dari bacaan</h3>
                <p className="text-gray-700 leading-7">Dari bacaan “Program Membaca Pagi”, informasi dapat disusun menjadi bagan berikut.</p>
                <div className="rounded-2xl border border-gray-200 bg-white p-4 mt-3"><div className="rounded-xl bg-blue-800 text-white p-3 text-center font-bold">PROGRAM MEMBACA PAGI</div><div className="grid md:grid-cols-3 gap-3 mt-3">{[['Jadwal','Selasa dan Kamis','15 menit sebelum pelajaran'],['Kegiatan murid','Memilih dan membaca buku','Menulis kartu baca'],['Tujuan dan kebiasaan','Berbagi isi buku','Mengembalikan buku ke rak']].map(([a,b,c])=><div key={a} className="border border-blue-100 rounded-xl overflow-hidden"><div className="bg-blue-50 p-3 font-bold text-blue-900 text-center">{a}</div><div className="p-3 text-gray-700 text-center">{b}<div className="text-sm text-gray-500 mt-1">{c}</div></div></div>)}</div></div>
                <p className="text-gray-700 leading-7 mt-3">Bagan di atas tidak perlu memuat setiap kalimat. Bagan cukup menampilkan kategori dan informasi kunci. Judul utama harus sesuai dengan topik bacaan, sedangkan setiap cabang harus benar-benar berhubungan dengan judul tersebut.</p>

                <h3 className="text-lg font-bold text-gray-800 mt-6 mb-2">7. Membaca dan memeriksa bagan</h3>
                <ol className="list-decimal pl-6 text-gray-700 space-y-2"><li>Baca judul bagan terlebih dahulu.</li><li>Perhatikan nama kategori, label, panah, urutan, atau kolom.</li><li>Periksa hubungan antarkotak. Panah urutan tidak sama dengan panah sebab-akibat.</li><li>Cocokkan setiap informasi dengan teks sumber.</li><li>Jika diminta memilih bagan yang tepat, singkirkan bagan yang kehilangan informasi utama, menukar urutan, atau menambahkan informasi yang tidak ada.</li></ol>

                <h3 className="text-lg font-bold text-gray-800 mt-6 mb-2">8. Latihan dan pembahasan</h3>
                <div className="rounded-2xl bg-gray-50 border border-gray-200 p-5 space-y-4"><div><p className="font-bold text-gray-800">Soal A — Apa topik utama bacaan “Program Membaca Pagi”?</p><p className="text-gray-700 mt-1"><strong>Jawaban:</strong> Program membaca pagi yang dilakukan sekolah. Topik adalah pokok umum yang dibicarakan, bukan satu rincian seperti kartu baca.</p></div><div><p className="font-bold text-gray-800">Soal B — Informasi mana yang sebaiknya dipertahankan dalam ikhtisar?</p><p className="text-gray-700 mt-1"><strong>Jawaban:</strong> Jadwal kegiatan, kegiatan utama murid, dan tujuan program. Rincian yang tidak membantu menjelaskan inti boleh diringkas.</p></div><div><p className="font-bold text-gray-800">Soal C — Bagan apa yang paling tepat untuk menunjukkan langkah dari memilih buku sampai berbagi isi buku?</p><p className="text-gray-700 mt-1"><strong>Jawaban:</strong> Bagan urutan proses, karena kegiatan disajikan menurut urutan pelaksanaannya.</p></div><div><p className="font-bold text-gray-800">Soal D — Mengapa pernyataan “kegiatan berlangsung setiap hari” tidak tepat?</p><p className="text-gray-700 mt-1"><strong>Jawaban:</strong> Bacaan menyebut kegiatan berlangsung setiap Selasa dan Kamis, bukan setiap hari.</p></div></div>

                <div className="rounded-xl bg-amber-50 border border-amber-100 p-4 mt-5"><strong className="text-amber-900">Rumus mudah diingat</strong><p className="text-gray-700 mt-2 leading-7"><strong>Ikhtisar:</strong> topik + gagasan utama + rincian penting, ditulis ringkas. <strong>Bagan:</strong> judul + kategori/urutan + informasi kunci. Untuk keduanya, gunakan isi bacaan sebagai bukti dan jangan menambahkan informasi sendiri.</p></div>

            const renderEvaluation = () => <>
                <p className="text-gray-700 leading-7">Pada kompetensi evaluasi dan apresiasi, murid diminta menilai relevansi peristiwa dengan kehidupan sehari-hari, menilai kesesuaian antarunsur atau antarinformasi, serta menyimpulkan respons emosional terhadap unsur teks fiksi. Penilaian harus memiliki alasan yang dapat dijelaskan.</p>
                <h3 className="text-lg font-bold mt-5 mb-2">1. Menilai relevansi dengan kehidupan sehari-hari</h3><p className="text-gray-700 leading-7">Tanyakan: apakah peristiwa dalam teks mungkin dijumpai dalam kehidupan? Apakah tindakan tokoh dapat diterapkan pada situasi yang serupa? Hubungkan pengalaman pribadi dengan isi bacaan, tetapi jangan menganggap pengalaman pribadi sebagai bukti bahwa semua orang mengalami hal yang sama.</p>
                <div className="rounded-xl bg-rose-50 p-4 mt-3"><strong>Contoh:</strong><p className="mt-2 text-gray-700">Tokoh mengembalikan barang temuan kepada guru agar pemiliknya dapat ditemukan. Peristiwa yang relevan dalam kehidupan sehari-hari adalah menyerahkan barang temuan kepada petugas atau orang dewasa yang tepat, bukan menyimpan barang itu.</p></div>
                <h3 className="text-lg font-bold mt-5 mb-2">2. Menilai kesesuaian antarunsur dan informasi</h3><p className="text-gray-700 leading-7">Periksa apakah tindakan tokoh sesuai dengan wataknya, apakah penyelesaian menjawab masalah, dan apakah kesimpulan didukung oleh informasi. Pada teks informasi, cocokkan pernyataan dengan rincian yang diberikan. Jangan menerima pernyataan hanya karena terdengar masuk akal.</p>
                <h3 className="text-lg font-bold mt-5 mb-2">3. Membedakan fakta, pendapat, dan dugaan</h3><ul className="list-disc pl-6 text-gray-700 space-y-2"><li><strong>Fakta dalam teks:</strong> informasi yang dinyatakan dan dapat diperiksa, misalnya kegiatan dimulai pukul 08.00.</li><li><strong>Pendapat:</strong> penilaian, misalnya “kebun itu sangat indah”.</li><li><strong>Dugaan:</strong> kemungkinan yang belum dipastikan, misalnya “Dina pasti ingin dipuji” jika alasan itu tidak disebutkan.</li></ul>

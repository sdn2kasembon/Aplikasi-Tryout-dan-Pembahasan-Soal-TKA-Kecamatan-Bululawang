                'Mengidentifikasi Objek dalam Teks Fiksi dan Nonfiksi': {definition:'Objek adalah hal yang digambarkan atau dibicarakan dalam bacaan. Teks fiksi dapat memakai bahasa konotatif, majas, dan gambaran pancaindra. Teks nonfiksi cenderung memakai bahasa denotatif, informasi faktual, dan data pendukung.',steps:['Pada teks fiksi, perhatikan kata yang membangun suasana atau memberi makna kias.','Pada teks nonfiksi, cari nama objek dan ciri yang dijelaskan secara langsung.','Cocokkan jawaban dengan kata atau kalimat dalam teks.'],example:'“Hatinya terasa gelap setelah mendengar kabar itu.” Kata gelap menggambarkan kesedihan, bukan keadaan tanpa cahaya.',question:'Dalam kalimat “Jubah hitamnya berkibar tertiup angin”, objek yang digambarkan adalah …',answer:'Jubah hitam.',why:'Kalimat menyebut jubah secara langsung dan menjelaskan warna serta gerakannya.'},
                'Menentukan Unsur Teks': {definition:'Unsur teks adalah bagian penting yang membantu pembaca memahami isi. Dalam cerita, unsur utama meliputi tokoh, watak, latar, peristiwa, masalah, dan penyelesaian. Dalam teks informasi, perhatikan topik, gagasan utama, rincian, serta data.',steps:['Tentukan jenis teks terlebih dahulu.','Untuk cerita, cari siapa yang terlibat, kapan dan di mana kejadian berlangsung, serta masalah yang terjadi.','Untuk teks informasi, catat topik dan informasi yang mendukungnya.'],example:'“Pada Senin pagi, Raka membantu penjaga perpustakaan menyusun buku di ruang baca.” Tokoh: Raka; waktu: Senin pagi; tempat: ruang baca; peristiwa: menyusun buku.',question:'Unsur yang menunjukkan tempat terjadinya peristiwa disebut …',answer:'Latar tempat.',why:'Latar tempat menjelaskan lokasi kejadian dalam teks.'},
                'Menentukan Pernyataan Sesuai Isi Paragraf': {definition:'Pernyataan sesuai isi paragraf adalah pernyataan yang didukung oleh informasi bacaan. Pernyataan yang bertentangan dengan bacaan tidak sesuai, sedangkan hal yang tidak dijelaskan tidak boleh dianggap sebagai fakta.',steps:['Baca pernyataan sampai selesai.','Temukan bagian bacaan yang menjadi bukti.','Tentukan apakah isinya sesuai, bertentangan, atau tidak dapat dipastikan.','Pada soal kategori, periksa setiap pernyataan secara terpisah.'],example:'Teks: “Perpustakaan tutup pukul 12.00 pada hari Jumat.” Pernyataan “Pada Jumat perpustakaan tutup pukul 12.00” sesuai; pernyataan “Perpustakaan tutup pukul 15.00” bertentangan.',question:'Jika bacaan tidak menyebutkan alasan seorang tokoh datang terlambat, apakah kita boleh memastikan alasannya?',answer:'Tidak boleh.',why:'Alasan itu tidak didukung informasi dalam bacaan.'},
                'Menyimpulkan Amanat': {definition:'Amanat adalah pesan atau pelajaran yang dapat dipetik dari cerita. Amanat perlu disimpulkan dari tindakan tokoh, masalah, akibat tindakan, dan penyelesaian cerita.',steps:['Tentukan masalah utama cerita.','Perhatikan pilihan dan tindakan tokoh.','Amati akibat dari tindakan tersebut.','Rumuskan pesan yang sesuai dengan keseluruhan cerita.'],example:'Tokoh mengakui kesalahan dan memperbaikinya sehingga masalah selesai. Amanat yang mungkin: berani mengakui kesalahan dan bertanggung jawab.',question:'Tokoh mengembalikan dompet yang ditemukan kepada pemiliknya. Nilai yang paling jelas ditunjukkan adalah …',answer:'Kejujuran dan tanggung jawab.',why:'Tokoh tidak mengambil barang yang bukan miliknya dan berusaha mengembalikannya.'},
                'Menyimpulkan Peristiwa dan Nilai dalam Teks': {definition:'Tema merupakan pokok cerita. Karakter adalah sifat tokoh, konflik adalah masalah yang dihadapi, sedangkan nilai adalah pelajaran atau sikap yang tampak melalui peristiwa.',steps:['Cari peristiwa yang paling penting.','Amati ucapan dan tindakan tokoh untuk mengenali sifatnya.','Tentukan masalah dan cara masalah diselesaikan.','Simpulkan nilai berdasarkan bukti, bukan dugaan pribadi.'],example:'Seorang murid tetap berlatih setelah gagal dalam lomba dan akhirnya mampu memperbaiki hasilnya. Peristiwa ini menunjukkan ketekunan.',question:'Sifat tokoh paling tepat disimpulkan dari …',answer:'Ucapan, tindakan, keputusan, dan akibat tindakannya.',why:'Sifat tokoh sebaiknya ditafsirkan berdasarkan bukti yang ditampilkan cerita.'},
                'Menyimpulkan Perubahan Objek, Karakter, atau Latar': {definition:'Perubahan dalam cerita dapat terjadi pada keadaan benda, sifat tokoh, atau suasana dan tempat. Pembaca perlu membandingkan keadaan awal dan akhir lalu mencari peristiwa yang menyebabkan perubahan.',steps:['Catat keadaan pada awal cerita.','Temukan keadaan yang berubah pada bagian berikutnya.','Cari peristiwa atau alasan yang menjelaskan perubahan.','Pastikan simpulan sesuai dengan urutan cerita.'],example:'Awalnya Dini takut berbicara di depan kelas. Setelah berlatih dan mendapat dukungan, ia berani menyampaikan hasil kelompok. Perubahan karakter: lebih percaya diri.',question:'Apa yang perlu dibandingkan untuk menyimpulkan perubahan tokoh?',answer:'Keadaan, sikap, atau tindakannya pada bagian awal dan akhir cerita.',why:'Perubahan baru dapat disimpulkan jika ada bukti perbedaan keadaan.'},
                'Menentukan Makna Kata, Simbol, dan Kias': {definition:'Makna kata atau simbol ditentukan oleh konteks. Makna denotatif adalah makna sebenarnya, sedangkan makna konotatif atau kias menyampaikan makna tambahan yang tidak selalu harfiah.',steps:['Baca kalimat sebelum dan sesudah kata atau simbol.','Tentukan apakah kata digunakan secara harfiah atau kias.','Gunakan petunjuk peristiwa, suasana, dan hubungan antarkalimat.','Uji apakah arti yang dipilih sesuai dengan keseluruhan teks.'],example:'“Rina menjadi bintang kelas.” Kata bintang tidak berarti benda langit, tetapi murid yang menonjol atau berprestasi.',question:'Makna ungkapan “buah tangan” dalam kalimat “Paman membawa buah tangan dari Malang” adalah …',answer:'Oleh-oleh.',why:'Konteks bepergian menunjukkan bahwa ungkapan itu bermakna barang yang dibawa sebagai pemberian.'},
                'Menggali Informasi Tersirat dalam Karya Sastra': {definition:'Informasi tersirat tidak dinyatakan langsung. Pembaca menyimpulkannya dengan menghubungkan tindakan, dialog, suasana, dan akibat yang terdapat dalam cerita.',steps:['Temukan beberapa petunjuk dalam cerita.','Hubungkan petunjuk tersebut secara logis.','Pilih simpulan yang paling kuat didukung teks.','Hindari menambahkan alasan atau kejadian yang tidak disebutkan.'],example:'Tokoh melihat awan gelap lalu segera memasukkan buku ke dalam tas. Pembaca dapat menyimpulkan bahwa tokoh memperkirakan hujan akan turun.',question:'Mengapa simpulan tersirat harus didukung beberapa petunjuk?',answer:'Agar simpulan tidak sekadar menjadi tebakan.',why:'Petunjuk dari teks menjadi dasar untuk menafsirkan informasi yang tidak dinyatakan langsung.'},
                'Menentukan Keteladanan Tokoh Cerita': {definition:'Keteladanan adalah sikap atau tindakan positif yang layak dicontoh. Penilaiannya harus bertumpu pada perilaku tokoh, bukan hanya pujian dari tokoh lain.',steps:['Tandai tindakan penting tokoh.','Periksa siapa yang terbantu atau akibat apa yang muncul.','Tentukan nilai positif yang ditunjukkan.','Jelaskan bukti dari cerita yang mendukung pilihanmu.'],example:'Seorang tokoh membagi tugas secara adil dan membantu anggota yang kesulitan. Keteladanan yang terlihat adalah kerja sama dan kepedulian.',question:'Tokoh mengembalikan barang temuan kepada guru. Sikap yang dapat diteladani adalah …',answer:'Jujur dan bertanggung jawab.',why:'Tindakan tersebut menunjukkan bahwa tokoh menjaga barang milik orang lain.'},
                'Jenis Majas': {definition:'Majas adalah penggunaan bahasa untuk memberi kesan tertentu. Metafora membandingkan secara langsung; personifikasi memberi sifat manusia kepada benda; hiperbola melebih-lebihkan; asosiasi membandingkan dengan kata seperti, bagai, atau laksana.',steps:['Baca kalimat secara utuh.','Cari apakah makna kalimat harfiah atau kias.','Perhatikan ciri pembanding atau tindakan manusia yang diberikan kepada benda.','Pilih jenis majas yang paling sesuai.'],example:'“Angin berbisik di antara pepohonan” adalah personifikasi karena angin digambarkan melakukan tindakan manusia. “Wajahnya bersinar seperti bulan” merupakan asosiasi.',question:'Kalimat “Aku sudah menunggumu seribu tahun” menggunakan majas …',answer:'Hiperbola.',why:'Ungkapan “seribu tahun” merupakan pelewatan yang sengaja digunakan untuk menekankan lamanya menunggu.'},
                'Makna Istilah, Ungkapan, dan Peribahasa': {definition:'Istilah adalah kata atau gabungan kata yang bermakna khusus dalam bidang tertentu. Ungkapan dan peribahasa memiliki makna yang perlu dipahami dari konteks, bukan semata-mata dari arti kata penyusunnya.',steps:['Kenali bidang atau situasi penggunaan kata.','Baca konteks kalimat dan cari petunjuk makna.','Untuk ungkapan, jangan selalu menafsirkan kata secara harfiah.','Untuk peribahasa, simpulkan pesan yang sesuai dengan situasi.'],example:'“Tangan kanan ketua kelas” berarti orang yang dipercaya membantu tugas penting. “Ringan tangan” dapat berarti suka menolong, bergantung konteks.',question:'Makna ungkapan “panjang tangan” yang digunakan untuk menggambarkan perilaku seseorang adalah …',answer:'Suka mencuri.',why:'Ungkapan ini tidak bermakna ukuran tangan, melainkan perilaku mengambil milik orang lain.'},
                'Melengkapi Teks Laporan, Iklan, dan Pidato': {definition:'Bagian yang hilang pada teks harus dilengkapi sesuai tujuan, isi, dan struktur teks. Laporan menyampaikan hasil pengamatan; iklan mengajak atau menawarkan sesuatu; pidato menyampaikan gagasan kepada pendengar.',steps:['Kenali jenis teks dan tujuannya.','Perhatikan bagian sebelum dan sesudah bagian rumpang.','Pilih kalimat yang menjaga kesinambungan gagasan dan bahasa.','Pastikan informasi tambahan tidak bertentangan dengan teks.'],example:'Laporan pengamatan biasanya memuat objek, ciri yang diamati, dan hasil pengamatan. Iklan perlu menyampaikan produk atau ajakan secara jelas.',question:'Kalimat “Ayo, bawa botol minum sendiri untuk mengurangi sampah plastik!” paling cocok digunakan dalam …',answer:'Teks iklan atau poster ajakan.',why:'Kalimat itu menggunakan ajakan langsung untuk mendorong pembaca melakukan tindakan.'},
                'Menyimpulkan Respons Emosional terhadap Teks Fiksi': {definition:'Respons emosional berkaitan dengan perasaan seperti senang, sedih, khawatir, atau kagum yang muncul ketika membaca peristiwa dalam cerita. Perasaan perlu dikaitkan dengan unsur cerita yang memicunya.',steps:['Kenali peristiwa utama dan keadaan tokoh.','Tentukan perasaan yang mungkin muncul berdasarkan peristiwa itu.','Jelaskan bagian cerita yang menjadi alasan.','Jika memperkirakan kelanjutan cerita, pastikan prediksi masuk akal berdasarkan petunjuk.'],example:'Tokoh berlatih berulang kali lalu berhasil tampil. Pembaca dapat merasa senang atau kagum karena ketekunannya membuahkan hasil.',question:'Apa yang membuat simpulan tentang perasaan pembaca menjadi kuat?',answer:'Alasan yang dikaitkan dengan peristiwa atau unsur tertentu dalam cerita.',why:'Respons emosional tidak hanya menyebut perasaan, tetapi menjelaskan pemicunya dari bacaan.'}
            };

            const renderLesson = () => {
                if (sourceLessons[topic]) { const l=sourceLessons[topic]; return <><p className="text-gray-700 leading-7">{l.definition}</p><h3 className="text-lg font-bold text-gray-800 mt-5 mb-2">Langkah memahami materi</h3><ol className="list-decimal pl-6 text-gray-700 space-y-2">{l.steps.map((step,i)=><li key={i}>{step}</li>)}</ol><div className="rounded-xl bg-sky-50 border border-sky-100 p-4 mt-5"><strong className="text-sky-900">Contoh dan analisis</strong><p className="text-gray-700 mt-2 leading-7">{l.example}</p></div><details className="rounded-xl border border-emerald-200 mt-5 p-4"><summary className="font-bold text-emerald-900 cursor-pointer">Coba jawab pertanyaan materi</summary><p className="text-gray-800 mt-3">{l.question}</p><div className="mt-3 rounded-lg bg-emerald-50 p-3"><strong>Jawaban:</strong> {l.answer}<p className="text-gray-700 mt-1"><strong>Pembahasan:</strong> {l.why}</p></div></details><div className="rounded-xl bg-amber-50 border border-amber-100 p-4 mt-5"><strong className="text-amber-900">Ingat</strong><p className="text-gray-700 mt-1">Gunakan bukti dari bacaan. Jangan menambahkan informasi yang tidak didukung teks.</p></div></>; }
                if (topic === 'Memahami Teks Fiksi') return renderFiction();
                if (topic === 'Memahami Teks Informasi') return renderInfo();
                if (topic === 'Gagasan Utama dan Gagasan Pendukung') return renderMainIdea();
                if (topic === 'Informasi Tersurat') return renderTextual();
                if (topic === 'Inferensi dan Kesimpulan') return renderInference();
                if (topic === 'Evaluasi dan Apresiasi') return renderEvaluate();
                if (topic === 'Kosakata, Makna, dan Ungkapan') return renderVocabulary();
                if (topic === 'Menyusun Ikhtisar dan Bagan') return renderSummary();
                if (topic === 'Menilai Relevansi dan Kesesuaian') return renderEvaluation();
                if (topic === 'Strategi Menjawab Soal TKA') return renderStrategy();
                return <><p className="text-gray-700 leading-7">Latihan berikut menggabungkan pemahaman tekstual, inferensial, serta evaluasi dan apresiasi. Bacalah pertanyaan dengan teliti, pilih jawaban, lalu tekan tombol periksa.</p><div className="rounded-xl bg-blue-50 border border-blue-100 p-4 mt-4"><strong className="text-blue-900">Saran belajar</strong><p className="text-gray-700 mt-1">Jika jawaban salah, baca pembahasannya dan kembali ke bagian materi yang terkait. Tujuan latihan adalah memahami alasan, bukan hanya memperoleh nilai.</p></div></>;
            };

            return <div className="min-h-screen bg-slate-50 p-4 md:p-8"><div className="max-w-6xl mx-auto">
                <button onClick={onBack} className="mb-5 text-blue-700 font-semibold flex items-center gap-2"><ChevronLeft size={18}/> Kembali ke pilihan murid</button>
                <div className="rounded-3xl bg-gradient-to-r from-blue-900 via-blue-800 to-indigo-800 text-white p-6 md:p-8 mb-6 shadow-lg"><div className="flex items-start gap-4"><div className="rounded-2xl bg-white/15 p-3"><BookOpenIcon size={34}/></div><div><h1 className="text-2xl md:text-3xl font-extrabold">Ruang Materi TKA SD/MI</h1><p className="text-blue-100 mt-2 leading-6">Materi dan latihan tertanam langsung dalam aplikasi. Siswa dapat belajar tanpa membuka dokumen eksternal.</p><div className="mt-4 flex flex-wrap gap-2"><span className="rounded-full bg-white/15 px-3 py-1 text-sm">Materi lengkap</span><span className="rounded-full bg-white/15 px-3 py-1 text-sm">Contoh bacaan</span><span className="rounded-full bg-white/15 px-3 py-1 text-sm">Latihan & pembahasan</span></div></div></div></div>
                <div className="flex flex-wrap gap-3 mb-5">{['Bahasa Indonesia','Matematika'].map(s=><button key={s} onClick={()=>{setSubject(s);setShowResults(false);setAnswers({});if(s==='Bahasa Indonesia')setTopic('Memahami Teks Fiksi');else setMathTopic('Semua materi')}} className={`px-5 py-3 rounded-xl font-bold transition ${subject===s?'bg-blue-700 text-white shadow':'bg-white text-gray-700 border border-gray-200 hover:border-blue-300'}`}>{s}</button>)}</div>
                {subject==='Bahasa Indonesia' ? <div className="grid lg:grid-cols-[280px_minmax(0,1fr)] gap-5 items-start">
                    <aside className="bg-white border border-gray-200 rounded-2xl p-3 shadow-sm lg:sticky lg:top-4"><h2 className="font-extrabold text-gray-800 px-3 pt-2 pb-3">Daftar materi Bahasa Indonesia</h2><div className="space-y-1">{bahasaTopics.map((t,i)=><button key={t.title} onClick={()=>{setTopic(t.title);setShowResults(false);setPracticeChecked(false);setPracticeAnswers({})}} className={`w-full text-left p-3 rounded-xl transition ${topic===t.title?'bg-blue-50 border border-blue-200 text-blue-900':'hover:bg-gray-50 text-gray-700'}`}><div className="flex gap-3 items-start"><span className={`flex items-center justify-center w-7 h-7 rounded-lg text-xs font-extrabold shrink-0 ${topic===t.title?'bg-blue-700 text-white':'bg-gray-100 text-gray-600'}`}>{i+1}</span><span><span className="block font-bold text-sm">{t.title}</span><span className="block text-xs text-gray-500 mt-1 leading-5">{t.desc}</span></span></div></button>)}</div><div className="mt-3 p-3 rounded-xl bg-emerald-50 text-emerald-900 text-sm"><strong>Target belajar</strong><p className="mt-1">Memahami bacaan, menyimpulkan dengan bukti, dan menilai isi secara cermat.</p></div></aside>
                    <main className="min-w-0 space-y-5"><div className="flex justify-end"><button className="pdf-download-trigger rounded-xl bg-rose-700 hover:bg-rose-800 text-white font-bold px-5 py-3 shadow-sm" onClick={(e)=>downloadMaterialPdf(e,'Bahasa Indonesia',topic,buildAnswerHtml(selectedPractice,'Bahasa Indonesia'))}>{topic==='Latihan Terpadu'?'⬇ Unduh PDF Latihan Terpadu':'⬇ Unduh PDF Materi Ini + Latihan'}</button></div><article className="bg-white border border-gray-200 rounded-2xl p-5 md:p-7 shadow-sm"><div className="text-xs font-extrabold uppercase tracking-wide text-blue-700 mb-2">{currentTopic.tag}</div><h2 className="text-2xl font-extrabold text-gray-900 mb-2">{topic}</h2><p className="text-gray-500 mb-5">{currentTopic.desc}</p><div className="prose max-w-none">{renderLesson()}</div><div className="mt-7 border-t border-gray-100 pt-5 flex flex-wrap gap-3"><button onClick={()=>{setTopic(topic==='Latihan Terpadu'?'Memahami Teks Fiksi':'Latihan Terpadu');setShowResults(false);setPracticeChecked(false);setPracticeAnswers({})}} className="rounded-xl bg-blue-700 hover:bg-blue-800 text-white font-bold px-4 py-3">{topic==='Latihan Terpadu'?'Kembali ke materi':'Lanjut ke Latihan Terpadu'}</button><button onClick={()=>setShowAllLessons(v=>!v)} className="rounded-xl border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold px-4 py-3">{showAllLessons?'Sembunyikan peta belajar':'Lihat peta seluruh materi'}</button></div>{showAllLessons&&<div className="mt-5 grid sm:grid-cols-2 gap-3">{bahasaTopics.map((t,i)=><button key={t.title} onClick={()=>{setTopic(t.title);setShowResults(false);setPracticeChecked(false);setPracticeAnswers({})}} className="text-left rounded-xl border border-gray-200 p-4 hover:border-blue-300"><span className="text-xs font-bold text-blue-700">MATERI {i+1}</span><span className="block font-bold text-gray-800 mt-1">{t.title}</span><span className="block text-sm text-gray-600 mt-1">{t.desc}</span></button>)}</div>}</article>
                    {<section className="bg-white border border-indigo-100 rounded-2xl p-5 md:p-7 shadow-sm"><div className="flex flex-wrap items-start justify-between gap-3"><div><h2 className="text-xl font-extrabold text-gray-900">{topic==='Latihan Terpadu'?'Latihan Terpadu Bahasa Indonesia':'Latihan khusus: '+topic}</h2><p className="text-gray-600 text-sm mt-1">{topic==='Latihan Terpadu'?'24 soal dengan tiga bentuk: PG Sederhana, PGK MCMA, dan PGK Kategori. Setiap kelompok soal menggunakan bacaan 150–200 kata.':'Soal dibuat khusus untuk materi ini. Bacaan latihan berjumlah 150–200 kata dan soal tidak diulang sebagai latihan terpadu.'}</p></div><span className="rounded-full bg-indigo-50 text-indigo-800 px-3 py-1 text-sm font-bold">{selectedPractice.length} soal · 3 bentuk</span></div>{topic!=='Latihan Terpadu'&&readingPassages[topic]&&<div className="mt-5 rounded-2xl border border-emerald-100 overflow-hidden"><div className="bg-emerald-700 text-white p-4"><h3 className="font-bold text-lg">Bacaan latihan: {topic}</h3><p className="text-emerald-100 text-sm">Bacaan sekitar 150–200 kata. Gunakan informasi dalam bacaan untuk menjawab soal.</p></div><div className="p-5 text-gray-700 leading-7 whitespace-pre-line">{readingPassages[topic]}</div></div>}<div className="mt-5 space-y-7">{selectedPractice.map((q,qi)=><React.Fragment key={q.id}>{topic==='Latihan Terpadu'&&q.passageKey&&(qi===0||q.passageKey!==selectedPractice[qi-1].passageKey)&&<div className="rounded-2xl border border-emerald-100 overflow-hidden"><div className="bg-emerald-700 text-white p-4"><h3 className="font-bold text-lg">Bacaan {Math.floor(qi/3)+1}: {q.passageKey}</h3><p className="text-emerald-100 text-sm">Bacaan sekitar 150–200 kata. Gunakan bacaan ini untuk tiga soal berikutnya.</p></div><div className="p-5 text-gray-700 leading-7 whitespace-pre-line">{readingPassages[q.passageKey]}</div></div>}<div className="border border-gray-200 rounded-xl p-4 md:p-5"><div className="flex flex-wrap gap-2 items-center mb-3"><span className="text-xs font-extrabold bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full">{q.type}</span><span className="text-xs text-gray-500">Soal {qi+1} dari {selectedPractice.length}</span></div><p className="font-bold text-gray-800 leading-7">{q.question}</p>{q.type==='PG Sederhana'&&<div className="space-y-2 mt-3">{q.options.map((opt,j)=><label key={opt} className={`flex gap-3 items-start p-3 rounded-xl border cursor-pointer ${practiceAnswers[q.id]===j?'border-indigo-400 bg-indigo-50':'border-gray-200 hover:bg-gray-50'}`}><input type="radio" name={q.id} checked={practiceAnswers[q.id]===j} onChange={()=>setPracticeAnswer(q.id,j)} className="mt-1"/><span className="text-gray-700">{String.fromCharCode(65+j)}. {opt}</span></label>)}</div>}{q.type==='PGK MCMA'&&<><p className="text-sm text-indigo-800 mt-2">Pilih semua jawaban yang benar (jawaban dapat lebih dari satu).</p><div className="space-y-2 mt-3">{q.options.map((opt,j)=><label key={opt} className={`flex gap-3 items-start p-3 rounded-xl border cursor-pointer ${Array.isArray(practiceAnswers[q.id])&&practiceAnswers[q.id].includes(j)?'border-indigo-400 bg-indigo-50':'border-gray-200 hover:bg-gray-50'}`}><input type="checkbox" checked={Array.isArray(practiceAnswers[q.id])&&practiceAnswers[q.id].includes(j)} onChange={e=>{const old=Array.isArray(practiceAnswers[q.id])?practiceAnswers[q.id]:[];setPracticeAnswer(q.id,e.target.checked?[...old,j]:old.filter(v=>v!==j));}} className="mt-1"/><span className="text-gray-700">{String.fromCharCode(65+j)}. {opt}</span></label>)}</div></>}{q.type==='PGK Kategori'&&<div className="mt-3 space-y-3">{q.statements.map((st,j)=><div key={st.text} className="rounded-xl bg-gray-50 border border-gray-200 p-3"><p className="text-gray-800">{j+1}. {st.text}</p><div className="flex flex-wrap gap-4 mt-2">{q.categories.map((cat,k)=><label key={cat} className="inline-flex items-center gap-2 text-sm text-gray-700"><input type="radio" name={q.id+'_'+j} checked={Array.isArray(practiceAnswers[q.id])&&practiceAnswers[q.id][j]===k} onChange={()=>{const old=Array.isArray(practiceAnswers[q.id])?[...practiceAnswers[q.id]]:Array(q.statements.length).fill(null);old[j]=k;setPracticeAnswer(q.id,old);}}/>{cat}</label>)}</div></div>)}</div>}{practiceChecked&&<div className={`mt-4 rounded-xl p-4 ${practiceQuestionCorrect(q)?'bg-emerald-50 border border-emerald-100':'bg-amber-50 border border-amber-100'}`}><p className="font-bold">{practiceQuestionCorrect(q)?'Benar!':'Belum tepat. Pelajari kunci dan pembahasan berikut.'}</p><p className="text-sm text-gray-700 mt-1"><strong>Kunci:</strong> {q.type==='PG Sederhana'?String.fromCharCode(65+q.correct)+'. '+q.options[q.correct]:q.type==='PGK MCMA'?q.correct.map(v=>String.fromCharCode(65+v)+'. '+q.options[v]).join(' | '):q.statements.map((st,j)=>(j+1)+'. '+st.text+' — '+q.categories[st.correct]).join(' ')}</p><p className="text-sm text-gray-700 leading-6 mt-2">{q.explain}</p></div>}</div></React.Fragment>)}</div><div className="flex flex-wrap items-center gap-3 mt-5"><button onClick={()=>setPracticeChecked(true)} className="rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-5 py-3">{topic==='Latihan Terpadu'?'Periksa Latihan Terpadu':'Periksa Latihan Materi'}</button><button onClick={()=>{setPracticeAnswers({});setPracticeChecked(false)}} className="rounded-xl border border-gray-300 text-gray-700 font-bold px-5 py-3">{topic==='Latihan Terpadu'?'Ulangi Latihan Terpadu':'Ulangi Latihan Materi'}</button>{practiceChecked&&<span className="font-extrabold text-gray-800">Nilai: {selectedPractice.filter(practiceQuestionCorrect).length} dari {selectedPractice.length}</span>}</div></section>}

                    <div className="rounded-2xl bg-amber-50 border border-amber-100 p-5"><h3 className="font-extrabold text-amber-900">Cara menggunakan materi</h3><p className="text-gray-700 mt-2 leading-6">Baca penjelasan, pelajari contoh, lalu kerjakan latihan. Materi Matematika disusun berdasarkan elemen Bilangan, Geometri dan Pengukuran, serta Data sesuai kerangka TKA SD/MI. Latihan merupakan bahan belajar untuk melatih pemahaman, aplikasi, penalaran, representasi, dan pemecahan masalah; bukan naskah soal resmi.</p></div></main>
                </div> : <div className="grid lg:grid-cols-[280px_minmax(0,1fr)] gap-5 items-start">
                    <aside className="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm lg:sticky lg:top-4">
                      <h2 className="font-extrabold text-gray-800 mb-3">Daftar materi Matematika</h2>
                      <label className="block text-sm font-bold text-gray-700 mb-2">Pilih elemen</label>
                      <select value={mathTopic} onChange={e=>{const val=e.target.value;setMathTopic(val);const next=mathMaterials.find(m=>val==='Semua materi'||m.category===val);if(next){setMathLessonTitle(next.title);setMathQuizAnswers({});setMathQuizChecked(false)}}} className="w-full p-3 bg-white border border-gray-300 rounded-xl mb-4">{['Semua materi',...new Set(mathMaterials.map(m=>m.category))].map(t=><option key={t}>{t}</option>)}</select>
                      <button onClick={()=>{setMathLessonTitle('Latihan Soal Terpadu');setMathQuizAnswers({});setMathQuizChecked(false)}} className={`w-full text-left p-3 rounded-xl border mb-3 transition ${mathLessonTitle==='Latihan Soal Terpadu'?'bg-indigo-50 border-indigo-300 text-indigo-900':'bg-indigo-50/50 border-indigo-100 hover:bg-indigo-100 text-indigo-900'}`}><span className="text-xs font-extrabold">LATIHAN SEMUA MATERI</span><span className="block text-sm font-extrabold mt-1">Latihan Soal Terpadu</span><span className="block text-xs mt-1">24 soal · 3 bentuk soal</span></button>
                      <div className="space-y-1 max-h-[58vh] overflow-y-auto">{mathMaterials.filter(m=>mathTopic==='Semua materi'||m.category===mathTopic).map((m,i)=><button key={m.title} onClick={()=>{setMathLessonTitle(m.title);setMathQuizAnswers({});setMathQuizChecked(false)}} className={`w-full text-left p-3 rounded-xl border transition ${mathLessonTitle===m.title?'bg-blue-50 border-blue-200 text-blue-900':'border-transparent hover:bg-gray-50 text-gray-700'}`}><span className="text-xs font-bold opacity-70">{m.category} · {i+1}</span><span className="block text-sm font-bold mt-1">{m.title}</span></button>)}</div>
                      <div className="mt-4 p-3 rounded-xl bg-emerald-50 text-emerald-900 text-sm"><strong>Tips belajar</strong><p className="mt-1">Pilih satu materi, pelajari ilustrasi dan contoh, lalu jawab tiga bentuk soal.</p></div>
                    </aside>
                    {(()=>{const isIntegrated=mathLessonTitle==='Latihan Soal Terpadu';const m=mathMaterials.find(x=>x.title===mathLessonTitle)||mathMaterials[0];const integratedQs=mathMaterials.map((material,index)=>{const pool=mathQuestionBank[material.title]||[];let q=pool[index%3];if(!q){q={type:'PGK Kategori',q:'Perhatikan cara membaca data pada gambar atau diagram.',categories:['Tepat','Tidak tepat'],statements:[{text:'Judul dan keterangan gambar perlu dibaca sebelum menafsirkan data.',correct:0},{text:'Nilai setiap gambar boleh diabaikan saat menghitung jumlah.',correct:1},{text:'Kesimpulan harus sesuai dengan informasi yang ditampilkan.',correct:0}],explain:'Judul, keterangan nilai gambar, dan data yang ditampilkan harus dibaca bersama agar kesimpulan tepat.'};}return {...q,materialTitle:material.title,materialCategory:material.category,practiceId:'math_integrated_'+index};});const qs=isIntegrated?integratedQs:(mathQuestionBank[m.title]||[]).map((q,index)=>({...q,materialTitle:m.title,materialCategory:m.category,practiceId:'math_'+m.title+'_'+index}));const isCorrect=(q)=>{const a=mathQuizAnswers[q.practiceId];if(q.type==='PG Sederhana')return a===q.correct;if(q.type==='PGK MCMA')return Array.isArray(a)&&a.length===q.correct.length&&a.every(v=>q.correct.includes(v));return Array.isArray(a)&&a.length===q.statements.length&&q.statements.every((st,i)=>a[i]===st.correct)};return <main className="min-w-0 space-y-5"><div className="flex justify-end"><button className="pdf-download-trigger rounded-xl bg-rose-700 hover:bg-rose-800 text-white font-bold px-5 py-3 shadow-sm" onClick={(e)=>downloadMaterialPdf(e,'Matematika',isIntegrated?'Latihan Soal Terpadu Matematika':m.title,buildAnswerHtml(qs,'Matematika'),isIntegrated?mathMaterials.map((item,i)=>`<div class="answer-item"><h3>${i+1}. ${pdfHtmlEscape(item.title)} · ${pdfHtmlEscape(item.category)}</h3><p>${pdfHtmlEscape(item.desc)}</p>${item.sections.map(sec=>`<p><strong>${pdfHtmlEscape(sec.heading)}:</strong> ${pdfHtmlEscape(sec.body)}</p>`).join('')}${mathLearningGuideHtml(item,pdfHtmlEscape)}<p><strong>Contoh soal:</strong> ${pdfHtmlEscape(item.examples.map(ex=>ex.q+' Pembahasan: '+ex.a).join(' | '))}</p><p><strong>Latihan pemanasan:</strong> ${pdfHtmlEscape(item.practice)}</p><p><strong>Kunci:</strong> ${pdfHtmlEscape(item.answer)}</p><p><strong>Pembahasan:</strong> ${pdfHtmlEscape(item.explain)}</p></div>`).join(''):'')}>⬇ Unduh PDF Materi dan Soal</button></div>

]:old.filter(v=>v!==j)}))}} className="mt-1"/><span className="text-gray-700">{String.fromCharCode(65+j)}. {opt}</span></label>)}</div></>}{q.type==='PGK Kategori'&&<div className="mt-3 space-y-3">{q.statements.map((st,j)=><div key={st.text} className="rounded-xl bg-gray-50 border border-gray-200 p-3"><p className="text-gray-800">{j+1}. {st.text}</p><div className="flex flex-wrap gap-4 mt-2">{q.categories.map((cat,k)=><label key={cat} className="inline-flex items-center gap-2 text-sm text-gray-700"><input type="radio" name={'mathcat_'+q.practiceId+'_'+j} checked={Array.isArray(mathQuizAnswers[q.practiceId])&&mathQuizAnswers[q.practiceId][j]===k} onChange={()=>{const old=Array.isArray(mathQuizAnswers[q.practiceId])?[...mathQuizAnswers[q.practiceId]]:Array(q.statements.length).fill(null);old[j]=k;setMathQuizAnswers(prev=>({...prev,[q.practiceId]:old}))}}/>{cat}</label>)}</div></div>)}</div>}{mathQuizChecked&&<div className={`mt-4 rounded-xl p-4 ${isCorrect(q)?'bg-emerald-50 border border-emerald-100':'bg-amber-50 border border-amber-100'}`}><p className="font-bold">{isCorrect(q)?'Benar!':'Belum tepat. Perhatikan kunci dan pembahasan.'}</p><p className="text-sm text-gray-700 mt-1"><strong>Kunci:</strong> {q.type==='PG Sederhana'?String.fromCharCode(65+q.correct)+'. '+q.options[q.correct]:q.type==='PGK MCMA'?q.correct.map(v=>String.fromCharCode(65+v)+'. '+q.options[v]).join(' | '):q.statements.map((st,j)=>(j+1)+'. '+st.text+' — '+q.categories[st.correct]).join(' ')}</p><p className="text-sm text-gray-700 leading-6 mt-2">{q.explain}</p></div>}</div>)}</div><div className="flex flex-wrap items-center gap-3 mt-5"><button onClick={()=>setMathQuizChecked(true)} className="rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-5 py-3">{isIntegrated?'Periksa Jawaban Latihan Terpadu':'Periksa Jawaban'}</button><button onClick={()=>{setMathQuizAnswers({});setMathQuizChecked(false)}} className="rounded-xl border border-gray-300 text-gray-700 font-bold px-5 py-3">{         const StudentLogin = ({ onBack, onStartExam }) => {
            const [formData, setFormData] = useState({ name: '', nisn: '', birthPlace: '', gender: 'Laki-laki', birthDate: '', birthMonth: '', birthYear: '', school: '', province: '', provinceCode: '', regency: '', token: '' });
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {

                if (!/^\d{10}$/.test(formData.nisn)) { setError("NISN harus terdiri dari tepat 10 digit angka. Periksa kembali NISN yang dimasukkan."); return; }
                setChecking(true);
                try {
                    const tokenUpper = formData.token.trim().toUpperCase();

                    // Anti-duplikasi memakai ID sesi pengerjaan, bukan token.
                    // Sesi yang sama tidak dapat menghasilkan nilai lebih dari satu kali.

                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'active_exams', tokenUpper);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) { 
                        const examData = docSnap.data();
                        
                        if (examData.status !== 'active') {
                            setError("Ujian ini sudah tidak aktif.");
                            return;
                        }
                        if (!Array.isArray(examData.questions) || examData.questions.length === 0) {
                            setError("Paket ujian tidak memiliki soal yang dapat dikerjakan.");
                            return;
                        }

                        const attemptLimitId = makeAttemptLimitId(examData.teacherId || '', examData.title || '', formData.nisn);
                        const attemptLimitRef = doc(db, 'artifacts', appId, 'public', 'data', 'exam_results', attemptLimitId);
                        // Hitung hasil lama untuk mempertahankan batas sebelum fitur sesi dipasang.
                        const legacyAttemptsSnap = await getDocs(query(
                            collection(db, 'artifacts', appId, 'public', 'data', 'exam_results'),
                            where('teacherId', '==', examData.teacherId || ''),
                            where('examTitle', '==', examData.title || ''),
                            where('nisn', '==', formData.nisn)
                        ));
                        const legacyAttemptCount = legacyAttemptsSnap.docs.filter(d => d.data()._systemType !== 'attempt-limit').length;
                        const proposedSessionId = (window.crypto && window.crypto.randomUUID)
                            ? `s_${window.crypto.randomUUID().replace(/-/g, '')}`
                            : `s_${Date.now()}_${Math.random().toString(36).slice(2, 12)}`;
                        const sessionId = await runTransaction(db, async (transaction) => {
                            const lockSnap = await transaction.get(attemptLimitRef);
                            const lockData = lockSnap.exists() ? lockSnap.data() : {};
                            const usedAttempts = Math.max(Number(lockData.count || 0), legacyAttemptCount);
                            if (usedAttempts >= MAX_EXAM_SUBMISSIONS_PER_STUDENT) {
                                const limitError = new Error(`Batas pengerjaan untuk ujian "${examData.title}" sudah tercapai (maksimal ${MAX_EXAM_SUBMISSIONS_PER_STUDENT} kali untuk NISN ini).`);
                                limitError.code = 'attempt-limit-reached';
                                throw limitError;
                            }
                            // Login dari tab/perangkat lain saat sesi masih aktif memakai ID sesi sama.
                            const activeSessionId = String(lockData.activeSessionId || '');
                            if (activeSessionId) return activeSessionId;
                            transaction.set(attemptLimitRef, {
                                _systemType: 'attempt-limit',
                                teacherId: examData.teacherId || '',
                                examTitle: examData.title || '',
                                nisn: String(formData.nisn || '').replace(/\D/g, ''),
                                count: usedAttempts,
                                activeSessionId: proposedSessionId,
                                activeSince: new Date().toISOString(),
                                updatedAt: new Date().toISOString()
                            }, { merge: true });
                            return proposedSessionId;
                        });

                        // Acak soal dan opsi. Kunci berbasis teks tetap cocok karena opsi
                        // dan gambar opsinya dipindahkan sebagai satu pasangan.
                        const soalAcak = shuffleArray(examData.questions.map(q => {
                            const opts = Array.isArray(q.options) ? q.options : [];
                            const imgs = Array.isArray(q.optionImages) ? q.optionImages : [];
                            const order = shuffleArray(opts.map((_, i) => i));
                            return {
                                ...q,
                                options: order.map(i => opts[i]),
                                optionImages: order.map(i => imgs[i] ?? null)
                            };
                        }));

                        onStartExam(formData, {
                            ...examData,
                            submissionSessionId: sessionId,
                            questions: soalAcak
                        });
                    } else { 
                        setError("Token soal tidak ditemukan atau ujian belum dimulai."); 
                    }
                } catch (err) { 
                    setError("Gagal memverifikasi token: " + err.message);

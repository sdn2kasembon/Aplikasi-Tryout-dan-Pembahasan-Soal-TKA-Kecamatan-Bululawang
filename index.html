hElements.map(x=><option key={x}>{x}</option>)}</select>:<input readOnly value="Keterampilan Membaca" className="w-full p-3 border rounded-lg bg-gray-50"/>}</div><div><label className="block text-sm font-bold mb-1">Level Kognitif</label><select value={level} onChange={e=>{setLevel(e.target.value);setThinkingProcess(TKA_META.cognitive[e.target.value][0])}} className="w-full p-3 border rounded-lg">{Object.keys(TKA_META.cognitive).map(x=><option key={x}>{x}</option>)}</select></div><div><label className="block text-sm font-bold mb-1">Kompetensi</label><select value={competency} onChange={e=>{setCompetency(e.target.value);const next=subject==='Bahasa Indonesia'?(TKA_META.biSubcompetencies[e.target.value]||[]):(TKA_META.mathSubelements[element]||[]);const nextSub=next[0]||'';setSubSelection(nextSub);setCoverageSelection(subject==='Matematika'?(TKA_META.mathCoverage[nextSub]||[])[0]||'':'')}} className="w-full p-3 border rounded-lg">{(subject==='Matematika'?['Pengetahuan matematika','Representasi matematis','Penalaran','Pemecahan masalah matematis','Koneksi matematis']:TKA_META.biCompetencies).map(x=><option key={x}>{x}</option>)}</select></div><div className="md:col-span-3"><label className="block text-sm font-bold mb-1">{subject==='Bahasa Indonesia'?'Subkompetensi':'Sub-elemen / Submateri'}</label><select value={subSelection} onChange={e=>{const nextSub=e.target.value;setSubSelection(nextSub);setCoverageSelection(subject==='Matematika'?(TKA_META.mathCoverage[nextSub]||[])[0]||'':'')}} className="w-full p-3 border rounded-lg">{availableSubSelections.map(x=><option key={x}>{x}</option>)}{availableSubSelections.length===0&&<option value="">Tidak tersedia</option>}</select><p className="text-xs text-gray-500 mt-1">Pilihan mengikuti kompetensi/elemen yang dipilih dan kerangka TKA SD.</p></div>{subject==='Matematika'&&<div className="md:col-span-3"><label className="block text-sm font-bold mb-1">Pilihan Cakupan Sub-elemen</label><select value={coverageSelection} onChange={e=>setCoverageSelection(e.target.value)} className="w-full p-3 border rounded-lg"><option value="">Semua cakupan pada sub-elemen</option>{availableCoverages.map(x=><option key={x} value={x}>{x}</option>)}</select><p className="text-xs text-gray-500 mt-1">Pilih cakupan sesuai tabel kerangka TKA SD. Cakupan ini menjadi dasar pembuatan dan analisis butir Matematika.</p></div>}<div className="md:col-span-3 border rounded-xl p-4 bg-gray-50"><label className="block text-sm font-bold mb-2">Bentuk Soal dan Jumlah Soal</label><p className="text-xs text-gray-500 mb-3">Pilih jumlah masing-masing bentuk soal. Semua bentuk dapat dibuat sekaligus pada kompetensi yang dipilih.</p><div className="grid md:grid-cols-3 gap-3"><div className="bg-white border rounded-lg p-3"><div className="font-bold text-sm">PG Sederhana</div><div className="text-xs text-gray-500 mb-2">1 jawaban benar</div><input type="number" min="0" max="20" value={questionCounts.single} onChange={e=>setTypeCount('single',e.target.value)} className="w-full p-2 border rounded-lg"/></div><div className="bg-white border rounded-lg p-3"><div className="font-bold text-sm">PGK MCMA</div><div className="text-xs text-gray-500 mb-2">lebih dari satu jawaban benar</div><input type="number" min="0" max="20" value={questionCounts.complex} onChange={e=>setTypeCount('complex',e.target.value)} className="w-full p-2 border rounded-lg"/></div><div className="bg-white border rounded-lg p-3"><div className="font-bold text-sm">PGK Kategori</div><div className="text-xs text-gray-500 mb-2">pernyataan benar/salah</div><input type="number" min="0" max="20" value={questionCounts.statement} onChange={e=>setTypeCount('statement',e.target.value)} className="w-full p-2 border rounded-lg"/></div></div><div className="mt-3 text-sm font-bold text-indigo-700">Total soal: {totalCount} / 20</div></div><div><label className="block text-sm font-bold mb-1">Kesulitan</label><select value={difficulty} onChange={e=>setDifficulty(e.target.value)} className="w-full p-3 border rounded-lg"><option>Mudah</option><option>Sedang</option><option>Sulit</option></select></div><div><label className="block text-sm font-bold mb-1">Jenis</label><select value={itemType} onChange={e=>setItemType(e.target.value)} className="w-full p-3 border rounded-lg"><option>Tunggal</option><option>Grup</option></select></div><div><label className="block text-sm font-bold mb-1">Sumber Generator</label><select value={mode} onChange={e=>setMode(e.target.value)} className="w-full p-3 border rounded-lg"><option value="ai">AI Gemini (API Key Sekolah)</option><option value="local">Lokal / Cadangan</option></select></div><div><label className="block text-sm font-bold mb-1">API Key AI</label><input type={showKey?'text':'password'} value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="API key Gemini sekolah" className="w-full p-3 border rounded-lg"/><label className="text-xs text-gray-500 flex items-center gap-2 mt-1"><input type="checkbox" checked={showKey} onChange={e=>setShowKey(e.target.checked)}/> Tampilkan key</label><p className="text-xs text-orange-700 mt-1">Jangan bagikan file HTML yang berisi key. Key hanya disimpan selama sesi browser.</p></div></div><div><label className="block text-sm font-bold mb-1">Topik atau konteks tambahan (opsional)</label><input value={topic} onChange={e=>setTopic(e.target.value)} placeholder="Contoh: lingkungan sekolah, pecahan, diagram batang" className="w-full p-3 border rounded-lg"/></div>{status&&<div className="p-3 rounded-lg bg-blue-50 border border-blue-200 text-sm text-blue-900">{status}</div>}{preview.length>0&&<div className="space-y-2"><div className="flex justify-between items-center"><h4 className="font-bold">Hasil AI</h4></div>{preview.map(({q,issues,status:reviewStatus},i)=><div key={q.id} className="border rounded-xl p-4"><div className="flex justify-between gap-3"><b>Soal {i+1} — {q.examTitle||'Tanpa judul'}</b><span className={`text-xs px-2 py-1 rounded ${reviewStatus==='LULUS VALIDASI'?'bg-green-100 text-green-800':reviewStatus==='BELUM DITELAAH AI'?'bg-blue-100 text-blue-800':'bg-orange-100 text-orange-800'}`}>{reviewStatus||'PERLU DITELAAH'}</span></div><p className="mt-1 text-xs text-gray-600">{q.subject} • {q.element||'Elemen belum ditentukan'} • {q.competency||q.subcompetency||'Kompetensi belum ditentukan'} • {q.type==='single'?'PG Sederhana':q.type==='complex'?'PGK-MCMA':'PGK Kategori'} • {q.cognitiveLevel||'Level belum ditentukan'}</p><p className="mt-2 text-sm whitespace-pre-wrap">{q.text}</p>{q.image&&<div className="mt-3 rounded-lg border bg-gray-50 p-2"><div className="text-xs font-semibold text-gray-500 mb-2">Gambar dibuat otomatis oleh AI</div><img src={q.image} alt={q.imageAlt||"Gambar pendukung soal"} className="max-w-full max-h-64 mx-auto object-contain" /></div>}{q.imageRequired&&!q.image&&<div className="mt-3 text-xs text-orange-700 bg-orange-50 border border-orange-200 rounded-lg p-2">AI menandai soal ini membutuhkan gambar, tetapi gambar belum berhasil dibuat. Soal dapat diperbaiki di Editor.</div>}{Array.isArray(q.options)&&q.options.length>0&&<ol className="list-decimal ml-6 mt-2 text-sm">{q.options.map((o,j)=><li key={j}>{q.optionImages&&q.optionImages[j]&&<img src={q.optionImages[j]} alt={`Gambar opsi ${j+1}`} className="max-h-20 max-w-full object-contain mb-1"/>}{o}</li>)}</ol>}{Array.isArray(q.statements)&&q.statements.length>0&&<ol className="list-decimal ml-6 mt-2 text-sm">{q.statements.map((st,j)=><li key={j}>{st.text} <span className="text-gray-500">({typeof st.correct==='boolean'?(st.correct?'Benar/Sesuai':'Salah/Tidak sesuai'):'kunci belum ada'})</span></li>)}</ol>}<details className="mt-3 text-sm"><summary className="cursor-pointer font-semibold">Kunci, pembahasan, dan catatan validasi</summary><p className="mt-2"><b>Kunci:</b> {Array.isArray(q.correct)?q.correct.join('; '):q.correct}</p><p className="mt-2"><b>Pembahasan:</b> {q.explanation}</p>{issues.length>0&&<ul className="list-disc ml-5 mt-2 text-orange-700">{issues.map((x,j)=><li key={j}>{x}</li>)}</ul>}</details></div>)}</div>}</div><div className="p-5 border-t bg-gray-50 flex justify-end gap-3 sticky bottom-0"><button onClick={onCancel} className="px-5 py-2 rounded-lg font-bold text-gray-600">Batal</button><button disabled={busy} onClick={generate} className="px-6 py-2 rounded-lg bg-indigo-600 text-white font-bold">{busy?'Memproses...':'Buat Soal'}</button><button disabled={!preview.length||busy} onClick={accept} className="px-6 py-2 rounded-lg bg-green-600 text-white font-bold">Tambahkan ke Editor</button></div></div></div>;
        };


        // ============================================================
        // GENERATOR TRYOUT TKA - mode menyeluruh seluruh komponen mapel
        // ============================================================
        const buildTryoutBlueprint = (subject, totalCount, difficulty='Sedang', counts={single:12,complex:4,statement:4}) => {
            const types=[];
            Object.entries(counts).forEach(([t,n])=>{ for(let i=0;i<n;i++) types.push(t); });
            while(types.length<totalCount) types.push('single');
            types.length=totalCount;
            const cognitiveCycle=['Aplikasi','Aplikasi','Penalaran','Pengetahuan dan Pemahaman','Penalaran'];
            const blueprint=[];
            if(subject==='Matematika'){
                const groups=[
                    {element:'Bilangan',subelement:'Bilangan Rasional',weight:4},
                    {element:'Geometri dan Pengukuran',subelement:'Objek Geometri',weight:4},
                    {element:'Geometri dan Pengukuran',subelement:'Pengukuran',weight:8},
                    {element:'Data',subelement:'Penyajian dan Penggunaan Data',weight:4}
                ];
                const n=Math.max(1,groups.length);
                const alloc=groups.map(g=>Math.max(1,Math.floor(totalCount*g.weight/20)));
                let sum=alloc.reduce((a,b)=>a+b,0);
                while(sum>totalCount){
                    let idx=alloc.findIndex((v,i)=>v>1 && v===Math.max(...alloc));
                    if(idx<0)break; alloc[idx]--; sum--;
                }
                while(sum<totalCount){
                    let idx=groups.map((g,i)=>g.weight/(alloc[i]||1)).indexOf(Math.max(...groups.map((g,i)=>g.weight/(alloc[i]||1))));
                    alloc[idx]++; sum++;
                }
                const slots=[];
                groups.forEach((g,gi)=>{const covers=TKA_META.mathCoverage[g.subelement]||[];for(let i=0;i<alloc[gi];i++)slots.push({element:g.element,subelement:g.subelement,coverage:covers[i%covers.length]||'Semua cakupan pada sub-elemen'});});
                slots.forEach((x,i)=>blueprint.push({...x,competency:['Pengetahuan matematika','Representasi matematis','Penalaran','Pemecahan masalah matematis','Koneksi matematis'][i%5],cognitiveLevel:cognitiveCycle[i%cognitiveCycle.length],thinkingProcess:TKA_META.cognitive[cognitiveCycle[i%cognitiveCycle.length]][i%TKA_META.cognitive[cognitiveCycle[i%cognitiveCycle.length]].length],type:types[i],difficulty,variationDNA:buildTryoutVariationDNA(subject,i,{type:types[i],element:x.element,subelement:x.subelement,coverage:x.coverage,cognitiveLevel:cognitiveCycle[i%cognitiveCycle.length]})}));
            } else {
                const comps=TKA_META.biCompetencies;
                const base=Math.floor(totalCount/comps.length), rem=totalCount%comps.length;
                comps.forEach((comp,ci)=>{const subs=TKA_META.biSubcompetencies[comp]||[];const n=base+(ci<rem?1:0);for(let i=0;i<n;i++){const idx=blueprint.length;blueprint.push({element:'Keterampilan Membaca',subelement:'',competency:comp,subcompetency:subs[i%Math.max(1,subs.length)]||'',cognitiveLevel:cognitiveCycle[idx%cognitiveCycle.length],thinkingProcess:TKA_META.cognitive[cognitiveCycle[idx%cognitiveCycle.length]][idx%TKA_META.cognitive[cognitiveCycle[idx%cognitiveCycle.length]].length],type:types[idx],difficulty,variationDNA:buildTryoutVariationDNA(subject,idx,{type:types[idx],competency:comp,subcompetency:subs[i%Math.max(1,subs.length)],cognitiveLevel:cognitiveCycle[idx%cognitiveCycle.length]})});}});
            }
            return blueprint.slice(0,totalCount);
        };

        // ============================================================
        // CONSTRUCTION DNA: setiap nomor mendapat arsitektur soal yang
        // berbeda SEBELUM AI menulis soal. Tujuannya mencegah AI hanya
        // mengganti nama/angka tetapi mempertahankan cetakan yang sama.
        // ============================================================
        const TRYOUT_VARIATION_DNA = {
            contextMath: [
                'situasi pembagian bekal dalam kegiatan sekolah',
                'perencanaan perjalanan dan waktu',
                'pengelolaan uang dan harga barang',
                'pengukuran bahan untuk membuat sesuatu',
                'jadwal kegiatan beberapa kelompok',
                'pengamatan perubahan jumlah benda',
                'penataan ruang atau benda di rumah',
                'kegiatan olahraga dan jarak',
                'pengolahan hasil panen atau makanan',
                'data kegiatan warga atau lingkungan'
            ],
            contextBI: [
                'lingkungan sekolah dan kebiasaan murid',
                'keluarga dan kegiatan sehari-hari',
                'lingkungan alam setempat',
                'teknologi sederhana dalam kehidupan anak',
                'budaya atau tradisi lokal',
                'hewan dan tumbuhan di sekitar',
                'kegiatan masyarakat',
                'pengalaman perjalanan atau kunjungan',
                'kesehatan dan kebiasaan baik',
                'sains sederhana yang dekat dengan anak'
            ],
            mathStimulus: ['situasi rumah tangga dengan ilustrasi benda/ukuran','tabel kecil dari kegiatan nyata','diagram batang data lingkungan','piktogram hasil pengumpulan benda','daftar belanja dan perbandingan harga','denah/visual spasial tempat nyata','jadwal perjalanan atau kegiatan','perbandingan beberapa pilihan sehari-hari','perubahan bertahap dalam kegiatan nyata','representasi simbolik dari konteks nyata'],
            biStimulus: ['teks informasi eksplanatif','teks informasi prosedural','teks informasi deskriptif','teks fiksi naratif','dialog singkat dalam teks','infografis/data sederhana','pengumuman atau pesan','artikel populer anak','cerita pengalaman','teks dengan konflik dan penyelesaian'],
            questionMath: ['menentukan hasil akhir','membandingkan dua strategi','menentukan informasi yang hilang','memilih pernyataan yang pasti benar','menentukan perubahan jika kondisi diubah','menilai apakah solusi masuk akal','menentukan kemungkinan berdasarkan data','menghubungkan dua representasi','menemukan kesalahan dalam penyelesaian','menentukan cara paling efisien'],
            questionBI: ['mengidentifikasi informasi tersurat','menyimpulkan gagasan tersirat','menentukan hubungan sebab-akibat','menafsirkan makna kata/ungkapan','menilai alasan atau bukti','menentukan tujuan penulis','menilai relevansi informasi','membandingkan informasi antarbagian teks','menentukan perubahan tindakan tokoh','menilai pesan atau penerapan dalam kehidupan'],
            reasoning: ['penerapan langsung dalam konteks baru','inferensi dari beberapa informasi','perbandingan dan evaluasi','prediksi akibat perubahan kondisi','evaluasi strategi/solusi','koneksi dua informasi berbeda','pemilihan berdasarkan bukti','analisis hubungan sebab-akibat','pemeriksaan konsistensi','pemecahan masalah multi-langkah'],
            representation: ['teks','angka/simbol','tabel','diagram','piktogram','denah','jadwal','daftar terstruktur','kombinasi teks dan data','visual spasial'],
            data: ['bilangan bulat kecil','pecahan','desimal','persentase','satuan ukuran','rasio/perbandingan','data frekuensi','urutan waktu','jarak/ukuran','kombinasi dua jenis data'],
            option: ['pengecoh akibat salah operasi','pengecoh akibat salah membaca data','pengecoh akibat salah memilih informasi','pengecoh dengan hasil antara','pengecoh akibat salah satuan','pengecoh akibat asumsi keliru','pengecoh yang tampak masuk akal tetapi bertentangan stimulus','pengecoh dari strategi alternatif','pengecoh akibat membalik hubungan','pengecoh akibat generalisasi berlebihan']
        };

        const buildTryoutVariationDNA = (subject, index, blueprintItem) => {
            const D=TRYOUT_VARIATION_DNA;
            const arr=(subject==='Matematika') ? {
                context:D.contextMath, stimulus:D.mathStimulus, question:D.questionMath
            } : {context:D.contextBI, stimulus:D.biStimulus, question:D.questionBI};
            const pick=(a,offset=0)=>a[(index*3+offset)%a.length];
            const type=blueprintItem?.type;
            return {
                context:pick(arr.context,0),
                stimulus:pick(arr.stimulus,1),
                questionPattern:pick(arr.question,2),
                reasoning:pick(D.reasoning,3),
                representation:pick(D.representation,4),
                openingPattern:[
                    'mulai dari situasi konkret tanpa frasa template',
                    'mulai dari data/hasil pengamatan lalu beri tugas',
                    'mulai dari permasalahan tokoh lalu minta keputusan',
                    'mulai dari perbandingan dua kondisi',
                    'mulai dari informasi yang perlu ditafsirkan',
                    'mulai dari perubahan kondisi lalu tanyakan akibatnya',
                    'mulai dari kesalahan/solusi yang perlu dinilai'
                ][index%7],
                dataPattern:pick(D.data,5),
                operationPattern: subject==='Matematika' ? pick([
                    'satu operasi utama dengan interpretasi konteks',
                    'dua operasi berurutan',
                    'perbandingan/relasi tanpa hitung panjang',
                    'estimasi atau pemeriksaan kewajaran',
                    'konversi satuan lalu pemecahan masalah',
                    'membaca representasi data sebelum menghitung',
                    'menilai strategi penyelesaian'
                ],index+1) : 'tidak menggunakan pola operasi matematika',
                optionPattern:pick(D.option,6),
                cognitiveDemand:blueprintItem?.cognitiveLevel||'Aplikasi',
                keyPattern:['A','B','C','D','A','C','B','D'][index%8],
                avoidPatterns:[
                    'jangan memakai konteks sekolah jika sudah dominan pada dua nomor sebelumnya',
                    'jangan membuka pertanyaan dengan frasa yang sama seperti nomor lain',
                    'jangan membuat jawaban cukup ditemukan dengan menyalin satu kalimat stimulus',
                    'jangan hanya mengganti nama, angka, satuan, atau benda dari soal lain'
                ],
                itemType:type,
                dnaVersion:'3.0'
            };
        };

        // Memilih satu kandidat terbaik untuk setiap baris blueprint.
        // AI diminta membuat 2 kandidat/baris dalam SATU request agar tombol
        // "Buat Tryout" mempunyai cadangan internal tanpa retry API.
        const selectBestTryoutCandidates = (candidates, blueprint, subject) => {
            if(!Array.isArray(candidates) || !candidates.length) return [];
            const buckets=blueprint.map((_,i)=>[]);
            candidates.forEach((q,i)=>{
                const rawIndex=Number.isFinite(Number(q?.blueprintIndex)) ? Number(q.blueprintIndex) : Math.floor(i/2);
                const idx=Math.max(0,Math.min(blueprint.length-1,rawIndex));
                buckets[idx].push({...q,__candidateOrder:i});
            });
            const selected=[];
            blueprint.forEach((b,bi)=>{
                const pool=buckets[bi].length ? buckets[bi] : [candidates[bi]].filter(Boolean);
                const scored=pool.map(q=>{
                    const merged={...q,...b,variationDNA:b.variationDNA||q.variationDNA,
                        subelement:b.subelement||q.subelement||'',
                        subcompetency:b.subcompetency||q.subcompetency||'',
                        cakupanSubelemen:b.coverage||q.cakupanSubelemen||q.coverage||'',
                        coverage:b.coverage||q.coverage||q.cakupanSubelemen||''};
                    const repaired=repairQuestionForValidation(normalizeAIQuestion(merged,bi));
                    const issues=validateAIQuestion(repaired);
                    let maxSimilarity=0;
                    selected.forEach(prev=>{maxSimilarity=Math.max(maxSimilarity,scorePairDiversity(prev,repaired).score);});
                    return {q:repaired,issues,maxSimilarity};
                }).sort((a,z)=>{
                    const aBad=a.issues.length?1:0, zBad=z.issues.length?1:0;
                    if(aBad!==zBad) return aBad-zBad;
                    return a.maxSimilarity-z.maxSimilarity;
                });
                const best=scored[0];
                if(best){
                    selected.push(best.q);
                }
            });
            return selected;
        };

        const friendlyAiError = (e, context='AI') => {
            const msg = String(e?.message || e || '');
            const lower = msg.toLowerCase();
            const waitMatch = msg.match(/(?:retry in|try again in)\s*([0-9]+(?:\.[0-9]+)?)s/i);
            const waitSec = waitMatch ? Math.ceil(Number(waitMatch[1])) : null;
            if (lower.includes('quota exceeded') || lower.includes('free_tier_requests') || lower.includes('rate limit') || lower.includes('too many requests') || /\b429\b/.test(lower)) {
                return waitSec
                    ? `⚠️ ${context} belum dapat diproses karena batas permintaan Gemini sedang tercapai. Silakan tunggu sekitar ${waitSec} detik, lalu coba proses kembali.`
                    : `⚠️ ${context} belum dapat diproses karena batas permintaan Gemini sedang tercapai. Silakan tunggu beberapa saat, lalu coba proses kembali.`;
            }
            if (lower.includes('high demand') || lower.includes('spikes in demand') || lower.includes('currently experiencing high demand')) {
                return `⚠️ Semua model Gemini yang tersedia untuk generator sedang sibuk atau tidak merespons. Silakan coba proses kembali beberapa saat lagi.`;
            }
            if (lower.includes('503') || lower.includes('service unavailable') || lower.includes('temporarily unavailable')) {
                return `⚠️ Layanan Gemini sementara tidak tersedia. Silakan tunggu beberapa saat kemudian dan coba proses kembali.`;
            }
            if (lower.includes('502') || lower.includes('500')) {
                return `⚠️ Layanan Gemini mengalami gangguan sementara. Silakan coba proses kembali.`;
            }
            return `⚠️ ${context} belum berhasil. ${msg || 'Terjadi gangguan sementara pada layanan AI.'} Silakan coba lagi.`;
        };

        const TryoutGenerator = ({ onGenerate, onCancel }) => {
            const [subject,setSubject]=useState('Matematika');
            const [totalCount,setTotalCount]=useState(20);
            const [questionCounts,setQuestionCounts]=useState({single:12,complex:4,statement:4});
            const [difficulty,setDifficulty]=useState('Sedang');
            const [mode,setMode]=useState('ai');
            const [apiKey,setApiKey]=useState(getTkaAiKey());
            const [showKey,setShowKey]=useState(false);
            const [topic,setTopic]=useState('');
            const [busy,setBusy]=useState(false);
            const [status,setStatus]=useState('');
            const [preview,setPreview]=useState([]);
            const blueprint=buildTryoutBlueprint(subject,totalCount,difficulty,questionCounts);
            const typeLabel={single:'PG Sederhana',complex:'PGK MCMA',statement:'PGK Kategori'};
            const totalTypes=Object.values(questionCounts).reduce((a,b)=>a+b,0);
            const setCount=(k,v)=>setQuestionCounts(prev=>({...prev,[k]:Math.max(0,Math.min(30,Number(v)||0))}));
            const generate=async()=>{
                if(totalCount<5||totalCount>30){alert('Jumlah tryout harus 5–30 soal.');return;}
                if(totalTypes!==totalCount){alert(`Jumlah bentuk soal (${totalTypes}) harus sama dengan total tryout (${totalCount}).`);return;}
                setBusy(true);setStatus('Menyusun blueprint tryout menyeluruh...');
                const payload={mode:'TRYOUT TKA SD',subject,totalCount,difficulty,topic,questionDistribution:questionCounts,blueprint};
                try{
                    let raw=[];
                    if(mode==='local'){
                        blueprint.forEach((b,i)=>{
                            if(subject==='Matematika') raw.push({...buildMathItem(b.cognitiveLevel,b.type,b.element,difficulty,topic),subject:'Matematika',element:b.element,subelement:b.subelement,competency:b.competency,cognitiveLevel:b.cognitiveLevel,thinkingProcess:b.thinkingProcess,cakupanSubelemen:b.coverage,coverage:b.coverage});
                            else { const q=buildBIItems(b.cognitiveLevel,b.type,false,null,null,difficulty,topic); raw.push({...q,subject:'Bahasa Indonesia',element:'Keterampilan Membaca',subelement:'',competency:b.competency,subcompetency:b.subcompetency,cognitiveLevel:b.cognitiveLevel,thinkingProcess:b.thinkingProcess}); }
                        });
                    } else {
                        if(!apiKey.trim()) throw new Error('Masukkan API key AI terlebih dahulu.');
                        setTkaAiKey(apiKey.trim());
                        const prompt=`Anda adalah pengembang asesmen TKA SD/MI yang sangat berpengalaman. Buat TEPAT ${totalCount} SOAL FINAL, satu soal untuk setiap baris blueprint. ${TKA_SD_AI_INSTRUCTIONS}

BLUEPRINT WAJIB: ${JSON.stringify(payload)}
Jangan mengubah jumlah atau urutan blueprint. Setiap objek wajib memiliki blueprintIndex 0-based sesuai baris blueprint.

ATURAN KONSTRUKSI VARIATIF — INI WAJIB, BUKAN SEKADAR SARAN:
1. Setiap baris blueprint memiliki variationDNA. Anggap variationDNA sebagai KONTRAK KONSTRUKSI. Jangan mengubahnya hanya agar soal lebih mudah dibuat.
2. Dua soal tidak boleh memiliki kombinasi context + stimulus + questionPattern + reasoning yang sama.
3. Dilarang membuat template kalimat yang sama lalu hanya mengganti angka, nama, benda, atau lokasi.
4. Jika dua soal masih terasa sama setelah angka/nama/benda dihapus, berarti soal tersebut GAGAL dan harus ditulis ulang.
5. Variasikan secara nyata minimal 4 dari: konteks, jenis stimulus, pola pertanyaan, proses penalaran, representasi, pola data, strategi/operasi, tipe pengecoh, pola pembuka, dan bentuk keputusan.

-gray-500 mt-1">Kedua pilihan ini akan ditampilkan berdampingan pada setiap pernyataan. Pilih salah satunya sebagai kunci untuk masing-masing pernyataan.</p></div>}</div><div className="mb-6"><div className="flex justify-between items-end mb-2"><label className="block text-sm font-bold text-gray-700 flex items-center gap-2"><Clipboard size={16} className="text-blue-600"/> Daftar Pernyataan (Paste Sekaligus)</label><span className="text-xs text-blue-600 bg-blue-100 px-2 py-1 rounded">Reset daftar pernyataan</span></div><textarea onChange={handleStatementBulkPaste} className="w-full p-3 border border-gray-300 rounded-lg text-sm font-mono text-gray-600 focus:ring-2 focus:ring-blue-500 outline-none h-20" placeholder={`Paste pernyataan di sini...\nContoh:\nMatahari terbit dari timur\nAir mendidih pada 100 derajat`}/></div><label className="block text-sm font-bold text-gray-700 mb-3">Daftar Pernyataan & Kunci Jawaban</label><div className="space-y-3">{statements.map((stmt, idx) => (<div key={stmt.id} className="flex flex-col gap-2 p-3 bg-white border rounded-lg"><div className="flex flex-col md:flex-row md:items-center gap-2"><span className="text-sm font-mono text-gray-400 w-6 text-center">{idx+1}.</span><input type="text" value={stmt.text} onChange={(e) => handleStatementChange(stmt.id, 'text', e.target.value)} className="flex-1 p-2 border rounded focus:border-blue-500 outline-none" placeholder="Teks pernyataan..."/><input type="file" accept="image/*" className="hidden" id={`statement-image-${stmt.id}`} onChange={(e) => handleStatementImageUpload(stmt.id, e)}/><button type="button" onClick={() => document.getElementById(`statement-image-${stmt.id}`)?.click()} className={`inline-flex items-center gap-1 px-3 py-2 rounded text-xs font-semibold ${stmt.image ? 'text-blue-700 bg-blue-50' : 'text-gray-600 bg-gray-100 hover:bg-gray-200'}`} title="Tambahkan gambar pada pernyataan"><ImageIcon size={16}/>{stmt.image ? 'Ganti Gambar' : 'Tambah Gambar'}</button><div className="flex flex-wrap gap-2">{statementMode === 'custom' ? <select value={String(stmt.correct ?? '')} onChange={e => handleStatementChange(stmt.id, 'correct', e.target.value)} className="p-2 border rounded text-sm min-w-[150px]"><option value="">Pilih kunci kategori</option>{categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}</select> : <><label className="flex items-center gap-1 text-sm cursor-pointer"><input type="radio" name={`st-${stmt.id}`} checked={stmt.correct === true} onChange={() => handleStatementChange(stmt.id, 'correct', true)}/>{labelTrue}</label><label className="flex items-center gap-1 text-sm cursor-pointer"><input type="radio" name={`st-${stmt.id}`} checked={stmt.correct === false} onChange={() => handleStatementChange(stmt.id, 'correct', false)}/>{labelFalse}</label></>}</div><button onClick={() => removeStatement(stmt.id)} className="text-gray-400 hover:text-red-500"><Trash2 size={16}/></button></div>{stmt.image && <div className="ml-8 flex items-start gap-3 p-2 bg-blue-50 border border-blue-100 rounded-lg"><img src={stmt.image} alt={`Gambar pernyataan ${idx+1}`} className="max-w-full max-h-36 object-contain rounded bg-white border"/><button type="button" onClick={() => removeStatementImage(stmt.id)} className="text-xs text-red-600 hover:underline">Hapus gambar</button></div>}</div>))}<button onClick={addStatement} className="text-sm text-blue-600 font-bold hover:underline flex items-center gap-1 mt-2"><Plus size={16}/> Tambah Pernyataan</button></div></div>)}
                        </div>
                        <div className="px-6 pb-6">
                            <div className="rounded-xl border border-emerald-200 bg-emerald-50 p-4 space-y-2">

                    </div>

        };
        
        // --- AUTH PAGE (UPDATED) ---
        const AuthPage = ({ initialMode = 'login', user, onContinue, onLogout }) => {
            const [isRegistering, setIsRegistering] = useState(initialMode === 'register');
            const [email, setEmail] = useState('');
            const [schoolCode, setSchoolCode] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            useEffect(() => setError(''), [isRegistering]);

            if (user && !user.isAnonymous) {
                return (
                    <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm text-center fade-in">

                                <User size={40}/>

                            <h2 className="text-xl font-bold mb-2 text-gray-800">Sesi Guru Aktif</h2>

                            </p>
                            <div className="space-y-3">
                                <button onClick={onContinue} className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg flex items-center justify-center gap-2"><School size={18}/> Lanjut ke Dashboard</button>
                                <button onClick={onLogout} className="w-full bg-white border border-gray-300 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-50 transition flex items-center justify-center gap-2"><LogOut size={18}/> Ganti Akun / Keluar</button>
                            </div>
                        </div>
                    </div>
                )
            }

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!schoolCode.trim()) { setError('Kode sekolah wajib diisi.'); return; }
                setLoading(true);
                setError('');
                try {
                    if (isRegistering) {
                        await createUserWithEmailAndPassword(auth, email, password);
                        try { sessionStorage.setItem('tka_school_code_' + email.trim().toLowerCase(), schoolCode.trim().toUpperCase()); } catch(e) {}
                    } else {
                        await signInWithEmailAndPassword(auth, email, password);
                        try { sessionStorage.setItem('tka_school_code_' + email.trim().toLowerCase(), schoolCode.trim().toUpperCase()); } catch(e) {}
                    }
                    onContinue(); // AUTO REDIRECT SAAT LOGIN BERHASIL
                } catch (error) {
                    let msg = error.message;
                    if (msg.includes("auth/invalid-email")) msg = "Format email salah.";
                    if (msg.includes("auth/user-not-found") || msg.includes("auth/invalid-credential")) msg = "Email atau password salah.";
                    if (msg.includes("auth/wrong-password")) msg = "Password salah.";
                    if (msg.includes("auth/email-already-in-use")) msg = "Email sudah terdaftar. Silakan login.";
                    if (msg.includes("auth/weak-password")) msg = "Password terlalu lemah (min 6 karakter).";
                    setError(msg);
                    setLoading(false); // Stop loading hanya jika error
                }
            };

            return (
                <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
                    <div className="bg-white rounded-xl shadow-lg w-full max-w-sm fade-in overflow-hidden">
                        <div className="flex border-b">
                            <button onClick={() => setIsRegistering(false)} className={`flex-1 py-4 text-sm font-bold text-center transition ${!isRegistering ? 'bg-white text-blue-600 border-b-2 border-blue-600' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'}`}>MASUK</button>
                            <button onClick={() => setIsRegistering(true)} className={`flex-1 py-4 text-sm font-bold text-center transition ${isRegistering ? 'bg-white text-blue-600 border-b-2 border-blue-600' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'}`}>DAFTAR</button>
                        </div>
                        <div className="p-8">
                            <div className="text-center mb-6">
                                <div className="inline-block p-3 bg-blue-100 rounded-full mb-3 text-blue-600"><School size={32} /></div>
                                <h2 className="text-2xl font-bold text-gray-800">{isRegistering ? 'Buat Akun Baru' : 'Selamat Datang'}</h2>
                                <p className="text-sm text-gray-500 mt-1">{isRegistering ? 'Isi data untuk mendaftar sebagai guru' : 'Masuk untuk mengelola ujian'}</p>
                            </div>
                            {error && (<div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-lg flex items-start gap-2"><AlertTriangle size={14} className="mt-0.5 shrink-0"/><span>{error}</span></div>)}
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div><label className="block text-xs font-bold text-gray-700 mb-1">EMAIL</label><div className="relative"><div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400"><User size={16}/></div><input type="email" required className="w-full pl-10 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" value={email} onChange={e => setEmail(e.target.value)} placeholder="nama@sekolah.com" /></div></div>
                                <div><label className="block text-xs font-bold text-gray-700 mb-1">KODE SEKOLAH</label><input type="text" required className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none uppercase" value={schoolCode} onChange={e => setSchoolCode(e.target.value.toUpperCase())} placeholder="Contoh: SDN2KSB" /></div><div><label className="block text-xs font-bold text-gray-700 mb-1">PASSWORD</label><div className="relative"><div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400"><Icon name="key" size={16}/></div><input type="password" required className="w-full pl-10 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••" /></div></div>
                                <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition flex items-center justify-center gap-2 mt-6">{loading ? <Loader2 className="animate-spin" size={18}/> : (isRegistering ? <UserPlus size={18}/> : <LogIn size={18}/>)} {loading ? "Memproses..." : (isRegistering ? 'Daftar Sekarang' : 'Masuk Dashboard')}</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const TeacherDashboard = ({ onLogout, user }) => {
            const [dashboardView, setDashboardView] = useState('editor'); 
            const [editorSubjectFilter, setEditorSubjectFilter] = useState('Semua');
            const [editorTitleFilter, setEditorTitleFilter] = useState('Semua Judul');
            const [currentExamId, setCurrentExamId] = useState(null);
            const [savingToBank, setSavingToBank] = useState(false);
            const [savingBankMessage, setSavingBankMessage] = useState(''); 
            const [examTitle, setExamTitle] = useState('');
            const [examDuration, setExamDuration] = useState(60);
            const [questions, setQuestions] = useState([]); 
            const [isEditorOpen, setIsEditorOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [showCloseConfirm, setShowCloseConfirm] = useState(false);
            const [editorValidation, setEditorValidation] = useState({});
            const [showValidationSummary, setShowValidationSummary] = useState(false);
            const [repairingQuestionId, setRepairingQuestionId] = useState(null);
            const [repairingAll, setRepairingAll] = useState(false);
            const [validatingAll, setValidatingAll] = useState(false);
            const [validationProgress, setValidationProgress] = useState({ current: 0, total: 0 });
            const [repairProgress, setRepairProgress] = useState({ current: 0, total: 0 });
            const [editorApiKey, setEditorApiKey] = useState(() => getTkaAiKey());
            const [showEditorApiKey, setShowEditorApiKey] = useState(false);

            const [savedExams, setSavedExams] = useState([]);
            const [activeExam, setActiveExam] = useState(null);
            const [activeExams, setActiveExams] = useState([]);
            const bankCacheKey = user ? `tka_bank_cache_${appId}_${user.uid}` : '';
            const readBankCache = () => {
                if (!bankCacheKey) return [];
                try {
                    const raw = localStorage.getItem(bankCacheKey);
                    const data = raw ? JSON.parse(raw) : [];
                    return Array.isArray(data) ? data : [];
                } catch (e) { return []; }
            };
            const writeBankCache = (items) => {
                if (!bankCacheKey) return;
                try { localStorage.setItem(bankCacheKey, JSON.stringify(items || [])); } catch (e) { console.warn('Bank cache tidak dapat disimpan:', e); }
            };
            const mergeBankCache = (cloudItems) => {
                const cloud = Array.isArray(cloudItems) ? cloudItems : [];
                // Pertahankan paket localOnly yang belum berhasil diunggah.
                // Data cloud menjadi sumber utama untuk ID yang sama.
                const cloudIds = new Set(cloud.map(item => String(item.id)));
                const pendingLocal = readBankCache().filter(item => item?.localOnly && !cloudIds.has(String(item.id)));
                const merged = [...cloud, ...pendingLocal];
                writeBankCache(merged);
                setSavedExams(merged);
            };
            const [results, setResults] = useState([]);
            const [isGeneratorOpen, setIsGeneratorOpen] = useState(false);
            const [isTryoutGeneratorOpen, setIsTryoutGeneratorOpen] = useState(false);

            useEffect(() => {
                if (!user) return;
                
                // 1. Pulihkan Bank Soal dari cache lokal terlebih dahulu, kemudian sinkronkan dengan Firestore.
                // Ini mencegah daftar Bank Soal tampak kosong saat Firestore terlambat/sempat gagal dibaca.
                const cachedBank = readBankCache();
                if (cachedBank.length) setSavedExams(cachedBank);

                const qExams = query(collection(db, 'artifacts', appId, 'users', user.uid, 'exams'));
                const unsubExams = onSnapshot(qExams, (snapshot) => {
                    const cloudItems = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
                    mergeBankCache(cloudItems);
                }, (e) => {
                    console.error("Exams Fetch Error:", e);
                    // Jangan mengosongkan state ketika Firestore gagal membaca. Pertahankan cache yang sudah ada.
                    const fallback = readBankCache();
                    if (fallback.length) setSavedExams(fallback);
                });
                
                // 2. Ambil SEMUA ujian aktif milik guru yang sedang login.
                // Status publikasi tidak lagi dibatasi hanya pada satu token di localStorage.
                const activeExamsRef = collection(db, 'artifacts', appId, 'public', 'data', 'active_exams');
                const unsubActive = onSnapshot(activeExamsRef, (snapshot) => {
                    const mine = snapshot.docs
                        .map(snap => ({ id: snap.id, ...snap.data() }))
                        .filter(exam => exam.teacherId === user.uid && exam.status === 'active')
                        .sort((a, b) => String(b.publishedAt || '').localeCompare(String(a.publishedAt || '')));
                    setActiveExams(mine);
                    setActiveExam(prev => prev && mine.some(item => item.token === prev.token) ? prev : (mine[0] || null));
                }, (e) => {
                    console.error('Active Exams Fetch Error:', e);
                    setActiveExams([]);
                    setActiveExam(null);
                });

                return () => { unsubExams(); unsubActive(); };
            }, [user]);

            // 3. Fetch Results (Optimized: Only when an exam is ACTIVE and view is RESULTS)
           useEffect(() => {
                if (!user) {
                    setResults([]);
                    return;
                }

               const qResults = query(collection(db, 'artifacts', appId, 'public', 'data', 'exam_results'));

                const unsubResults = onSnapshot(qResults, (snapshot) => {
                    const allResults = snapshot.docs
                        .map(doc => ({ id: doc.id, ...doc.data() }))
                        .filter(item => item._systemType !== 'attempt-limit');

                    // ✅ FILTER berdasarkan guru (bukan ujian aktif)
                    const myResults = allResults.filter(r => r.teacherId === user.uid);

                    setResults(myResults);
                }, (e) => console.log("Results Fetch Error:", e));

                return () => unsubResults();
            }, [user]);

            const getQuestionValidation = (items) => items.flatMap((q, i) => validateTKAQuestion(q).map(msg => `Soal ${i+1}: ${msg}`));

            const handleDeleteResults = async (examResults, examTitle = "Tanpa Nama Ujian") => {
                const group = Array.isArray(examResults) ? examResults : [];
                if (!group.length) {
                    alert(`Belum ada Rekap Nilai untuk ujian "${examTitle}" yang dapat dihapus.`);
                    return;
                }
                const confirmed = window.confirm(
                    `Hapus Rekap Nilai hanya untuk ujian "${examTitle}"?\n\nJumlah data: ${group.length} siswa.\n\nData ujian lain tidak akan ikut terhapus.\nData yang dihapus tidak dapat dipulihkan.`
                );
                if (!confirmed) return;
                try {
                    await Promise.all(group.map((item) => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'exam_results', item.id))));
                    setResults(prev => prev.filter(item => !group.some(g => g.id === item.id)));
                    alert(`Rekap Nilai untuk ujian "${examTitle}" berhasil dihapus.`);
                } catch (e) {
                    console.error("Delete Results Error:", e);
                    alert("Gagal menghapus Rekap Nilai: " + e.message);
                }
            };
            const handleSaveToBank = async () => {
                if (savingToBank) return;
                setSavingToBank(true);
                setSavingBankMessage('Memeriksa soal...');
                try {
                    if (!auth.currentUser || auth.currentUser.uid !== user?.uid) {
                        throw new Error('Sesi login guru belum aktif. Silakan keluar lalu masuk kembali.');
                    }
                    if (!String(examTitle || '').trim()) throw new Error('Judul ujian tidak boleh kosong.');
                    if (!Array.isArray(questions) || questions.length === 0) throw new Error('Belum ada soal yang dapat disimpan.');

                    const validation = getQuestionValidation(questions);
                    if (validation.length) {
                        alert('Bank Soal belum memenuhi kontrol TKA:\n\n' + validation.slice(0, 12).join('\n'));
                        return;
                    }

                    setSavingBankMessage('Menyiapkan data soal...');
                    const editorExamData = {
                        title: String(examTitle).trim(),
                        duration: Number(examDuration) || 60,
                        questions: JSON.parse(JSON.stringify(questions)),
                        lastModified: new Date().toLocaleString('id-ID'),
                        author: user.email || ''
                    };
                    const storageScope = currentExamId && !String(currentExamId).startsWith('local-')
                        ? currentExamId : `bank-${Date.now()}`;

                    setSavingBankMessage('Mengompresi gambar di perangkat...');
                    const cloudExamData = await externalizeExamImages(
                        editorExamData, user.uid, storageScope,
                        ({ completed, total }) => setSavingBankMessage(
                            total ? `Mengompresi gambar ${completed}/${total}...` : 'Menyiapkan gambar...'
                        )
                    );

                    setSavingBankMessage('Menyimpan data ke Firestore...');
                    const estimatedBytes = estimateFirestoreBytes(cloudExamData);
                    if (estimatedBytes > FIRESTORE_SAFE_DOCUMENT_BYTES) {
                        throw new Error(`Paket masih sekitar ${Math.ceil(estimatedBytes / 1024)} KB setelah kompresi. Batas aman aplikasi adalah 950 KiB agar tetap ada ruang untuk overhead dokumen Firestore (batas keras 1 MiB). Kurangi ukuran gambar atau pecah paket jika masih melebihi 950 KiB; data Editor tetap dipertahankan.`);
                    }

                    let savedItem;
                    const firestoreWrite = currentExamId && !String(currentExamId).startsWith('local-')
                        ? setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'exams', currentExamId), cloudExamData, { merge: true })
                        : addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'exams'), cloudExamData);
                    const writeResult = await Promise.race([
                        firestoreWrite,
                        new Promise((_, reject) => setTimeout(
                            () => reject(new Error('Penyimpanan ke Firestore belum mendapat respons setelah 45 detik. Periksa koneksi internet dan Firestore Rules. Data editor tetap dipertahankan; jangan klik simpan berulang kali dulu.')),
                            45000
                        ))
                    ]);
                    if (currentExamId && !String(currentExamId).startsWith('local-')) {
                        savedItem = { id: currentExamId, ...editorExamData };
                    } else {
                        setCurrentExamId(writeResult.id);
                        savedItem = { id: writeResult.id, ...editorExamData };
                    }

                    setSavingBankMessage('Memperbarui daftar Bank Soal...');
                    const existing = readBankCache().filter(x => String(x.id) !== String(savedItem.id));
                    const updatedBank = [...existing, savedItem];

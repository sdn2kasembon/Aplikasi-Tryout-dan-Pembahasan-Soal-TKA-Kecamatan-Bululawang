        // Firestore menolak nilai undefined, termasuk pada objek/array bertingkat.
        // Sanitasi rekursif menjaga struktur data dan mengganti elemen array kosong dengan null.
        const sanitizeFirestoreData = (value) => {
            if (value === undefined || typeof value === 'function' || typeof value === 'symbol') return undefined;
            if (value === null || typeof value === 'string' || typeof value === 'boolean') return value;
            if (typeof value === 'number') return Number.isFinite(value) ? value : null;
            if (Array.isArray(value)) {
                return value.map(item => {
                    const cleaned = sanitizeFirestoreData(item);
                    return cleaned === undefined ? null : cleaned;
                });
            }
            if (value instanceof Date) return value;
            if (typeof value === 'object') {
                const cleaned = {};
                Object.entries(value).forEach(([key, item]) => {
                    const safe = sanitizeFirestoreData(item);
                    if (safe !== undefined) cleaned[key] = safe;
                });
                return cleaned;
            }
            return value;
        };

        // Batas dokumen Firestore sekitar 1 MiB. Sisakan ruang aman untuk metadata.
        const estimateFirestoreBytes = (value) => {
            try {
                const json = JSON.stringify(sanitizeFirestoreData(value));
                return new TextEncoder().encode(json).length;
            } catch (e) {
                return Number.POSITIVE_INFINITY;
            }
        };
        // Batas internal 950 KiB (di bawah batas keras Firestore 1 MiB), memberi ruang untuk overhead dokumen.
        const FIRESTORE_SAFE_DOCUMENT_BYTES = 950 * 1024;

        // ID stabil untuk membatasi percobaan lintas-token pada ujian yang sama.
        const makeAttemptLimitId = (teacherId, examTitle, nisn) => {
            const raw = `${String(teacherId || '').trim()}|${String(examTitle || '').trim().toLocaleLowerCase('id-ID')}|${String(nisn || '').replace(/\\D/g, '')}`;
            let hash = 2166136261;
            for (let i = 0; i < raw.length; i++) {
                hash ^= raw.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            return `_limit_${(hash >>> 0).toString(16)}`;
        };
        const MAX_EXAM_SUBMISSIONS_PER_STUDENT = 2;


        // Unggah gambar data-URL ke kompresi gambar lokal; dokumen Firestore hanya menyimpan URL.
        // Paket ini mempertahankan paket Firebase saat ini: tidak memakai kompresi gambar lokal.
        // Gambar data-URL dikompresi di browser sebelum disimpan sebagai bagian dokumen Firestore.
        const externalizeExamImages = async (value, ownerUid, scopeKey, onProgress = () => {}) => {
            const imageMap = new Map();
            const collect = (node) => {
                if (typeof node === 'string') {
                    if (/^data:image\//i.test(node) && !imageMap.has(node)) imageMap.set(node, true);
                    return;
                }
                if (Array.isArray(node)) { node.forEach(collect); return; }
                if (node && typeof node === 'object') Object.values(node).forEach(collect);
            };
            collect(value);

            const entries = [...imageMap.keys()];
            const compressed = new Map();
            let completed = 0;
            let cursor = 0;

            const byteLengthFromDataUrl = (dataUrl) => {
                const comma = dataUrl.indexOf(',');
                if (comma < 0) return dataUrl.length;
                const header = dataUrl.slice(0, comma);
                const body = dataUrl.slice(comma + 1);
                if (/;base64/i.test(header)) return Math.floor(body.length * 3 / 4) - (body.endsWith('==') ? 2 : body.endsWith('=') ? 1 : 0);
                try { return new TextEncoder().encode(decodeURIComponent(body)).length; }
                catch (_) { return body.length; }
            };

            const loadImage = (dataUrl) => new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = () => reject(new Error('Salah satu gambar tidak dapat dibaca untuk dikompresi. Periksa file gambar pada soal.'));
                image.src = dataUrl;
            });

            const compressOne = async (dataUrl) => {
                // SVG dipertahankan agar diagram vektor dan teks kecil tidak berubah.
                if (/^data:image\/svg\+xml/i.test(dataUrl)) return dataUrl;
                const originalBytes = byteLengthFromDataUrl(dataUrl);
                // Gambar kecil tidak perlu diproses ulang.
                if (originalBytes < 18 * 1024) return dataUrl;

                const image = await loadImage(dataUrl);
                const maxSide = 1600;
                const scale = Math.min(1, maxSide / Math.max(image.naturalWidth || image.width, image.naturalHeight || image.height));
                const width = Math.max(1, Math.round((image.naturalWidth || image.width) * scale));
                const height = Math.max(1, Math.round((image.naturalHeight || image.height) * scale));
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d', { alpha: true });
                if (!ctx) return dataUrl;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(image, 0, 0, width, height);

                const toWebP = (quality) => new Promise(resolve => {
                    canvas.toBlob(blob => resolve(blob), 'image/webp', quality);
                });
                // Kualitas cukup tinggi untuk menjaga keterbacaan grafik/ilustrasi.
                let blob = await toWebP(0.90);
                if (!blob) return dataUrl;
                if (blob.size > originalBytes * 0.94) {
                    const secondTry = await toWebP(0.84);
                    if (secondTry && secondTry.size < blob.size) blob = secondTry;
                }
                if (blob.size >= originalBytes) return dataUrl;

                const buffer = await blob.arrayBuffer();
                const bytes = new Uint8Array(buffer);
                let binary = '';
                const chunkSize = 0x8000;
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
                }
                return `data:image/webp;base64,${btoa(binary)}`;
            };

            const worker = async () => {
                while (true) {
                    const index = cursor++;
                    if (index >= entries.length) return;
                    const dataUrl = entries[index];
                    try {
                        compressed.set(dataUrl, await compressOne(dataUrl));
                    } catch (error) {
                        console.warn('Gambar dipertahankan tanpa kompresi:', error);
                        compressed.set(dataUrl, dataUrl);
                    }
                    completed++;
                    onProgress({ completed, total: entries.length });
                }
            };

            if (entries.length) {
                onProgress({ completed: 0, total: entries.length });
                await Promise.all(Array.from({ length: Math.min(2, entries.length) }, worker));
            }

            const rebuild = (node) => {
                if (typeof node === 'string') return compressed.get(node) || node;
                if (Array.isArray(node)) return node.map(rebuild);
                if (node && typeof node === 'object') {
                    const result = {};
                    for (const [key, child] of Object.entries(node)) result[key] = rebuild(child);
                    return result;
                }
                return node;
            };
            return rebuild(value);
        };

        // Normalisasi notasi matematika: mendukung LaTeX mentah dari generator/soal lama.
        // Pecahan, akar, pangkat, operasi, dan relasi dibungkus agar KaTeX merendernya,
        // bukan menampilkan teks literal seperti \frac{1}{2}.
        const normalizeMathNotation = (value) => {
            let t = String(value ?? '');
            // Beberapa generator menyimpan satu atau dua backslash sebelum perintah LaTeX.
            t = t.replace(/\\\\(?=(?:dfrac|tfrac|frac|sqrt|times|div|cdot|pi|theta|alpha|beta|leq|geq|neq|approx|pm|percent)\b)/g, '\\');
            const vulgar = {'1/2':'½','1/3':'⅓','2/3':'⅔','1/4':'¼','3/4':'¾','1/5':'⅕','2/5':'⅖','3/5':'⅗','4/5':'⅘','1/6':'⅙','5/6':'⅚','1/8':'⅛','3/8':'⅜','5/8':'⅝','7/8':'⅞'};
            const supers = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
            const subs = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','-':'₋'};
            const fracToText = (_match, a, b) => {
                const key = `${a}/${b}`;
                if (vulgar[key]) return vulgar[key];
                return [...String(a)].map(c => supers[c] || c).join('') + '⁄' + [...String(b)].map(c => subs[c] || c).join('');
            };
            // Regex ini sengaja mencocokkan satu backslash literal di data soal.
            t = t.replace(/\\(?:dfrac|tfrac|frac)\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, fracToText);
            const symbols = [
                [/\\times\b/g, '×'], [/\\div\b/g, '÷'], [/\\cdot\b/g, '·'],
                [/\\pi\b/g, 'π'], [/\\theta\b/g, 'θ'], [/\\alpha\b/g, 'α'], [/\\beta\b/g, 'β'],
                [/\\leq\b|\\le\b/g, '≤'], [/\\geq\b|\\ge\b/g, '≥'],
                [/\\neq\b/g, '≠'], [/\\approx\b/g, '≈'], [/\\pm\b/g, '±'], [/\\percent\b/g, '%'],
                [/\\sqrt\s*\{([^{}]+)\}/g, '√($1)']
            ];
            for (const [pattern, symbol] of symbols) t = t.replace(pattern, symbol);
            // Hapus delimiter LaTeX yang tercetak literal.
            t = t.replace(/\\\(|\\\)|\\\[|\\\]/g, '');
            return t;
        };

        const renderMath = () => {
            setTimeout(() => {
                if (window.renderMathInElement) {
                    // Bungkus notasi LaTeX mentah pada teks yang terlihat di aplikasi.
                    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
                    const nodes = [];
                    while (walker.nextNode()) {
                        const node = walker.currentNode;
                        if (node.parentElement && !node.parentElement.closest('.katex,script,style,textarea,input,code,pre')) {
                            if (/\\(?:frac|dfrac|tfrac|sqrt|times|div|cdot|pi|theta|alpha|beta|leq|geq|neq|approx|pm|percent)\b/.test(node.nodeValue || '')) nodes.push(node);
                        }
                    }
                    nodes.forEach(node => {
                        const normalized = normalizeMathNotation(node.nodeValue);
                        // Render langsung setiap ekspresi \(...\) dengan KaTeX. Ini lebih andal
                        // daripada hanya mengandalkan auto-render pada teks React yang baru berubah.
                        if (window.katex && /\\\([\s\S]*?\\\)/.test(normalized)) {
                            const fragment = document.createDocumentFragment();
                            const formulaPattern = /\\\(([\s\S]*?)\\\)/g;
                            let last = 0, match;
                            while ((match = formulaPattern.exec(normalized)) !== null) {
                                if (match.index > last) fragment.appendChild(document.createTextNode(normalized.slice(last, match.index)));
                                const span = document.createElement('span');
                                try {
                                    span.className = 'katex-inline-rendered';
                                    span.innerHTML = window.katex.renderToString(match[1], {throwOnError:false, strict:'ignore'});
                                } catch (e) {
                                    span.textContent = match[0];
                                }
                                fragment.appendChild(span);
                                last = formulaPattern.lastIndex;
                            }
                            if (last < normalized.length) fragment.appendChild(document.createTextNode(normalized.slice(last)));
                            if (last > 0) node.parentNode && node.parentNode.replaceChild(fragment, node);
                        } else {
                            node.nodeValue = normalized;
                        }
                    });
                    renderMathInElement(document.body, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                }
            }, 100);
        };
        // Pastikan rumus dirender kembali setelah React memperbarui soal/opsi.
        // Auto-render sekali saja sering kalah cepat dari proses render React.
        (() => {
            if (window.__mathRenderObserverInstalled) return;
            window.__mathRenderObserverInstalled = true;
            let queued = false;
            const queueMathRender = () => {
                if (queued) return;
                queued = true;
                setTimeout(() => {
                    queued = false;
                    try { renderMath(); } catch (e) { console.warn('Render matematika:', e); }
                }, 180);
            };
            const startObserver = () => {
                if (!document.body || !window.MutationObserver) return;
                const observer = new MutationObserver(records => {
                    const relevant = records.some(record => {
                        const target = record.target.nodeType === 1 ? record.target : record.target.parentElement;
                        if (target && target.closest && target.closest('.katex,script,style,textarea,input,code,pre')) return false;
                        return record.type === 'childList' || record.type === 'characterData';
                    });
                    if (relevant) queueMathRender();
                });
                observer.observe(document.body, {subtree: true, childList: true, characterData: true});
                queueMathRender();
            };
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startObserver, {once: true});
            } else {
                startObserver();
            }
        })();

        const generateDays = () => Array.from({ length: 31 }, (_, i) => i + 1);
        const generateMonths = () => ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const generateYears = () => {

        // Fungsi Helper untuk Menentukan Kategori Nilai
        const getScoreCategory = (score) => {
            const nilai = Number(score) || 0;
            if (nilai >= 95) return "Istimewa";
            if (nilai >= 76.67) return "Baik";
            if (nilai >= 50) return "Memadai";
            return "Kurang";
        };
        
        const shuffleArray = (array) => {
            if (!array) return [];
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        const downloadExcel = (data, title = "Rekap") => {

            tableHTML += `</tbody></table></body></html>`;
            const blob = new Blob([tableHTML], { type: 'application/vnd.ms-excel' });
            const url = window.URL.createObjectURL(blob);

            link.href = url;

        // ============================================================
        // UNDUH ANALISIS HASIL NILAI PER BUTIR SOAL
        // ============================================================
        const downloadAnalysis = (data, title = "Analisis_Hasil_Nilai") => {
            if (!Array.isArray(data) || data.length === 0) { alert("Belum ada data nilai untuk dianalisis."); return; }
            const hasDetail = data.some(r => Array.isArray(r.questionAnalysis) && r.questionAnalysis.length);
            if (!hasDetail) { alert("Data nilai lama belum menyimpan rincian jawaban per soal. Analisis per butir tersedia untuk hasil yang dikerjakan setelah fitur ini diperbarui."); return; }
            const map = {};
            data.forEach(result => (result.questionAnalysis || []).forEach(item => {
                const key = String(item.questionId ?? item.questionNo ?? '');
                if (!map[key]) map[key] = { no:item.questionNo || Object.keys(map).length+1, subject:item.subject||'-', title:item.examTitle||result.examTitle||'-', type:item.questionForm||'-', competency:item.competency||'-', subcompetency:item.subcompetency||'-', material:item.element||'-', submaterial:item.subelement||'-', coverage:item.coverage||item.cakupanSubelemen||'-', cognitive:item.cognitiveLevel||'-', thinking:item.thinkingProcess||'-', participants:0, correct:0, wrong:0, blank:0 };
                const a=map[key]; a.participants++;
                if(item.status==='correct' || item.isCorrect===true) a.correct++; else if(item.status==='blank') a.blank++; else a.wrong++;
            }));
            const rows=Object.values(map).sort((a,b)=>Number(a.no)-Number(b.no));
            const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            const interpretation=p=>p>=80?'Sangat tinggi':p>=60?'Tinggi':p>=40?'Sedang':'Rendah';
            let html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>table{border-collapse:collapse}th,td{border:1px solid #777;padding:5px;vertical-align:top}th{background:#dbeafe;font-weight:bold}.title{font-size:16pt;font-weight:bold}</style></head><body>';
            const subjectsInAnalysis = [...new Set(data.flatMap(r => (r.questionAnalysis || []).map(item => item.subject).filter(Boolean)))];
            const analysisBasis = subjectsInAnalysis.length === 1 && subjectsInAnalysis[0] === 'Matematika'
                ? 'metadata butir Matematika mencakup Materi/Elemen, Submateri/Sub-elemen, Cakupan Sub-elemen, Kompetensi, Level Kognitif, dan Proses Berpikir.'
                : subjectsInAnalysis.length === 1 && subjectsInAnalysis[0] === 'Bahasa Indonesia'
                    ? 'metadata butir Bahasa Indonesia mencakup Materi/Elemen, Subkompetensi, Kompetensi, Level Kognitif, dan Proses Berpikir. Cakupan Sub-elemen Matematika tidak digunakan.'
                    : 'metadata butir disesuaikan dengan mata pelajaran masing-masing; Cakupan Sub-elemen digunakan untuk Matematika, sedangkan Bahasa Indonesia menggunakan Subkompetensi.';
            html+=`<p class="title">ANALISIS HASIL NILAI PER BUTIR SOAL</p><p><b>Judul:</b> ${esc(title)} &nbsp; <b>Jumlah Peserta:</b> ${data.length}</p><p><b>Dasar analisis:</b> ${esc(analysisBasis)}</p>`;
            html+='<table><thead><tr><th>No</th><th>Mata Pelajaran</th><th>Judul Soal</th><th>Bentuk Soal</th><th>Kompetensi</th><th>Subkompetensi</th><th>Materi/Elemen</th><th>Submateri/Sub-elemen</th><th>Cakupan Sub-elemen</th><th>Level Kognitif</th><th>Proses Berpikir</th><th>Peserta</th><th>Benar</th><th>Salah</th><th>Kosong</th><th>% Benar</th><th>Interpretasi</th></tr></thead><tbody>';
            rows.forEach(a=>{const pct=a.participants?a.correct/a.participants*100:0; html+=`<tr><td>${esc(a.no)}</td><td>${esc(a.subject)}</td><td>${esc(a.title)}</td><td>${esc(a.type)}</td><td>${esc(a.competency)}</td><td>${esc(a.subcompetency)}</td><td>${esc(a.material)}</td><td>${esc(a.submaterial)}</td><td>${esc(a.coverage)}</td><td>${esc(a.cognitive)}</td><td>${esc(a.thinking)}</td><td>${a.participants}</td><td>${a.correct}</td><td>${a.wrong}</td><td>${a.blank}</td><td>${pct.toFixed(2)}%</td><td>${interpretation(pct)}</td></tr>`;});
            html+='</tbody></table></body></html>';
            const blob=new Blob([html],{type:'application/vnd.ms-excel'}), url=URL.createObjectURL(blob), link=document.createElement('a'); link.href=url;
            const safeTitle=String(title||'Analisis_Hasil_Nilai').replace(/[/\\?%*:|"<>]/g,'-'); link.download=`Analisis_Hasil_Nilai_${safeTitle}_${new Date().toISOString().slice(0,10)}.xls`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link); setTimeout(()=>URL.revokeObjectURL(url),1000);
        };

        // ============================================================
        // UNDUH WORD: NASKAH SOAL + KISI-KISI TKA SD
        // Format .DOC kompatibel dengan Microsoft Word.
        // Kisi-kisi mengikuti istilah pada Perkaban BSKAP No. 047/H/AN/2025:
        // Mapel, jenis soal, bentuk soal, materi/elemen, submateri/sub-elemen,
        // kompetensi, subkompetensi, level kognitif, dan proses berpikir.
        // ============================================================
        const wordEscape = (value) => String(value ?? '')
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
            .replace(/'/g,'&#39;');

        const wordPlain = (value) => String(value ?? '')
            .replace(/<br\s*\/?>/gi,'\n')
            .replace(/<[^>]*>/g,'')
            .replace(/[ \t\u00a0]+/g,' ')
            .replace(/[ \t]+([,.;:!?])/g,'$1')
            .replace(/([,.;:!?])(?=\S)/g,'$1 ')
            .replace(/\n[ \t]+/g,'\n')
            .trim();

        const getQuestionSubject = (q) => q?.subject || 'Matematika';
        const getQuestionTitle = (q) => String(q?.examTitle || 'Tanpa Judul').trim() || 'Tanpa Judul';

        const getWordQuestionType = (q) => {
            if (q?.itemType) return q.itemType;
            if (q?.groupId) return 'Grup';
            return 'Tunggal';
        };

        const getWordForm = (q) => {
            if (q?.questionForm) return q.questionForm;
            if (q?.type === 'complex') return 'PGK - MCMA';
            if (q?.type === 'statement') return 'PGK - Kategori';
            return 'Pilihan Ganda Sederhana';
        };

        const getWordMaterial = (q) => {
            if (getQuestionSubject(q) === 'Bahasa Indonesia') {
                if (q?.contentType === 'fiksi') return 'Keterampilan Membaca - Teks Fiksi';
                if (q?.contentType === 'informasi') return 'Keterampilan Membaca - Teks Informasi';
                return q?.element || 'Keterampilan Membaca';
            }
            return q?.element || 'Belum diisi';
        };

        const getWordSubmaterial = (q) => {
            if (q?.subelement) return q.subelement;
            if (q?.subcompetency) return q.subcompetency;
            return 'Belum diisi';
        };

        const getWordCompetency = (q) => q?.competency || 'Belum diisi';
        const getWordSubcompetency = (q) => q?.subcompetency || 'Belum diisi';
        const getWordCognitive = (q) => q?.cognitiveLevel || 'Belum diisi';
        const getWordThinking = (q) => q?.thinkingProcess || 'Belum diisi';

        const questionToWordHtml = (q, no) => {
            const options = Array.isArray(q?.options) ? q.options : [];
            const statements = Array.isArray(q?.statements) ? q.statements : [];
            let body = `<div class="question">
                <h3>Soal ${no}</h3>
                <p><b>Mata Pelajaran:</b> ${wordEscape(getQuestionSubject(q))}</p>
                <p><b>Judul Soal:</b> ${wordEscape(getQuestionTitle(q))}</p>`;
            if (q?.stimulus) {
                body += `<div class="stimulus"><b>Stimulus${q.stimulusTitle ? ': ' + wordEscape(q.stimulusTitle) : ''}</b><p>${wordEscape(normalizeMathNotation(wordPlain(q.stimulus))).replace(/\n/g,'<br/>')}</p></div>`;
            }
            if (q?.image) {
                body += `<p><img src="${q.image}" alt="${wordEscape(q.imageAlt || 'Gambar pendukung soal')}" style="max-width:520px;max-height:320px;"/></p>`;
            }
            body += `<p class="question-text">${wordEscape(normalizeMathNotation(wordPlain(q.text))).replace(/\n/g,'<br/>')}</p>`;

            if (options.length) {
                body += `<div class="options">`;
                options.forEach((o,i) => {
                    const img = q.optionImages?.[i] ? `<br/><img src="${q.optionImages[i]}" style="max-width:240px;max-height:150px;"/>` : '';
                    // Bersihkan awalan nomor/abjad yang mungkin sudah tersimpan pada teks opsi,
                    // lalu tampilkan hanya satu abjad A, B, C, D.
                    const cleanOption = wordPlain(o).replace(/^\s*(?:[A-Da-d]|[1-4])\s*[.)-]\s*/,'');
                    body += `<div class="option-item"><span class="option-letter">${String.fromCharCode(65+i)}.</span> ${wordEscape(normalizeMathNotation(cleanOption)).replace(/\n/g,'<br/>')}${img}</div>`;
                });
                body += `</div>`;
            }
            if (statements.length) {
                body += `<table class="statement-table"><tr><th>No.</th><th>Pernyataan</th><th>Respons/Kunci</th></tr>`;
                statements.forEach((s,i) => {
                    const answer = getEffectiveStatementMode(q) === 'custom' ? String(s.correct ?? 'Kunci belum diisi') : getStatementAnswerLabel(q, s.correct);
                    body += `<tr><td>${i+1}</td><td>${wordEscape(normalizeMathNotation(wordPlain(s.text)))}${s.image ? `<br/><img src="${s.image}" alt="Gambar pernyataan ${i+1}" style="max-width:240px;max-height:150px;"/>` : ''}</td><td>${answer}</td></tr>`;
                });
                body += `</table>`;
            }
            // Kunci jawaban dan pembahasan dipindahkan ke bagian khusus di bawah seluruh soal.
            body += `</div>`;
            return body;
        };

        // ============================================================
        // UNDUH PDF: NASKAH SOAL + KUNCI + PEMBAHASAN + KISI-KISI
        // Diunduh khusus untuk setiap judul soal.
        // ============================================================
        const pdfPlain = (value) => String(value ?? '')
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<[^>]*>/g, '')
            .replace(/&nbsp;/gi, ' ')
            .replace(/&amp;/gi, '&').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
            .replace(/[ \t\u00a0]+/g, ' ')
            .replace(/[ \t]+([,.;:!?])/g, '$1')
            .replace(/([,.;:!?])(?=\S)/g, '$1 ')
            .replace(/\n[ \t]+/g, '\n')
            .trim();

        const pdfSafeFileName = (value) => String(value || 'TKA_SD')
            .replace(/[\\/:*?"<>|]/g, '-')
            .replace(/\s+/g, '_')
            .slice(0, 120);

        const svgDataUrlToPng = (src, maxW = 100, maxH = 60) => new Promise((resolve) => {
            if (!src || !/^data:image\/svg\+xml/i.test(src)) return resolve(src);
            const img = new Image();
            img.onload = () => {
                try {
                    const ratio = img.width && img.height ? img.width / img.height : 1.5;
                    let w = maxW * 3, h = w / ratio;
                    if (h > maxH * 3) { h = maxH * 3; w = h * ratio; }
                    const canvas = document.createElement('canvas'); canvas.width = Math.max(1, Math.round(w)); canvas.height = Math.max(1, Math.round(h));
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/png'));
                } catch(e) { resolve(null); }
            };
            img.onerror = () => resolve(null); img.src = src;
        });

        // Format kunci kategori/pernyataan secara konsisten untuk semua ekspor.
        // Pada soal PGK Kategori, st.correct biasanya menyimpan indeks kategori,
        // bukan nilai boolean. Karena itu indeks harus diterjemahkan ke nama kategori.
        const getQuestionKeyForExport = (q) => {
            if (!q || typeof q !== 'object') return 'Belum diisi';
            const statements = Array.isArray(q.statements) ? q.statements : [];
            const categories = Array.isArray(q.categories) ? q.categories : [];
            if (statements.length) {
                return statements.map((st, i) => {
                    const raw = st?.correct;
                    let answer;
                    if (typeof raw === 'boolean') {
                        answer = getEffectiveStatementMode(q) === 'sa'
                            ? (raw ? 'Sesuai' : 'Tidak Sesuai')
                            : (raw ? 'Benar' : 'Salah');
                    } else if (typeof raw === 'number' || (typeof raw === 'string' && /^\d+$/.test(raw.trim()))) {
                        const idx = Number(raw);
                        answer = categories[idx] ?? String(raw);
                    } else if (raw !== undefined && raw !== null && String(raw).trim()) {
                        answer = String(raw);
                    } else {
                        answer = 'Kunci belum diisi';
                    }
                    return `${i + 1}. ${String(st?.text || st?.statement || '').trim()} — ${answer}`;
                }).join(' | ');
            }
            const correct = q.correct;
            const options = Array.isArray(q.options) ? q.options : [];
            if (Array.isArray(correct)) {
                return correct.map(v => {
                    if (typeof v === 'number' || /^\d+$/.test(String(v))) {
                        const idx = Number(v);
                        return idx >= 0 && idx < options.length ? `${String.fromCharCode(65 + idx)}. ${options[idx]}` : String(v);
                    }
                    const idx = options.findIndex(o => String(o).trim() === String(v).trim());
                    return idx >= 0 ? `${String.fromCharCode(65 + idx)}. ${options[idx]}` : String(v);
                }).join('; ');
            }
            if (correct !== undefined && correct !== null && String(correct).trim()) {
                const key = String(correct).trim();
                if (/^\d+$/.test(key) && Number(key) >= 0 && Number(key) < options.length) {
                    const idx = Number(key);
                    return `${String.fromCharCode(65 + idx)}. ${options[idx]}`;
                }
                const idx = options.findIndex(o => String(o).trim() === key);
                return idx >= 0 ? `${String.fromCharCode(65 + idx)}. ${options[idx]}` : key;
            }
            return 'Belum diisi';
        };

        // Satu sumber pembahasan untuk ekspor PDF dan Word. Soal lama dapat memakai
        // nama properti explain/solution/rationale/pembahasan, bukan hanya explanation.
        const getQuestionExplanationForExport = (q) => {
            if (!q || typeof q !== 'object') return 'Pembahasan belum tersedia pada data soal ini.';
            const candidates = [q.explanation, q.explain, q.solution, q.rationale, q.pembahasan];
            const saved = candidates.find(v =>
                typeof v === 'string' &&
                v.trim() &&
                !/^pembahasan belum tersedia\.?$/i.test(v.trim()) &&
                !/^(?:baca kembali stimulus|baca kembali teks|gunakan rumus yang sesuai|pembahasan otomatis berdasarkan kunci)/i.test(v.trim())
            );
            if (saved) return saved.trim();
            return 'PEMERIKSAAN DIPERLUKAN: pembahasan spesifik belum tersedia. Lengkapi dengan bukti kalimat/data dari stimulus dan alasan mengapa kunci benar serta opsi/pernyataan lain tidak tepat.';
        };

        const downloadPdfQuestions = async (questions, title = 'TKA_SD') => {
            if (!Array.isArray(questions) || !questions.length) {
                alert('Belum ada soal pada judul ini untuk diunduh.');
                return;
            }

            // jsPDF menulis teks biasa dan tidak merender notasi LaTeX. Jika paket
            // memuat rumus, gunakan mesin cetak browser + KaTeX agar pecahan,
            // pangkat, akar, simbol, dan susunan rumus tetap terbaca pada PDF.
            const mathSource = questions.map(q => [q?.text, q?.stimulus, q?.explanation, q?.explain, q?.solution,

e});}catch(e){console.warn('Render rumus:',e)} Promise.all(Array.from(document.images).map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve}))).then(()=>Promise.resolve(document.fonts?.ready).catch(()=>{})).then(()=>setTimeout(function(){window.focus();window.print();},500));}else{setTimeout(go,250)}};go();});<\/script></body></html>`);

            // data tersebut. Jangan mengganti semua pernyataan dengan filler umum.
            if (type === 'statement' && statements.length === 0) {
                statements = getRawOptionList(q).map((text,i)=>({id:makeId()+i, text, correct:false}));
            }
            const aiImage = normalizeImageValue(q.image) || normalizeImageValue(q.imageSvg);
            const shouldIllustrate = Boolean(q.imageRequired) || /geometri|pengukuran|bangun|persegi|kubus|balok|diagram|grafik|data|denah|pola|posisi/.test(String(q.text||'').toLowerCase() + ' ' + String(q.element||'').toLowerCase());
            const fallbackImage = aiImage || (shouldIllustrate ? svgToDataUrl(localIllustrationSvg(q)) : null);
            const rawOptionImages = Array.isArray(q.optionImages) ? q.optionImages : (Array.isArray(q.optionImageSvgs) ? q.optionImageSvgs : []);
            const optionImages = rawOptionImages.map(normalizeImageValue);
            while (optionImages.length < options.length) optionImages.push(null);
            return {
                id: q.id || makeId()+index, type, text:String(q.text||''), image:fallbackImage, imageAlt:String(q.imageAlt||q.imageDescription||''), imageRequired:Boolean(q.imageRequired) || Boolean(fallbackImage), imageDescription:String(q.imageDescription||''),
                options, optionImages:optionImages.slice(0,options.length), correct, statements,
                statementMode:q.statementMode||'tf', stimulus:String(q.stimulus||''), stimulusTitle:String(q.stimulusTitle||''),
                subject:q.subject||'Matematika', element:q.element||'Bilangan', subelement:q.subelement||'', cakupanSubelemen:q.cakupanSubelemen||q.coverage||'', coverage:q.coverage||q.cakupanSubelemen||'',
                competency:q.competency||'', subcompetency:q.subcompetency||'', cognitiveLevel:q.cognitiveLevel||'Aplikasi',
                thinkingProcess:q.thinkingProcess||'', itemType:q.itemType||'Tunggal', questionForm:q.questionForm||TKA_META.forms[type],
                explanation:String(q.explanation||'Pembahasan belum tersedia.'), similarityScore:Number.isFinite(Number(q.similarityScore))?Number(q.similarityScore):0, diversityStatus:String(q.diversityStatus||'PENDING'), variationProfile:q.variationProfile&&typeof q.variationProfile==='object'?q.variationProfile:{}, generatorOptionIssues, aiGenerated:true
            };
        };

        // ============================================================
        // DIVERSITY ENGINE TKA SD/MI
        // Mendeteksi duplikasi teks, struktur, konteks, stimulus,
        // pola pertanyaan, representasi, dan proses berpikir.
        // Tidak bergantung pada exact-string saja.
        // ============================================================
        const diversityStopwords = new Set([
            'yang','dan','atau','dari','pada','dengan','untuk','dalam','adalah',
            'ini','itu','tersebut','sebagai','agar','akan','dapat','sebuah',
            'seorang','suatu','berdasarkan','terhadap','setelah','sebelum',
            'siswa','murid','anak','soal','pilihan','jawaban','paling','tepat'
        ]);

        const diversityNormalize = (value) => String(value ?? '')
            .toLowerCase()
            .replace(/https?:\/\/\S+/g,' ')
            .replace(/\b\d+(?:[.,]\d+)?\b/g,' #angka# ')
            .replace(/\b(?:rani|budi|siti|andi|dina|ani|tono|ayah|ibu|kakak|adik)\b/g,' #tokoh# ')
            .replace(/[^a-z0-9#]+/g,' ')
            .replace(/\s+/g,' ')
            .trim();

        const diversityTokens = (value) => diversityNormalize(value)
            .split(/\s+/)
            .filter(x => x && x.length > 2 && !diversityStopwords.has(x));

        const diversitySetSimilarity = (a,b) => {
            const A=new Set(a), B=new Set(b);
            if(!A.size && !B.size) return 100;
            if(!A.size || !B.size) return 0;
            let inter=0;
            for(const x of A) if(B.has(x)) inter++;
            return Math.round((inter/(A.size+B.size-inter))*100);
        };

        const diversityNgramSimilarity = (a,b,n=3) => {
            const ta=diversityTokens(a), tb=diversityTokens(b);
            const grams = arr => {
                const out=[];
                for(let i=0;i<=arr.length-n;i++) out.push(arr.slice(i,i+n).join(' '));
                return new Set(out);
            };
            const A=grams(ta), B=grams(tb);
            if(!A.size && !B.size) return 100;
            if(!A.size || !B.size) return 0;
            let inter=0; for(const x of A) if(B.has(x)) inter++;
            return Math.round((inter/(A.size+B.size-inter))*100);
        };

        const diversityQuestionPattern = (q) => {
            const t=String(q?.text||'').toLowerCase();
            if(/mengapa|alasan yang paling tepat|apa alasan/.test(t)) return 'menentukan_alasan';
            if(/simpulan|kesimpulan|dapat disimpulkan/.test(t)) return 'menarik_kesimpulan';
            if(/membandingkan|lebih besar|lebih kecil|paling banyak|paling sedikit|perbedaan/.test(t)) return 'membandingkan';
            if(/jika|apabila|ketika .* berubah|apa yang kemungkinan terjadi|akibat/.test(t)) return 'menentukan_perubahan_atau_akibat';
            if(/strategi|cara yang paling tepat|langkah yang tepat/.test(t)) return 'menentukan_strategi';
            if(/kesalahan|perbaiki|letak kesalahan/.test(t)) return 'menemukan_kesalahan';
            if(/sesuai|tidak sesuai|tepat|tidak tepat|benar|salah|mendukung/.test(t) && q?.type==='statement') return 'menilai_pernyataan';
            if(/informasi.*(tersurat|disebutkan|terdapat)|dinyatakan secara langsung/.test(t)) return 'mengidentifikasi_informasi';
            if(/makna|arti|kosakata/.test(t)) return 'memahami_makna_konteks';
            if(/berapa|hitung|hasil|jumlah|total|selisih|luas|keliling|volume/.test(t)) return 'menentukan_hasil';
            return q?.variationProfile?.questionPattern || 'pola_lain';
        };

        const diversityContextType = (q) => {
            const t=(String(q?.stimulus||'')+' '+String(q?.text||'')).toLowerCase();
            const rules=[
                ['sekolah',/sekolah|kelas|perpustakaan|kantin|guru/],
                ['rumah_keluarga',/rumah|ayah|ibu|keluarga|adik|kakak/],
                ['lingkungan',/sampah|lingkungan|air|energi|cuaca|kebun/],
                ['olahraga',/olahraga|lari|renang|sepak bola|permainan/],
                ['perjalanan',/perjalanan|bus|kereta|jarak|rute/],
                ['hewan_tumbuhan',/hewan|tumbuhan|tanaman|pohon|burung/],
                ['masyarakat_budaya',/masyarakat|desa|budaya|tradisi|kegiatan warga/],
                ['data_pengamatan',/pengamatan|survei|data|tabel|diagram|grafik/],
                ['belanja',/belanja|harga|uang|diskon|kembalian|toko/]
            ];
            for(const [name,re] of rules) if(re.test(t)) return name;
            return 'konteks_lain';
        };

        const diversityStimulusType = (q) => {
            const st=String(q?.stimulus||'').toLowerCase();
            const t=st+' '+String(q?.text||'').toLowerCase();
            if(!st) return 'tanpa_stimulus';
            if(/^\s*(?:\|.*\|.*\n|\d+\s*[-–:]\s*)/m.test(st) || /tabel/.test(t)) return 'tabel_data';
            if(/diagram|grafik/.test(t) || q?.image) return 'visual_data';
            if(/percakapan|kata .*:|dialog/.test(st)) return 'dialog';
            if(/langkah|pertama|kedua|selanjutnya|setelah itu/.test(st) && /cara|prosedur/.test(st)) return 'prosedur';
            if(/laporan|hasil pengamatan|diamati|dicatat/.test(st)) return 'laporan_pengamatan';
            if(/cerita|tokoh|suatu hari|akhirnya/.test(st)) return 'narasi';
            return 'paragraf_informasi';
        };

        const diversityReasoningPattern = (q) => {
            const explicit=String(q?.variationProfile?.reasoning||'').trim();
            if(explicit) return explicit;
            const t=String(q?.text||'').toLowerCase();
            if(/membandingkan|perbedaan|lebih besar|lebih kecil/.test(t)) return 'membandingkan';
            if(/mengapa|alasan/.test(t)) return 'sebab_alasan';
            if(/simpulan|kesimpulan|dapat disimpulkan/.test(t)) return 'inferensi';
            if(/strategi|cara yang paling tepat|langkah/.test(t)) return 'strategi';
            if(/jika|apabila|kemungkinan terjadi|akibat/.test(t)) return 'prediksi_akibat';
            if(q?.cognitiveLevel==='Penalaran') return 'penalaran_nonrutin';
            if(q?.cognitiveLevel==='Aplikasi') return 'penerapan';
            return 'identifikasi_pemahaman';
        };

        const diversityRepresentation = (q) => {
            const explicit=String(q?.variationProfile?.representation||'').trim();
            if(explicit) return explicit;
            const t=(String(q?.stimulus||'')+' '+String(q?.text||'')).toLowerCase();
            if(q?.image || /diagram|grafik|gambar|denah/.test(t)) return 'visual';
            if(/tabel|daftar data/.test(t)) return 'tabel';
            if(/pecahan|persen|desimal|rasio/.test(t)) return 'numerik_simbolik';
            if(/pola|urutan/.test(t)) return 'pola';
            return 'teks_kontekstual';
        };

        const buildVariationProfile = (q) => ({
            context: diversityContextType(q),
            stimulus: diversityStimulusType(q),
            questionPattern: diversityQuestionPattern(q),
            reasoning: diversityReasoningPattern(q),
            representation: diversityRepresentation(q),
            openingPattern: diversityNormalize(String(q?.text||'')).split(/\s+/).slice(0,7).join(' '),
            dataPattern: /#angka#/.test(diversityNormalize(q?.text||' '+q?.stimulus||'')) ? 'numerik' : 'non_numerik',
            operationPattern: /bagi|dibagi|perkalian|dikali|kali|jumlah|tambah|kurang|selisih|luas|keliling|volume|rata-rata|persen/.exec(String(q?.text||'').toLowerCase())?.[0] || 'non_operasional',
            optionPattern: q?.type==='statement' ? 'kategori' : (Array.isArray(q?.options) ? `opsi_${q.options.length}` : 'opsi_tidak_diketahui'),
            cognitiveDemand: q?.cognitiveLevel || 'tidak_diketahui',
            keyPattern: Array.isArray(q?.correct) ? 'multi_kunci' : 'satu_kunci'
        });

        const scorePairDiversity = (a,b) => {
            const pa=buildVariationProfile(a), pb=buildVariationProfile(b);
            const textSim=diversityNgramSimilarity(`${a?.text||''} ${a?.stimulus||''}`,`${b?.text||''} ${b?.stimulus||''}`);
            const stemSim=diversitySetSimilarity(diversityTokens(a?.text),diversityTokens(b?.text));
            const contextSim=pa.context===pb.context?100:0;
            const stimulusSim=pa.stimulus===pb.stimulus?100:0;
            const questionSim=pa.questionPattern===pb.questionPattern?100:0;
            const reasoningSim=pa.reasoning===pb.reasoning?100:0;
            const representationSim=pa.representation===pb.representation?100:0;
            const operationSim=pa.operationPattern===pb.operationPattern?100:0;
            const score=Math.round(
                textSim*0.25 + stemSim*0.15 + contextSim*0.12 +
                stimulusSim*0.10 + questionSim*0.13 + reasoningSim*0.10 +
                representationSim*0.05 + operationSim*0.10
            );
            return {score, profileA:pa, profileB:pb};
        };

        const applyPackageDiversityGate = (items) => {
            const qs=Array.isArray(items)?items:[];
            const out=qs.map(q=>{
                const variationProfile={...(q.variationProfile||{}),...buildVariationProfile(q)};
                return {...q,variationProfile,similarityScore:0,diversityStatus:'PASS',diversityIssues:[]};
            });
            for(let i=0;i<out.length;i++){
                for(let j=i+1;j<out.length;j++){
                    const pair=scorePairDiversity(out[i],out[j]);
                    if(pair.score>out[i].similarityScore) out[i].similarityScore=pair.score;
                    if(pair.score>out[j].similarityScore) out[j].similarityScore=pair.score;
                    if(pair.score>60 || (
                        pair.profileA.questionPattern===pair.profileB.questionPattern &&
                        pair.profileA.reasoning===pair.profileB.reasoning &&
                        pair.profileA.context===pair.profileB.context
                    )){
                        const detail=`Terlalu mirip dengan soal ${i+1}: skor kemiripan ${pair.score}/100; pola=${pair.profileA.questionPattern}, konteks=${pair.profileA.context}, penalaran=${pair.profileA.reasoning}.`;
                        out[j].diversityStatus='REJECTED';
                        out[j].diversityIssues.push(detail);
                    }
                }
            }
            return out.map(q=>({...q,diversityIssues:[...new Set(q.diversityIssues||[])],
                diversityStatus:(q.diversityIssues||[]).length?'REJECTED':'PASS'}));
        };

        const diversityGateMessage = (items) => {
            const rejected=(items||[]).filter(q=>q?.diversityStatus==='REJECTED');
            return rejected.length
                ? `${rejected.length} soal ditolak karena terlalu mirip dengan soal lain. Buat ulang paket dengan pola konstruksi yang berbeda.`
                : 'Semua soal lolos pemeriksaan keberagaman struktur dan kemiripan.';
        };

        // Perbaikan aman untuk keluaran AI/lokal yang belum lengkap.
        // Tujuannya melengkapi struktur wajib tanpa mengubah kunci yang sudah ada.
        const repairQuestionForValidation = (q) => {
            if (!q || typeof q !== 'object') return q;
            const clean = x => String(x ?? '').trim();
            const subjects = ['Bahasa Indonesia','Matematika'];
            const forms = ['single','complex','statement'];
            const cognitive = ['Pengetahuan dan Pemahaman','Aplikasi','Penalaran'];

            q.subject = subjects.includes(q.subject) ? q.subject : 'Matematika';
            q.type = forms.includes(q.type) ? q.type : 'single';
            q.cognitiveLevel = cognitive.includes(q.cognitiveLevel) ? q.cognitiveLevel : 'Aplikasi';
            q.text = clean(q.text) || 'Pilih jawaban yang paling tepat berdasarkan informasi pada soal.';
            q.explanation = clean(q.explanation);

            if (q.subject === 'Matematika') {
                if (!TKA_META.mathElements.includes(q.element)) q.element = 'Bilangan';
                q.subelement = clean(q.subelement) || 'Bilangan Rasional';
                q.cakupanSubelemen = clean(q.cakupanSubelemen || q.coverage) || 'Semua cakupan pada sub-elemen';
                q.coverage = q.cakupanSubelemen;
            } else {
                q.element = 'Keterampilan Membaca';
                q.stimulus = clean(q.stimulus);
                if (!q.stimulus) q.stimulus = 'Bacalah informasi berikut dengan cermat. Gunakan informasi tersebut untuk menjawab pertanyaan berdasarkan isi bacaan.';
                // Validator memakai rentang 120–220 kata. Tambahkan kalimat netral bila stimulus terlalu pendek.
                while (wordCount(q.stimulus) < 120) q.stimulus += ' Informasi dalam bacaan perlu dipahami dengan memperhatikan hubungan antargagasan, urutan peristiwa, fakta penting, serta alasan yang mendukung kesimpulan. Pembaca juga perlu membedakan informasi yang dinyatakan secara langsung dan informasi yang dapat disimpulkan dari konteks bacaan.';
                if (wordCount(q.stimulus) > 220) q.stimulus = q.stimulus.split(/\s+/).slice(0,220).join(' ');
            }

            if (q.type === 'single') {
                q.options = getRawOptionList(q).map(clean).filter(Boolean);
                const correct = clean(q.correct);
                const usableCorrect = /^[A-H]$/i.test(correct) ? '' : correct;
                if (usableCorrect && !q.options.includes(usableCorrect)) q.options.unshift(usableCorrect);
                const fillers = q.subject === 'Bahasa Indonesia'
                    ? ['Informasi tersebut tidak dibahas dalam teks.','Pilihan tersebut bertentangan dengan informasi dalam teks.','Pilihan tersebut tidak dapat disimpulkan dari teks.','Pilihan tersebut tidak berkaitan dengan peristiwa dalam teks.']
                    : ['Informasi pada soal tidak mendukung pilihan tersebut.','Hasil tersebut tidak sesuai dengan data pada soal.','Pilihan tersebut tidak memenuhi kondisi yang diberikan.','Pilihan tersebut merupakan hasil perhitungan yang keliru.'];
                for (const f of fillers) if (q.options.length < 4 && !q.options.includes(f)) q.options.push(f);
                // Hilangkan duplikasi tanpa menghilangkan kunci.
                q.options = [...new Set(q.options)];
                for (const f of fillers) if (q.options.length < 4 && !q.options.includes(f)) q.options.push(f);
                q.options = q.options.slice(0,4);
                if (!q.options.length) q.options = fillers.slice(0,4);
                q.correct = usableCorrect;
                if (!q.correct || !q.options.includes(q.correct)) q.correct = q.options[0];
                if (!q.explanation || q.explanation === 'Pembahasan belum tersedia.') q.explanation = `Kunci jawaban adalah "${q.correct}" karena paling sesuai dengan informasi dan kondisi yang diberikan pada soal.`;
            } else if (q.type === 'complex') {
                // PGK MCMA sah dengan minimal tiga opsi; jangan menambah opsi pengecoh buatan.
                q.options = [...new Set(getRawOptionList(q).map(clean).filter(Boolean))].slice(0,20);
                q.correct = Array.isArray(q.correct) ? q.correct.map(clean).filter(Boolean) : [];
                q.correct = q.correct.filter(v => q.options.includes(v));
                for (const o of q.options) if (q.correct.length < 2 && !q.correct.includes(o)) q.correct.push(o);
                q.correct = [...new Set(q.correct)].slice(0, q.options.length);
                if (!q.explanation || q.explanation === 'Pembahasan belum tersedia.') q.explanation = `Kunci yang benar adalah ${q.correct.join(', ')}. Jawaban tersebut didukung oleh informasi atau kondisi yang diberikan pada soal.`;
            } else if (q.type === 'statement') {
                q.statements = Array.isArray(q.statements) ? q.statements.map(s=>({...s,text:clean(s?.text || s?.statement || s?.label),correct:Boolean(s?.correct)})) : [];
                q.statements = q.statements.filter(s=>s.text);
                if (q.statements.length === 0) {
                    q.statements = getRawOptionList(q).map((text,i)=>({id:makeId()+i,text,correct:false}));
                }
                const fillers = [
                    {text:'Pernyataan tersebut didukung oleh informasi dalam stimulus.',correct:false},
                    {text:'Pernyataan tersebut tidak didukung oleh informasi dalam stimulus.',correct:false},
                    {text:'Kesimpulan tersebut dapat dibuktikan dari informasi yang tersedia.',correct:false}
                ];
                for (const f of fillers) if (q.statements.length < 3) q.statements.push({...f,id:makeId()});
                if (!q.explanation || q.explanation === 'Pembahasan belum tersedia.') q.explanation = 'Kunci kategori ditentukan dengan mencocokkan setiap pernyataan dengan informasi yang tersedia pada stimulus.';
            }

            // Gambar tidak boleh membuat soal tersangkut selamanya. Jika generator tidak
            // menghasilkan gambar, lepaskan penanda wajib gambar agar soal tetap dapat divalidasi.
            if (q.imageRequired && !q.image) q.imageRequired = false;
            return q;
        };

        // Validator utama TKA SD. Didefinisikan sebelum validator AI agar
        // generator lokal maupun AI dapat memakai pemeriksaan yang sama.
        const validateTKAQuestion = (q) => {
            const issues = [];
            const subjects = ['Bahasa Indonesia','Matematika'];
            const forms = ['single','complex','statement'];
            const cognitive = ['Pengetahuan dan Pemahaman','Aplikasi','Penalaran'];
            if (!q || typeof q !== 'object') return ['Data soal tidak valid.'];
            if (!subjects.includes(q.subject)) issues.push('Mata uji harus Bahasa Indonesia atau Matematika.');
            if (!forms.includes(q.type)) issues.push('Bentuk soal tidak dikenali.');
            if (!cognitive.includes(q.cognitiveLevel)) issues.push('Level kognitif TKA belum diisi.');
            if (q.subject === 'Matematika' && !TKA_META.mathElements.includes(q.element)) issues.push('Elemen Matematika SD di luar cakupan TKA.');
            if (q.subject === 'Bahasa Indonesia' && q.element !== 'Keterampilan Membaca') issues.push('Bahasa Indonesia TKA SD berfokus pada keterampilan membaca.');
            if (q.subject === 'Bahasa Indonesia' && !String(q.stimulus || '').trim()) issues.push('Soal Bahasa Indonesia harus memiliki stimulus bacaan.');
            if (q.type === 'single' && (!Array.isArray(q.options) || q.options.length !== 4)) issues.push('PG sederhana harus memiliki tepat 4 opsi.');
            if (q.type === 'complex' && (!Array.isArray(q.options) || q.options.filter(x => String(x ?? '').trim()).length < 3)) issues.push('PGK MCMA minimal memiliki 3 opsi yang terisi.');
            if (q.type === 'complex' && (!Array.isArray(q.correct) || q.correct.length < 2)) issues.push('PGK MCMA minimal memiliki 2 kunci benar.');
            if (q.type === 'statement' && (!Array.isArray(q.statements) || q.statements.length < 3)) issues.push('PGK Kategori harus memiliki sedikitnya 3 pernyataan.');
            return [...new Set(issues)];
        };

        // Gerbang deterministik tambahan: struktur wajib tidak boleh "diperbaiki"
        // dengan mengarang kunci atau pembahasan lalu dianggap valid.
        const validateTKAReleaseGate = (q) => {
            const issues = [];
            const cleanText = v => String(v ?? '').replace(/<[^>]*>/g,' ').trim();
            if (!q || typeof q !== 'object') return ['Butir bukan objek data yang valid.'];
            if (!cleanText(q.text)) issues.push('Pertanyaan kosong.');
            if (!cleanText(q.explanation) || /pembahasan belum tersedia|berdasarkan stimulus|gunakan rumus yang sesuai|baca kembali teks/i.test(cleanText(q.explanation))) issues.push('Pembahasan kosong atau terlalu umum; wajib menunjukkan bukti teks atau langkah penyelesaian.');
            if (!['single','complex','statement'].includes(q.type)) issues.push('Bentuk soal tidak dikenali.');
            if (q.type === 'single') {
                const opts = Array.isArray(q.options) ? q.options.map(cleanText).filter(Boolean) : [];
                const key = cleanText(q.correct);
                if (opts.length !== 4) issues.push('PG sederhana harus memiliki tepat empat opsi yang terisi.');
                if (!key) issues.push('Kunci jawaban PG sederhana kosong.');
                if (key && opts.filter(x => x.toLocaleLowerCase() === key.toLocaleLowerCase()).length !== 1) issues.push('Kunci PG sederhana tidak cocok secara unik dengan opsi.');
                if (new Set(opts.map(x=>x.toLocaleLowerCase())).size !== opts.length) issues.push('Opsi jawaban memiliki duplikasi.');
            } else if (q.type === 'complex') {
                const opts = Array.isArray(q.options) ? q.options.map(cleanText).filter(Boolean) : [];
                const keys = Array.isArray(q.correct) ? q.correct.map(cleanText).filter(Boolean) : [];
                if (opts.length < 3) issues.push('PGK-MCMA harus memiliki sedikitnya tiga opsi yang terisi.');
                if (keys.length < 2) issues.push('Kunci PGK-MCMA harus memuat sedikitnya dua jawaban benar.');
                if (new Set(keys.map(x=>x.toLocaleLowerCase())).size !== keys.length) issues.push('Kunci PGK-MCMA mengandung duplikasi.');
                if (keys.some(k=>!opts.some(o=>o.toLocaleLowerCase()===k.toLocaleLowerCase()))) issues.push('Ada kunci PGK-MCMA yang tidak tersedia pada opsi.');
                if (new Set(opts.map(x=>x.toLocaleLowerCase())).size !== opts.length) issues.push('Opsi PGK-MCMA memiliki duplikasi.');
            } else if (q.type === 'statement') {
                const st = Array.isArray(q.statements) ? q.statements : [];
                if (st.length < 3) issues.push('PGK kategori harus memiliki sedikitnya tiga pernyataan.');
                if (st.some(x=>!cleanText(x?.text))) issues.push('Ada pernyataan kategori yang kosong.');
                if (st.some(x=>typeof x?.correct !== 'boolean')) issues.push('Setiap pernyataan kategori wajib memiliki kunci boolean yang eksplisit.');
                const norms=st.map(x=>cleanText(x?.text).toLocaleLowerCase());
                if(new Set(norms).size!==norms.length) issues.push('Pernyataan kategori terduplikasi.');
            }

                        const prompt = `Anda adalah pengembang asesmen TKA SD/MI yang sangat berpengalaman. ${TKA_SD_AI_INSTRUCTIONS} Buat tepat ${totalCount} soal berkualitas tinggi berdasarkan blueprint berikut: ${JSON.stringify(payload)}. DISTRIBUSI BENTUK SOAL WAJIB: PG Sederhana=${questionCounts.single}, PGK MCMA=${questionCounts.complex}, PGK Kategori=${questionCounts.statement}. Jangan mengubah jumlah tiap bentuk. Gunakan kerangka TKA SD yang berlaku: Bahasa Indonesia berfokus pada keterampilan membaca melalui teks informasi/fiksi; kompetensinya pemahaman tekstual, pemahaman inferensial, serta evaluasi dan apresiasi. Matematika mencakup Bilangan, Geometri dan Pengukuran, serta Data dengan kompetensi pengetahuan matematika, representasi matematis, penalaran, pemecahan masalah, dan koneksi matematis. Soal harus menekankan penerapan, penalaran, dan pemecahan masalah, bukan latihan hitung rutin.

butir wajib mengukur cakupan yang dipilih secara substantif. Jangan hanya menyalin label cakupan. Jika semua cakupan dipilih, distribusikan butir pada cakupan yang tersedia secara wajar.

                        // Fallback model otomatis khusus GENERATOR SOAL TKA (bukan TRYOUT).

                                     if(attempt>1) {
                                         await new Promise(resolve=>setTimeout(resolve,1800*Math.pow(2,attempt-2)));

                                     data=await response.json().catch(()=>({}));

                                     const candidateText=data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';

                         }

                         if(!raw.length) {

                    }
                    const normalized=raw.map((q,i)=>normalizeAIQuestion({...q, subelement:subject==='Matematika'?subSelection:'', subcompetency:subject==='Bahasa Indonesia'?subSelection:'', cakupanSubelemen:subject==='Matematika'?(q.cakupanSubelemen||q.coverage||coverageSelection||'Semua cakupan pada sub-elemen'):'', coverage:subject==='Matematika'?(q.coverage||q.cakupanSubelemen||coverageSelection||'Semua cakupan pada sub-elemen'):''},i));

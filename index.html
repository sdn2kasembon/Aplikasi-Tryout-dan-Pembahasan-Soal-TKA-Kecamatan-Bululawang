        const renderMath = () => {
            setTimeout(() => {
                if (window.renderMathInElement) {

        };
        const generateDays = () => Array.from({ length: 31 }, (_, i) => i + 1);
        const generateMonths = () => ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const generateYears = () => {
            const currentYear = new Date().getFullYear();
            return Array.from({ length: 30 }, (_, i) => currentYear - 10 - i);
        };

        // Fungsi Helper untuk Menentukan Kategori Nilai
        const getScoreCategory = (score) => {
            const nilai = Number(score) || 0;
            if (nilai >= 95) return "Istimewa";
            if (nilai >= 76.67) return "Baik";
            if (nilai >= 50) return "Memadai";
            return "Kurang";
        };
        
        const shuffleArray = (array) => {
            if (!array) return [];
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        const downloadExcel = (data, title = "Rekap") => {
           if (!data || data.length === 0) {
                alert("Belum ada data nilai untuk diunduh.");
                return;
            }
            let tableHTML = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="utf-8"></head>
                <body>
                <table border="1" style="border-collapse: collapse;">
                <thead>
                    <tr style="background-color: #1e40af; color: white; text-align: center; font-weight: bold;">
                    <th style="padding: 10px;">No</th>
                    <th>Nama Murid</th>
                    <th>Asal Sekolah</th>
                    <th>NISN</th>
                    <th>Jenis Kelamin</th>
                    <th>Tempat Lahir</th>
                    <th>Tanggal Lahir</th>
                    <th>Jawaban Benar</th>
                    <th>Total Soal</th>
                    <th>Nilai Akhir</th>
                    <th>Kategori</th>
                    </tr>
                </thead>
                <tbody>
            `;
            data.forEach((item, index) => {
                const scoreFixed = item.score ? item.score.toFixed(2) : "0.00";
                const category = getScoreCategory(item.score || 0);
                const categoryColor = category === "Istimewa" ? "#d1fae5" : category === "Baik" ? "#dbeafe" : category === "Memadai" ? "#fef3c7" : "#fee2e2";
                
                const tglLahir = (item.birthDate && item.birthMonth && item.birthYear) 
                    ? `${item.birthDate} ${item.birthMonth} ${item.birthYear}` 
                    : "-";

                tableHTML += `<tr>
                    <td style="text-align: center;">${index + 1}</td>
                    <td>${item.studentName || item.fullName ||item.name || '-'}</td>
                    <td>${item.school || '-'}</td>
                    <td style="text-align: center; mso-number-format:'\@';">${item.nisn || '-'}</td>
                    <td style="text-align: center;">${item.gender || '-'}</td>
                    <td>${item.birthPlace || '-'}</td>
                    <td>${tglLahir}</td> 
                    <td style="text-align: center;">${item.correctCount || 0}</td>
                    <td style="text-align: center;">${item.totalQuestions || 0}</td>
                    <td style="text-align: center; font-weight: bold;">${scoreFixed}</td>
                    <td style="text-align: center; background-color: ${categoryColor};">${category}</td>
                </tr>`;
            });
            tableHTML += `</tbody></table></body></html>`;
            const blob = new Blob([tableHTML], { type: 'application/vnd.ms-excel' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            const safeTitle = title.replace(/[/\\?%*:|"<>]/g, '-');
            link.download = `Nilai_${safeTitle}_${new Date().toISOString().slice(0,10)}.xls`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // ============================================================
        // UNDUH ANALISIS HASIL NILAI PER BUTIR SOAL
        // ============================================================
        const downloadAnalysis = (data, title = "Analisis_Hasil_Nilai") => {
            if (!Array.isArray(data) || data.length === 0) { alert("Belum ada data nilai untuk dianalisis."); return; }
            const hasDetail = data.some(r => Array.isArray(r.questionAnalysis) && r.questionAnalysis.length);
            if (!hasDetail) { alert("Data nilai lama belum menyimpan rincian jawaban per soal. Analisis per butir tersedia untuk hasil yang dikerjakan setelah fitur ini diperbarui."); return; }
            const map = {};
            data.forEach(result => (result.questionAnalysis || []).forEach(item => {
                const key = String(item.questionId ?? item.questionNo ?? '');
                if (!map[key]) map[key] = { no:item.questionNo || Object.keys(map).length+1, subject:item.subject||'-', title:item.examTitle||result.examTitle||'-', type:item.questionForm||'-', competency:item.competency||'-', subcompetency:item.subcompetency||'-', material:item.element||'-', submaterial:item.subelement||'-', coverage:item.coverage||item.cakupanSubelemen||'-', cognitive:item.cognitiveLevel||'-', thinking:item.thinkingProcess||'-', participants:0, correct:0, wrong:0, blank:0 };
                const a=map[key]; a.participants++;
                if(item.status==='correct' || item.isCorrect===true) a.correct++; else if(item.status==='blank') a.blank++; else a.wrong++;
            }));
            const rows=Object.values(map).sort((a,b)=>Number(a.no)-Number(b.no));
            const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            const interpretation=p=>p>=80?'Sangat tinggi':p>=60?'Tinggi':p>=40?'Sedang':'Rendah';
            let html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>table{border-collapse:collapse}th,td{border:1px solid #777;padding:5px;vertical-align:top}th{background:#dbeafe;font-weight:bold}.title{font-size:16pt;font-weight:bold}</style></head><body>';
            const subjectsInAnalysis = [...new Set(data.flatMap(r => (r.questionAnalysis || []).map(item => item.subject).filter(Boolean)))];
            const analysisBasis = subjectsInAnalysis.length === 1 && subjectsInAnalysis[0] === 'Matematika'
                ? 'metadata butir Matematika mencakup Materi/Elemen, Submateri/Sub-elemen, Cakupan Sub-elemen, Kompetensi, Level Kognitif, dan Proses Berpikir.'
                : subjectsInAnalysis.length === 1 && subjectsInAnalysis[0] === 'Bahasa Indonesia'
                    ? 'metadata butir Bahasa Indonesia mencakup Materi/Elemen, Subkompetensi, Kompetensi, Level Kognitif, dan Proses Berpikir. Cakupan Sub-elemen Matematika tidak digunakan.'
                    : 'metadata butir disesuaikan dengan mata pelajaran masing-masing; Cakupan Sub-elemen digunakan untuk Matematika, sedangkan Bahasa Indonesia menggunakan Subkompetensi.';
            html+=`<p class="title">ANALISIS HASIL NILAI PER BUTIR SOAL</p><p><b>Judul:</b> ${esc(title)} &nbsp; <b>Jumlah Peserta:</b> ${data.length}</p><p><b>Dasar analisis:</b> ${esc(analysisBasis)}</p>`;
            html+='<table><thead><tr><th>No</th><th>Mata Pelajaran</th><th>Judul Soal</th><th>Bentuk Soal</th><th>Kompetensi</th><th>Subkompetensi</th><th>Materi/Elemen</th><th>Submateri/Sub-elemen</th><th>Cakupan Sub-elemen</th><th>Level Kognitif</th><th>Proses Berpikir</th><th>Peserta</th><th>Benar</th><th>Salah</th><th>Kosong</th><th>% Benar</th><th>Interpretasi</th></tr></thead><tbody>';
            rows.forEach(a=>{const pct=a.participants?a.correct/a.participants*100:0; html+=`<tr><td>${esc(a.no)}</td><td>${esc(a.subject)}</td><td>${esc(a.title)}</td><td>${esc(a.type)}</td><td>${esc(a.competency)}</td><td>${esc(a.subcompetency)}</td><td>${esc(a.material)}</td><td>${esc(a.submaterial)}</td><td>${esc(a.coverage)}</td><td>${esc(a.cognitive)}</td><td>${esc(a.thinking)}</td><td>${a.participants}</td><td>${a.correct}</td><td>${a.wrong}</td><td>${a.blank}</td><td>${pct.toFixed(2)}%</td><td>${interpretation(pct)}</td></tr>`;});
            html+='</tbody></table></body></html>';
            const blob=new Blob([html],{type:'application/vnd.ms-excel'}), url=URL.createObjectURL(blob), link=document.createElement('a'); link.href=url;
            const safeTitle=String(title||'Analisis_Hasil_Nilai').replace(/[/\\?%*:|"<>]/g,'-'); link.download=`Analisis_Hasil_Nilai_${safeTitle}_${new Date().toISOString().slice(0,10)}.xls`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link); setTimeout(()=>URL.revokeObjectURL(url),1000);
        };

        // ============================================================
        // UNDUH WORD: NASKAH SOAL + KISI-KISI TKA SD
        // Format .DOC kompatibel dengan Microsoft Word.
        // Kisi-kisi mengikuti istilah pada Perkaban BSKAP No. 047/H/AN/2025:
        // Mapel, jenis soal, bentuk soal, materi/elemen, submateri/sub-elemen,
        // kompetensi, subkompetensi, level kognitif, dan proses berpikir.
        // ============================================================
        const wordEscape = (value) => String(value ?? '')

        const getWordMaterial = (q) => {

            let body = `<div class="question">

            if (q?.stimulus) {
                body += `<div class="stimulus"><b>Stimulus${q.stimulusTitle ? ': ' + wordEscape(q.stimulusTitle) : ''}</b><p>${wordEscape(wordPlain(q.stimulus)).replace(/\n/g,'<br/>')}</p></div>`;

                body += `<p><img src="${q.image}" alt="${wordEscape(q.imageAlt || 'Gambar pendukung soal')}" style="max-width:520px;max-height:320px;"/></p>`;

            body += `<p class="question-text">${wordEscape(wordPlain(q.text)).replace(/\n/g,'<br/>')}</p>`;

                    body += `<li>${wordEscape(wordPlain(o)).replace(/\n/g,'<br/>')}${img}</li>`;
                });
                body += `</ol>`;
            }
            if (statements.length) {
                body += `<table class="statement-table"><tr><th>No.</th><th>Pernyataan</th><th>Respons/Kunci</th></tr>`;
                statements.forEach((s,i) => {
                    const answer = q.statementMode === 'tf'
                        ? (s.correct ? 'Benar' : 'Salah')
                        : (s.correct ? 'Sesuai' : 'Tidak Sesuai');
                    body += `<tr><td>${i+1}</td><td>${wordEscape(wordPlain(s.text))}</td><td>${answer}</td></tr>`;
                });
                body += `</table>`;

            const addPageIfNeeded = (needed = 8) => {
                if (y + needed > pageHeight - 15) {
                    doc.addPage();
                    y = margin;
                }
            };
            const addWrapped = (text, opts = {}) => {
                const size = opts.size || 10.5;
                const bold = !!opts.bold;
                const indent = opts.indent || 0;
                const gap = opts.gap == null ? 4 : opts.gap;
                const x = margin + indent;
                doc.setFont('helvetica', bold ? 'bold' : 'normal');
                doc.setFontSize(size);
                const lines = doc.splitTextToSize(safeText(text), textWidth - indent);
                const lineH = size * 0.43 + 1.6;
                for (const line of lines) {
                    addPageIfNeeded(lineH + 1);
                    doc.text(line, x, y);
                    y += lineH;
                }
                y += gap;
            };
            const addHeading = (text, size = 14) => {

            const addImage = (src, maxW = 100, maxH = 60) => {
                if (!src || typeof src !== 'string') return;
                try {
                    let format = 'PNG';

                    else if (/^data:image\/webp/i.test(src)) format = 'WEBP';

                    const props = doc.getImageProperties(src);
                    let w = maxW;
                    let h = w * (props.height / props.width);
                    if (h > maxH) { h = maxH; w = h * (props.width / props.height); }
                    addPageIfNeeded(h + 6);
                    doc.addImage(src, format, margin, y, w, h, undefined, 'FAST');

                    y += 2;

                    y += 2;

                fields.push(['Proses Berpikir', getWordThinking(q)]);
                fields.forEach(([label, value]) => addWrapped(`${label}: ${value}`, { size: 9.5, indent: 4, gap: 1.5 }));
                y += 2;
            });

            doc.save(`Naskah_Soal_${pdfSafeFileName(title)}_${new Date().toISOString().slice(0,10)}.pdf`);

                                         setStatus(`Model ${model} sedang padat. Mencoba kembali (${attempt}/2)...`);
                                     }

                                     if(attempt>1) {
                                         await new Promise(resolve=>setTimeout(resolve,1800*Math.pow(2,attempt-2)));
                                     }

                                     response=await fetch(aiUrl,{
                                         method:'POST',
                                         headers:{'Content-Type':'application/json'},
                                         body:JSON.stringify(aiBody)
                                     });

                                     data=await response.json().catch(()=>({}));

                                     if(!response.ok){
                                         const msg=data.error?.message||`Layanan AI gagal (HTTP ${response.status}).`;
                                         lastAiError=new Error(msg);
                                         if(!isRetryableAiFailure(response.status,msg)) throw lastAiError;
                                         continue;
                                     }

                                     const candidateText=data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';
                                     if(!candidateText.trim()){
                                         lastAiError=new Error(`Model ${model} tidak mengembalikan isi soal.`);
                                         continue;
                                     }

                                     const cleaned=candidateText.trim()
                                         .replace(/^```(?:json)?\s*/i,'')
                                         .replace(/\s*```$/,'')
                                         .trim();

                                     try{
                                         parsed=JSON.parse(cleaned);
                                     }catch(jsonError){
                                         lastAiError=new Error(`Model ${model} mengembalikan JSON tidak valid.`);
                                         continue;
                                     }

                                     const candidateRaw=Array.isArray(parsed)
                                         ? parsed
                                         : (Array.isArray(parsed.questions)?parsed.questions:[]);

                                     if(!candidateRaw.length){
                                         lastAiError=new Error(`Model ${model} tidak menghasilkan daftar soal.`);
                                         continue;
                                     }

                                     raw=candidateRaw;
                                     usedModel=model;
                                 }catch(fetchError){
                                     lastAiError=fetchError;
                                     if(!isRetryableAiFailure(fetchError?.status,fetchError?.message)) throw fetchError;
                                 }
                             }
                         }

                         if(!raw.length) {
                             throw (lastAiError||new Error('Semua model AI gagal merespons.'));
                         }

                         if(usedModel && usedModel!==aiModels[0]){
                             setStatus(`Berhasil membuat soal menggunakan model cadangan ${usedModel} karena model utama sedang padat/gagal.`);
                         }
                    }
                    const normalized=raw.map((q,i)=>normalizeAIQuestion({...q, subelement:subject==='Matematika'?subSelection:'', subcompetency:subject==='Bahasa Indonesia'?subSelection:'', cakupanSubelemen:subject==='Matematika'?(q.cakupanSubelemen||q.coverage||coverageSelection||'Semua cakupan pada sub-elemen'):'', coverage:subject==='Matematika'?(q.coverage||q.cakupanSubelemen||coverageSelection||'Semua cakupan pada sub-elemen'):''},i));
                    const checked=normalized.map((q,i)=>({q:repairQuestionForValidation(q),issues:validateAIQuestion(q),index:i}));
                    setPreview(checked); setStatus(`Selesai: ${normalized.length} soal dibuat sesuai rencana ${typeLabels.single} ${questionCounts.single}, ${typeLabels.complex} ${questionCounts.complex}, ${typeLabels.statement} ${questionCounts.statement}. ${checked.filter(x=>x.issues.length).length} soal perlu ditinjau.`);
                } catch(e) {
                    if(mode==='ai') {
                        try {
                            const fallback=[];
                            const plan=Object.entries(questionDistribution).flatMap(([qtype,n])=>Array.from({length:n},()=>qtype));
                            const shared=itemType==='Grup' ? BI_STIMULI[Math.floor(Math.random()*BI_STIMULI.length)] : null;
                            const gid=itemType==='Grup' ? `GRP-${makeId()}` : null;
                            plan.forEach(qtype=>{
                                if(subject==='Matematika') fallback.push({...buildMathItem(level,qtype,element,difficulty,topic), cakupanSubelemen:coverageSelection||'Semua cakupan pada sub-elemen', coverage:coverageSelection||'Semua cakupan pada sub-elemen'});
                                else fallback.push(buildBIItems(level,qtype,itemType==='Grup',shared,gid,difficulty,topic));
                            });
                            const normalizedFallback=fallback.map((q,i)=>normalizeAIQuestion({...q, subelement:subject==='Matematika'?subSelection:'', subcompetency:subject==='Bahasa Indonesia'?subSelection:'', cakupanSubelemen:subject==='Matematika'?(coverageSelection||'Semua cakupan pada sub-elemen'):'', coverage:subject==='Matematika'?(coverageSelection||'Semua cakupan pada sub-elemen'):''},i));
                            const checkedFallback=normalizedFallback.map((q,i)=>({q:repairQuestionForValidation(q),issues:validateAIQuestion(q),index:i}));
                            setPreview(checkedFallback);
                            setStatus(`AI gagal: ${e.message} Generator lokal otomatis digunakan sebagai cadangan. Soal tetap dapat ditinjau dan ditambahkan ke editor.`);
                        } catch(fallbackError) {
                            setPreview([]);
                            setStatus(`Gagal membuat soal: ${e.message}. Cadangan lokal juga gagal: ${fallbackError.message}`);
                        }
                    } else {
                        setPreview([]);
                        setStatus(`Gagal: ${e.message}`);
                    }
                } finally { setBusy(false); }
            };
            const accept = () => {
                const good=preview.filter(x=>!x.issues.length).map(x=>x.q);
                const rejected=preview.length-good.length;
                if(!good.length) return alert('Belum ada soal yang lolos validasi mutu. Silakan regenerasi agar soal diperbaiki.');
                if(rejected>0 && !window.confirm(`${rejected} soal belum lolos validasi mutu dan tidak akan dimasukkan. Lanjutkan hanya dengan ${good.length} soal yang lolos?`)) return;
                onGenerate(good);
            };
            return <div className="fixed inset-0 z-[70] bg-black bg-opacity-50 flex items-center justify-center p-4 fade-in"><div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[92vh] overflow-y-auto"><div className="p-6 border-b flex justify-between items-center sticky top-0 bg-white z-10"><div><h3 className="text-xl font-extrabold text-gray-800">🤖 Generator Soal TKA SD</h3><p className="text-xs text-gray-500 mt-1">AI Gemini dengan API key milik sekolah. Jika model utama sedang padat/gagal, sistem otomatis beralih ke model Gemini Flash cadangan. Gambar yang diperlukan dibuat otomatis oleh AI, lalu diperiksa oleh validator lokal dan generator cadangan.</p></div><button onClick={onCancel}><X size={24}/></button></div><div className="p-6 space-y-5"><div className="grid md:grid-cols-3 gap-4"><div><label className="block text-sm font-bold mb-1">Mata Uji</label><select value={subject} onChange={e=>{const nextSubject=e.target.value;const nextElement=nextSubject==='Matematika'?'Bilangan':'Keterampilan Membaca';const nextCompetency=nextSubject==='Matematika'?'Pemecahan masalah matematis':'Pemahaman Tekstual';setSubject(nextSubject);setElement(nextElement);setCompetency(nextCompetency);const nextSub=nextSubject==='Matematika'?(TKA_META.mathSubelements[nextElement]||[])[0]||'':(TKA_META.biSubcompetencies[nextCompetency]||[])[0]||'';setSubSelection(nextSub);setCoverageSelection(nextSubject==='Matematika'?(TKA_META.mathCoverage[nextSub]||[])[0]||'':'')}} className="w-full p-3 border rounded-lg"><option>Matematika</option><option>Bahasa Indonesia</option></select></div><div><label className="block text-sm font-bold mb-1">Elemen</label>{subject==='Matematika'?<select value={element} onChange={e=>{const nextElement=e.target.value;setElement(nextElement);const nextSub=(TKA_META.mathSubelements[nextElement]||[])[0]||'';setSubSelection(nextSub);setCoverageSelection((TKA_META.mathCoverage[nextSub]||[])[0]||'')}} className="w-full p-3 border rounded-lg">{TKA_META.mathElements.map(x=><option key={x}>{x}</option>)}</select>:<input readOnly value="Keterampilan Membaca" className="w-full p-3 border rounded-lg bg-gray-50"/>}</div><div><label className="block text-sm font-bold mb-1">Level Kognitif</label><select value={level} onChange={e=>{setLevel(e.target.value);setThinkingProcess(TKA_META.cognitive[e.target.value][0])}} className="w-full p-3 border rounded-lg">{Object.keys(TKA_META.cognitive).map(x=><option key={x}>{x}</option>)}</select></div><div><label className="block text-sm font-bold mb-1">Kompetensi</label><select value={competency} onChange={e=>{setCompetency(e.target.value);const next=subject==='Bahasa Indonesia'?(TKA_META.biSubcompetencies[e.target.value]||[]):(TKA_META.mathSubelements[element]||[]);const nextSub=next[0]||'';setSubSelection(nextSub);setCoverageSelection(subject==='Matematika'?(TKA_META.mathCoverage[nextSub]||[])[0]||'':'')}} className="w-full p-3 border rounded-lg">{(subject==='Matematika'?['Pengetahuan matematika','Representasi matematis','Penalaran','Pemecahan masalah matematis','Koneksi matematis']:TKA_META.biCompetencies).map(x=><option key={x}>{x}</option>)}</select></div><div className="md:col-span-3"><label className="block text-sm font-bold mb-1">{subject==='Bahasa Indonesia'?'Subkompetensi':'Sub-elemen / Submateri'}</label><select value={subSelection} onChange={e=>{const nextSub=e.target.value;setSubSelection(nextSub);setCoverageSelection(subject==='Matematika'?(TKA_META.mathCoverage[nextSub]||[])[0]||'':'')}} className="w-full p-3 border rounded-lg">{availableSubSelections.map(x=><option key={x}>{x}</option>)}{availableSubSelections.length===0&&<option value="">Tidak tersedia</option>}</select><p className="text-xs text-gray-500 mt-1">Pilihan mengikuti kompetensi/elemen yang dipilih dan kerangka TKA SD.</p></div>{subject==='Matematika'&&<div className="md:col-span-3"><label className="block text-sm font-bold mb-1">Pilihan Cakupan Sub-elemen</label><select value={coverageSelection} onChange={e=>setCoverageSelection(e.target.value)} className="w-full p-3 border rounded-lg"><option value="">Semua cakupan pada sub-elemen</option>{availableCoverages.map(x=><option key={x} value={x}>{x}</option>)}</select><p className="text-xs text-gray-500 mt-1">Pilih cakupan sesuai tabel kerangka TKA SD. Cakupan ini menjadi dasar pembuatan dan analisis butir Matematika.</p></div>}<div className="md:col-span-3 border rounded-xl p-4 bg-gray-50"><label className="block text-sm font-bold mb-2">Bentuk Soal dan Jumlah Soal</label><p className="text-xs text-gray-500 mb-3">Pilih jumlah masing-masing bentuk soal. Semua bentuk dapat dibuat sekaligus pada kompetensi yang dipilih.</p><div className="grid md:grid-cols-3 gap-3"><div className="bg-white border rounded-lg p-3"><div className="font-bold text-sm">PG Sederhana</div><div className="text-xs text-gray-500 mb-2">1 jawaban benar</div><input type="number" min="0" max="20" value={questionCounts.single} onChange={e=>setTypeCount('single',e.target.value)} className="w-full p-2 border rounded-lg"/></div><div className="bg-white border rounded-lg p-3"><div className="font-bold text-sm">PGK MCMA</div><div className="text-xs text-gray-500 mb-2">lebih dari satu jawaban benar</div><input type="number" min="0" max="20" value={questionCounts.complex} onChange={e=>setTypeCount('complex',e.target.value)} className="w-full p-2 border rounded-lg"/></div><div className="bg-white border rounded-lg p-3"><div className="font-bold text-sm">PGK Kategori</div><div className="text-xs text-gray-500 mb-2">pernyataan benar/salah</div><input type="number" min="0" max="20" value={questionCounts.statement} onChange={e=>setTypeCount('statement',e.target.value)} className="w-full p-2 border rounded-lg"/></div></div><div className="mt-3 text-sm font-bold text-indigo-700">Total soal: {totalCount} / 20</div></div><div><label className="block text-sm font-bold mb-1">Kesulitan</label><select value={difficulty} onChange={e=>setDifficulty(e.target.value)} className="w-full p-3 border rounded-lg"><option>Mudah</option><option>Sedang</option><option>Sulit</option></select></div><div><label className="block text-sm font-bold mb-1">Jenis</label><select value={itemType} onChange={e=>setItemType(e.target.value)} className="w-full p-3 border rounded-lg"><option>Tunggal</option><option>Grup</option></select></div><div><label className="block text-sm font-bold mb-1">Sumber Generator</label><select value={mode} onChange={e=>setMode(e.target.value)} className="w-full p-3 border rounded-lg"><option value="ai">AI Gemini (API Key Sekolah)</option><option value="local">Lokal / Cadangan</option></select></div><div><label className="block text-sm font-bold mb-1">API Key AI</label><input type={showKey?'text':'password'} value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="API key Gemini sekolah" className="w-full p-3 border rounded-lg"/><label className="text-xs text-gray-500 flex items-center gap-2 mt-1"><input type="checkbox" checked={showKey} onChange={e=>setShowKey(e.target.checked)}/> Tampilkan key</label><p className="text-xs text-orange-700 mt-1">Jangan bagikan file HTML yang berisi key. Key hanya disimpan selama sesi browser.</p></div></div><div><label className="block text-sm font-bold mb-1">Topik atau konteks tambahan (opsional)</label><input value={topic} onChange={e=>setTopic(e.target.value)} placeholder="Contoh: lingkungan sekolah, pecahan, diagram batang" className="w-full p-3 border rounded-lg"/></div>{status&&<div className="p-3 rounded-lg bg-blue-50 border border-blue-200 text-sm text-blue-900">{status}</div>}{preview.length>0&&<div className="space-y-3"><div className="flex justify-between items-center"><h4 className="font-bold">Hasil AI</h4><button onClick={generate} disabled={busy} className="px-3 py-2 rounded-lg bg-amber-500 text-white font-bold">Regenerasi</button></div>{preview.map(({q,issues},i)=><div key={q.id} className="border rounded-xl p-4"><div className="flex justify-between gap-3"><b>Soal {i+1}</b>{issues.length?<span className="text-xs bg-orange-100 text-orange-800 px-2 py-1 rounded">{issues.length} masalah</span>:<span className="text-xs bg-green-100 text-green-800 px-2 py-1 rounded">Lolos validasi dasar</span>}</div><p className="mt-2 text-sm whitespace-pre-wrap">{q.text}</p>{q.image&&<div className="mt-3 rounded-lg border bg-gray-50 p-2"><div className="text-xs font-semibold text-gray-500 mb-2">Gambar dibuat otomatis oleh AI</div><img src={q.image} alt={q.imageAlt||"Gambar pendukung soal"} className="max-w-full max-h-64 mx-auto object-contain" /></div>}{q.imageRequired&&!q.image&&<div className="mt-3 text-xs text-orange-700 bg-orange-50 border border-orange-200 rounded-lg p-2">AI menandai soal ini membutuhkan gambar, tetapi gambar belum berhasil dibuat. Silakan regenerasi.</div>}{q.options.length>0&&<ol className="list-decimal ml-6 mt-2 text-sm">{q.options.map((o,j)=><li key={j}>{q.optionImages&&q.optionImages[j]&&<img src={q.optionImages[j]} alt={`Gambar opsi ${j+1}`} className="max-h-20 max-w-full object-contain mb-1"/>}{o}</li>)}</ol>}<details className="mt-3 text-sm"><summary className="cursor-pointer font-semibold">Kunci, pembahasan, dan catatan validasi</summary><p className="mt-2"><b>Kunci:</b> {Array.isArray(q.correct)?q.correct.join('; '):q.correct}</p><p className="mt-2"><b>Pembahasan:</b> {q.explanation}</p>{issues.length>0&&<ul className="list-disc ml-5 mt-2 text-orange-700">{issues.map((x,j)=><li key={j}>{x}</li>)}</ul>}</details></div>)}</div>}</div><div className="p-5 border-t bg-gray-50 flex justify-end gap-3 sticky bottom-0"><button onClick={onCancel} className="px-5 py-2 rounded-lg font-bold text-gray-600">Batal</button><button disabled={busy} onClick={generate} className="px-6 py-2 rounded-lg bg-indigo-600 text-white font-bold">{busy?'Memproses...':'Buat Soal'}</button><button disabled={!preview.length||busy} onClick={accept} className="px-6 py-2 rounded-lg bg-green-600 text-white font-bold">Tambahkan ke Editor</button></div></div></div>;
        };


        // ============================================================
        // GENERATOR TRYOUT TKA - mode menyeluruh seluruh komponen mapel
        // ============================================================
        const buildTryoutBlueprint = (subject, totalCount, difficulty='Sedang', counts={single:12,complex:4,statement:4}) => {
            const types=[];
            Object.entries(counts).forEach(([t,n])=>{ for(let i=0;i<n;i++) types.push(t); });
            while(types.length<totalCount) types.push('single');
            types.length=totalCount;
            const cognitiveCycle=['Aplikasi','Aplikasi','Penalaran','Pengetahuan dan Pemahaman','Penalaran'];
            const blueprint=[];
            if(subject==='Matematika'){
                const groups=[
                    {element:'Bilangan',subelement:'Bilangan Rasional',weight:4},
                    {element:'Geometri dan Pengukuran',subelement:'Objek Geometri',weight:4},
                    {element:'Geometri dan Pengukuran',subelement:'Pengukuran',weight:8},
                    {element:'Data',subelement:'Penyajian dan Penggunaan Data',weight:4}
                ];
                const n=Math.max(1,groups.length);
                const alloc=groups.map(g=>Math.max(1,Math.floor(totalCount*g.weight/20)));
                let sum=alloc.reduce((a,b)=>a+b,0);
                while(sum>totalCount){
                    let idx=alloc.findIndex((v,i)=>v>1 && v===Math.max(...alloc));
                    if(idx<0)break; alloc[idx]--; sum--;
                }
                while(sum<totalCount){
                    let idx=groups.map((g,i)=>g.weight/(alloc[i]||1)).indexOf(Math.max(...groups.map((g,i)=>g.weight/(alloc[i]||1))));
                    alloc[idx]++; sum++;
                }
                const slots=[];
                groups.forEach((g,gi)=>{const covers=TKA_META.mathCoverage[g.subelement]||[];for(let i=0;i<alloc[gi];i++)slots.push({element:g.element,subelement:g.subelement,coverage:covers[i%covers.length]||'Semua cakupan pada sub-elemen'});});
                slots.forEach((x,i)=>blueprint.push({...x,competency:['Pengetahuan matematika','Representasi matematis','Penalaran','Pemecahan masalah matematis','Koneksi matematis'][i%5],cognitiveLevel:cognitiveCycle[i%cognitiveCycle.length],thinkingProcess:TKA_META.cognitive[cognitiveCycle[i%cognitiveCycle.length]][i%TKA_META.cognitive[cognitiveCycle[i%cognitiveCycle.length]].length],type:types[i],difficulty}));
            } else {
                const comps=TKA_META.biCompetencies;
                const base=Math.floor(totalCount/comps.length), rem=totalCount%comps.length;
                comps.forEach((comp,ci)=>{const subs=TKA_META.biSubcompetencies[comp]||[];const n=base+(ci<rem?1:0);for(let i=0;i<n;i++){const idx=blueprint.length;blueprint.push({element:'Keterampilan Membaca',subelement:'',competency:comp,subcompetency:subs[i%Math.max(1,subs.length)]||'',cognitiveLevel:cognitiveCycle[idx%cognitiveCycle.length],thinkingProcess:TKA_META.cognitive[cognitiveCycle[idx%cognitiveCycle.length]][idx%TKA_META.cognitive[cognitiveCycle[idx%cognitiveCycle.length]].length],type:types[idx],difficulty});}});
            }
            return blueprint.slice(0,totalCount);
        };

        const friendlyAiError = (e, context='AI') => {
            const msg = String(e?.message || e || '');
            const lower = msg.toLowerCase();
            const waitMatch = msg.match(/(?:retry in|try again in)\s*([0-9]+(?:\.[0-9]+)?)s/i);
            const waitSec = waitMatch ? Math.ceil(Number(waitMatch[1])) : null;
            if (lower.includes('quota exceeded') || lower.includes('free_tier_requests') || lower.includes('rate limit') || lower.includes('too many requests') || /\b429\b/.test(lower)) {
                return waitSec
                    ? `⚠️ ${context} belum dapat diproses karena batas permintaan Gemini sedang tercapai. Silakan tunggu sekitar ${waitSec} detik, lalu klik **Regenerasi Validasi** kembali. Soal yang sudah valid tetap dipertahankan.`
                    : `⚠️ ${context} belum dapat diproses karena batas permintaan Gemini sedang tercapai. Silakan tunggu beberapa saat, lalu klik **Regenerasi Validasi** kembali. Soal yang sudah valid tetap dipertahankan.`;
            }
            if (lower.includes('high demand') || lower.includes('spikes in demand') || lower.includes('currently experiencing high demand')) {
                return `⚠️ Semua model Gemini yang tersedia untuk generator sedang sibuk atau tidak merespons. Silakan coba **Regenerasi** beberapa saat lagi. Soal yang sudah valid tetap dipertahankan.`;
            }
            if (lower.includes('503') || lower.includes('service unavailable') || lower.includes('temporarily unavailable')) {
                return `⚠️ Layanan Gemini sementara tidak tersedia. Silakan tunggu beberapa saat kemudian dan klik **Regenerasi Validasi** kembali. Soal yang sudah valid tetap dipertahankan.`;
            }
            if (lower.includes('502') || lower.includes('500')) {
                return `⚠️ Layanan Gemini mengalami gangguan sementara. Silakan klik **Regenerasi Validasi** kembali. Soal yang sudah valid tetap dipertahankan.`;
            }
            return `⚠️ ${context} belum berhasil. ${msg || 'Terjadi gangguan sementara pada layanan AI.'} Silakan coba lagi.`;
        };

        const TryoutGenerator = ({ onGenerate, onCancel }) => {
            const [subject,setSubject]=useState('Matematika');
            const [totalCount,setTotalCount]=useState(20);
            const [questionCounts,setQuestionCounts]=useState({single:12,complex:4,statement:4});
            const [difficulty,setDifficulty]=useState('Sedang');
            const [mode,setMode]=useState('ai');
            const [apiKey,setApiKey]=useState(getTkaAiKey());
            const [showKey,setShowKey]=useState(false);
            const [topic,setTopic]=useState('');
            const [busy,setBusy]=useState(false);
            const [status,setStatus]=useState('');
            const [preview,setPreview]=useState([]);
            const blueprint=buildTryoutBlueprint(subject,totalCount,difficulty,questionCounts);
            const typeLabel={single:'PG Sederhana',complex:'PGK MCMA',statement:'PGK Kategori'};
            const totalTypes=Object.values(questionCounts).reduce((a,b)=>a+b,0);
            const setCount=(k,v)=>setQuestionCounts(prev=>({...prev,[k]:Math.max(0,Math.min(30,Number(v)||0))}));
            const generate=async()=>{
                if(totalCount<5||totalCount>30){alert('Jumlah tryout harus 5–30 soal.');return;}
                if(totalTypes!==totalCount){alert(`Jumlah bentuk soal (${totalTypes}) harus sama dengan total tryout (${totalCount}).`);return;}
                setBusy(true);setStatus('Menyusun blueprint tryout menyeluruh...');
                const payload={mode:'TRYOUT TKA SD',subject,totalCount,difficulty,topic,questionDistribution:questionCounts,blueprint};
                try{
                    let raw=[];
                    if(mode==='local'){
                        blueprint.forEach((b,i)=>{
                            if(subject==='Matematika') raw.push({...buildMathItem(b.cognitiveLevel,b.type,b.element,difficulty,topic),subject:'Matematika',element:b.element,subelement:b.subelement,competency:b.competency,cognitiveLevel:b.cognitiveLevel,thinkingProcess:b.thinkingProcess,cakupanSubelemen:b.coverage,coverage:b.coverage});
                            else { const q=buildBIItems(b.cognitiveLevel,b.type,false,null,null,difficulty,topic); raw.push({...q,subject:'Bahasa Indonesia',element:'Keterampilan Membaca',subelement:'',competency:b.competency,subcompetency:b.subcompetency,cognitiveLevel:b.cognitiveLevel,thinkingProcess:b.thinkingProcess}); }
                        });
                    } else {
                        if(!apiKey.trim()) throw new Error('Masukkan API key AI terlebih dahulu.');
                        setTkaAiKey(apiKey.trim());

            useEffect(() => {
                if (!user) return;
                
                // 1. Pulihkan Bank Soal dari cache lokal terlebih dahulu, kemudian sinkronkan dengan Firestore.
                // Ini mencegah daftar Bank Soal tampak kosong saat Firestore terlambat/sempat gagal dibaca.
                const cachedBank = readBankCache();
                if (cachedBank.length) setSavedExams(cachedBank);

                const qExams = query(collection(db, 'artifacts', appId, 'users', user.uid, 'exams'));
                const unsubExams = onSnapshot(qExams, (snapshot) => {
                    const cloudItems = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
                    mergeBankCache(cloudItems);
                }, (e) => {
                    console.error("Exams Fetch Error:", e);
                    // Jangan mengosongkan state ketika Firestore gagal membaca. Pertahankan cache yang sudah ada.
                    const fallback = readBankCache();
                    if (fallback.length) setSavedExams(fallback);
                });
                
                // 2. Fetch Active Exam Status menggunakan token yang tersimpan.
                // Jangan query seluruh koleksi public: beberapa Security Rules hanya mengizinkan
                // pembacaan dokumen tertentu dan akan menolak query koleksi.
                const activeTokenKey = `tka_active_token_${appId}_${user.uid}`;
                const storedToken = localStorage.getItem(activeTokenKey);
                let unsubActive = () => {};
                if (storedToken) {
                    const activeRef = doc(db, 'artifacts', appId, 'public', 'data', 'active_exams', storedToken);
                    unsubActive = onSnapshot(activeRef, (snap) => {
                        if (snap.exists()) {
                            const exam = snap.data();
                            if (exam.teacherId === user.uid && exam.status === 'active') setActiveExam({ id: snap.id, ...exam });
                            else setActiveExam(null);
                        } else {
                            setActiveExam(null);
                            localStorage.removeItem(activeTokenKey);
                        }
                    }, (e) => {
                        console.error('Active Exam Fetch Error:', e);
                        setActiveExam(null);
                    });
                } else {
                    setActiveExam(null);
                }

                return () => { unsubExams(); unsubActive(); };
            }, [user]);

            // 3. Fetch Results (Optimized: Only when an exam is ACTIVE and view is RESULTS)
           useEffect(() => {
                if (!user) {
                    setResults([]);
                    return;
                }

               const qResults = query(collection(db, 'artifacts', appId, 'public', 'data', 'exam_results'));

                const unsubResults = onSnapshot(qResults, (snapshot) => {
                    const allResults = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                    // ✅ FILTER berdasarkan guru (bukan ujian aktif)
                    const myResults = allResults.filter(r => r.teacherId === user.uid);

                    setResults(myResults);
                }, (e) => console.log("Results Fetch Error:", e));

                return () => unsubResults();
            }, [user]);

            const getQuestionValidation = (items) => items.flatMap((q, i) => validateTKAQuestion(q).map(msg => `Soal ${i+1}: ${msg}`));

            const handleDeleteResults = async (examResults, examTitle = "Tanpa Nama Ujian") => {
                const group = Array.isArray(examResults) ? examResults : [];
                if (!group.length) {
                    alert(`Belum ada Rekap Nilai untuk ujian "${examTitle}" yang dapat dihapus.`);
                    return;
                }
                const confirmed = window.confirm(
                    `Hapus Rekap Nilai hanya untuk ujian "${examTitle}"?\n\nJumlah data: ${group.length} siswa.\n\nData ujian lain tidak akan ikut terhapus.\nData yang dihapus tidak dapat dipulihkan.`
                );
                if (!confirmed) return;
                try {
                    await Promise.all(group.map((item) => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'exam_results', item.id))));
                    setResults(prev => prev.filter(item => !group.some(g => g.id === item.id)));
                    alert(`Rekap Nilai untuk ujian "${examTitle}" berhasil dihapus.`);
                } catch (e) {
                    console.error("Delete Results Error:", e);
                    alert("Gagal menghapus Rekap Nilai: " + e.message);
                }
            };
            const handleSaveToBank = async () => {
                const validation = getQuestionValidation(questions); if (validation.length) return alert('Bank Soal belum memenuhi kontrol TKA:\n\n' + validation.slice(0,12).join('\n'));
                if (!examTitle.trim()) return alert("Gagal Menyimpan: Judul ujian tidak boleh kosong.");
                if (questions.length === 0) return alert("Gagal Menyimpan: Anda belum menambahkan soal satupun.");
                const examData = { title: examTitle, duration: examDuration, questions: questions, lastModified: new Date().toLocaleString(), author: user.email };
                try {
                    let savedItem;
                    if (currentExamId) {
                        const targetRef = doc(db, 'artifacts', appId, 'users', user.uid, 'exams', currentExamId);
                        await setDoc(targetRef, examData, { merge: true });
                        savedItem = { id: currentExamId, ...examData };
                    } else {
                        const docRef = await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'exams'), examData);
                        setCurrentExamId(docRef.id);
                        savedItem = { id: docRef.id, ...examData };
                    }
                    // Backup lokal per akun. Data tetap tersedia setelah browser/file dibuka kembali.
                    const existing = readBankCache().filter(x => x.id !== savedItem.id);
                    writeBankCache([...existing, savedItem]);
                    alert("Berhasil disimpan ke Bank Soal Cloud dan dicadangkan di perangkat ini.");
                } catch (e) {
                    // Jika Firestore gagal, tetap simpan salinan lokal agar paket tidak hilang dari Editor/Bank lokal.
                    try {
                        const localId = currentExamId || `local-${Date.now()}`;
                        const localItem = { id: localId, ...examData, localOnly: true };
                        const existing = readBankCache().filter(x => x.id !== localId);
                        writeBankCache([...existing, localItem]);
                        setSavedExams([...existing, localItem]);
                        if (!currentExamId) setCurrentExamId(localId);
                        alert("Firestore gagal menyimpan, tetapi paket soal sudah dicadangkan secara lokal.\n\n" + firebaseErrorText(e));
                    } catch (localError) {
                        alert("Gagal menyimpan Bank Soal: " + e.message);
                    }
                }
            };

            const firebaseErrorText = (e) => {
                const code = e?.code || '';
                const detail = e?.message || String(e);
                if (code.includes('permission-denied')) return 'Akses Firestore ditolak (permission-denied). Periksa Firestore Security Rules untuk jalur public/data/active_exams.';
                if (code.includes('unauthenticated')) return 'Sesi login Firebase belum aktif. Silakan keluar lalu masuk kembali sebagai guru.';
                if (code.includes('unavailable')) return 'Firestore tidak tersedia sementara atau koneksi internet bermasalah. Coba lagi.';
                if (code.includes('failed-precondition')) return 'Konfigurasi Firestore belum siap (failed-precondition). Periksa database Firestore pada project Firebase.';
                return `${detail}${code ? ` [${code}]` : ''}`;
            };

            const makeToken = () => Math.random().toString(36).slice(2, 8).toUpperCase();

            const publishExam = async () => {
                const validation = getQuestionValidation(questions);
                if (validation.length) return alert('Ujian belum dapat diterbitkan karena ada butir yang belum memenuhi kontrol TKA:\n\n' + validation.slice(0,12).join('\n'));
                if (!examTitle.trim()) return alert("Gagal Menerbitkan: Judul Ujian tidak boleh kosong.");
                if (questions.length === 0) return alert("Gagal Menerbitkan: Anda belum menambahkan soal satupun.");
                if (!auth.currentUser || auth.currentUser.uid !== user?.uid) return alert('Gagal Menerbitkan: sesi login guru belum aktif. Silakan masuk kembali.');

                const activeTokenKey = `tka_active_token_${appId}_${user.uid}`;
                try {
                    // Cari token yang belum dipakai agar tidak menimpa sesi lain.
                    let token = '';
                    let targetRef = null;
                    for (let attempt = 0; attempt < 5; attempt++) {
                        const candidate = makeToken();
                        const candidateRef = doc(db, 'artifacts', appId, 'public', 'data', 'active_exams', candidate);
                        const existing = await getDoc(candidateRef);
                        if (!existing.exists()) { token = candidate; targetRef = candidateRef; break; }
                    }
                    if (!targetRef) throw new Error('Tidak dapat membuat token unik. Silakan coba lagi.');

                    const examData = {
                        title: examTitle.trim(),
                        duration: Number(examDuration) || 60,
                        questions: JSON.parse(JSON.stringify(questions)),
                        token,
                        teacherId: user.uid,
                        status: 'active',
                        publishedAt: new Date().toISOString()
                    };

                    await setDoc(targetRef, examData);
                    localStorage.setItem(activeTokenKey, token);
                    setActiveExam(examData);
                    alert(`Ujian Diterbitkan Online!\n\nTOKEN: ${token}\n\nSiswa dapat masuk menggunakan token tersebut.`);
                } catch (e) {
                    console.error('Publish Exam Error:', e);
                    alert('Gagal menerbitkan token.\n\n' + firebaseErrorText(e) + '\n\nJika muncul permission-denied, Security Rules Firebase perlu mengizinkan guru terautentikasi membuat/membaca dokumen active_exams.');
                }
            };

            const handleCloseExam = async () => {
                if (!activeExam) { setShowCloseConfirm(false); return; }
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'active_exams', activeExam.token));
                    localStorage.removeItem(`tka_active_token_${appId}_${user.uid}`);
                    setActiveExam(null);
                } catch (e) {
                    alert('Gagal menutup ujian: ' + firebaseErrorText(e));
                }
                setShowCloseConfirm(false);
            };

            const handleLoadFromBank = (exam) => {
                const safeQuestions = exam.questions || [];
                if (questions.length > 0 && !window.confirm("Editor sedang berisi soal. Timpa dengan data dari Bank Soal?")) return;

                const soalAcak = shuffleArray(JSON.parse(JSON.stringify(safeQuestions)));

                setExamTitle(exam.title); 
                setExamDuration(exam.duration); 
                setQuestions(soalAcak.map(q => ({ ...q, examTitle: exam.title }))); 
                setCurrentExamId(exam.id); 
                setDashboardView('editor');
            };

            const handleDeleteFromBank = async (id) => {
                if (!window.confirm("Hapus dari Bank Soal?")) return;
                try {
                    // Hapus cache lokal lebih dulu agar daftar langsung konsisten.
                    const remaining = readBankCache().filter(x => x.id !== id);
                    writeBankCache(remaining);
                    setSavedExams(remaining);
                    // ID lokal tidak ada di Firestore.
                    if (!String(id).startsWith('local-')) {
                        await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'exams', id));
                    }
                    if (currentExamId === id) setCurrentExamId(null);
                } catch (e) {
                    alert('Gagal menghapus dari Bank Soal: ' + firebaseErrorText(e));
                }
            };
            const handleAddQuestion = () => { setEditingItem(null); setIsEditorOpen(true); };
            const handleEditQuestion = (q) => { setEditingItem(q); setIsEditorOpen(true); };
            const handleDeleteQuestion = (id) => { if (window.confirm("Yakin ingin menghapus soal ini?")) setQuestions(questions.filter(q => q.id !== id)); };
            const loadTemplate = () => { 
                if (questions.length > 0 && !window.confirm("Menimpa soal yang sudah ada?")) return; 
                
                const soalAcak = shuffleArray(JSON.parse(JSON.stringify(TKA_TEMPLATE_DATA)));

                setQuestions(soalAcak.map(q => ({ ...q, examTitle: "Latihan Soal TKA (Standar BSKAP)" }))); 
                setExamTitle("Latihan Soal TKA (Standar BSKAP)"); 
                setCurrentExamId(null);  
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-10">
                    {isGeneratorOpen && (<QuestionGenerator onGenerate={(generated) => { const titled = generated.map(q => ({ ...q, examTitle: examTitle.trim() || q.examTitle || 'Tanpa Judul' })); setQuestions(prev => [...prev, ...titled]); setIsGeneratorOpen(false); setDashboardView('editor'); }} onCancel={() => setIsGeneratorOpen(false)} />)}
                    {isTryoutGeneratorOpen && (<TryoutGenerator onGenerate={(generated) => { const titled = generated.map(q => ({ ...q, examTitle: examTitle.trim() || q.examTitle || 'Tryout TKA SD' })); setQuestions(prev => [...prev, ...titled]); setIsTryoutGeneratorOpen(false); setDashboardView('editor'); }} onCancel={() => setIsTryoutGeneratorOpen(false)} />)}
                    <ConfirmationModal isOpen={showCloseConfirm} title="Tutup Ujian?" message="Apakah Anda yakin ingin menutup sesi ujian ini? Siswa tidak akan bisa mengakses soal lagi setelah ditutup." confirmText="Ya, Tutup" isDanger={true} onConfirm={handleCloseExam} onCancel={() => setShowCloseConfirm(false)} />
                    {isEditorOpen && (<QuestionEditor initialData={editingItem} onSave={(qData) => { const titledData = { ...qData, examTitle: examTitle.trim() || qData.examTitle || 'Tanpa Judul' }; if (editingItem) setQuestions(questions.map(q => q.id === qData.id ? titledData : q)); else setQuestions([...questions, titledData]); setIsEditorOpen(false); }} onCancel={() => setIsEditorOpen(false)} />)}
                    <nav className="bg-indigo-700 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-20"><div className="flex items-center gap-4"><h1 className="font-bold text-xl flex items-center gap-2"><School /> Dashboard Guru <span className="text-xs bg-indigo-800 px-2 py-1 rounded font-normal ml-2 hidden md:inline-block">{user.email}</span></h1><div className="hidden lg:flex flex-col text-[11px] font-bold leading-tight max-w-[430px]" style={{color:"#FFD700"}}><span>Aplikasi ini dikembangkan oleh <a href="https://www.facebook.com/umar.maksum.56" target="_blank" rel="noopener noreferrer" style={{color:"#FFD700", textDecoration:"none"}}>Umar Maksum</a>.</span><span>Aplikasi ini tidak diperjualbelikan. Saran dan pertanyaan disampaikan ke: <a href="https://www.facebook.com/umar.maksum.56" target="_blank" rel="noopener noreferrer" style={{color:"#FFD700", textDecoration:"none"}}>https://www.facebook.com/umar.maksum.56</a></span></div></div><div className="flex gap-3"><button onClick={() => setDashboardView('editor')} className={`px-3 py-1 rounded text-sm font-bold transition ${dashboardView === 'editor' ? 'bg-white text-indigo-700' : 'bg-indigo-800 text-indigo-200 hover:bg-indigo-600'}`}>Editor Soal</button><button onClick={() => setDashboardView('bank')} className={`px-3 py-1 rounded text-sm font-bold transition ${dashboardView === 'bank' ? 'bg-white text-indigo-700' : 'bg-indigo-800 text-indigo-200 hover:bg-indigo-600'}`}>Bank Soal</button><button onClick={() => setDashboardView('results')} className={`px-3 py-1 rounded text-sm font-bold transition ${dashboardView === 'results' ? 'bg-white text-indigo-700' : 'bg-indigo-800 text-indigo-200 hover:bg-indigo-600'}`}>Hasil & Nilai</button><button onClick={onLogout} className="flex items-center gap-1 bg-red-600 px-3 py-1 rounded hover:bg-red-700 text-sm ml-4"><LogOut size={16}/> Keluar</button></div></nav>
                    <main className="max-w-6xl mx-auto p-6 space-y-6">
                        {dashboardView === 'editor' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200"><h2 className="text-lg font-semibold mb-4 text-gray-700">Status Publikasi</h2>{activeExam ? (<div className="bg-green-50 border border-green-200 rounded-lg p-4 flex justify-between items-center"><div><p className="font-bold text-green-800 text-lg">{activeExam.title}</p><p className="text-sm text-green-700 mt-1">Token: <span className="font-mono font-bold">{activeExam.token}</span> | {activeExam.questions.length} Soal</p></div><button onClick={() => setShowCloseConfirm(true)} className="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 text-sm font-bold">Tutup Ujian</button></div>) : (<div className="bg-gray-100 border border-gray-200 rounded-lg p-4 text-center text-gray-500">Belum ada ujian aktif. Klik "Terbitkan Token" untuk memulai sesi ujian.</div>)}</div>
                                
                                <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                    <div className="p-6 border-b bg-gray-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2"><FileEdit size={20}/> {currentExamId ? 'Mode Edit Ujian' : 'Editor Soal Baru'}</h2>
                                            <p className="text-sm text-gray-500">Buat paket soal baru atau edit dari Bank Soal.</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => setIsGeneratorOpen(true)} className="text-sm bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded flex items-center gap-2 font-bold">⚙️ Generate Soal</button><button onClick={() => setIsTryoutGeneratorOpen(true)} className="text-sm bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded flex items-center gap-2 font-bold">📝 Generate Tryout TKA</button><button onClick={loadTemplate} className="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded flex items-center gap-2"><Layers size={16}/> Template TKA</button>
                                            <button onClick={handleSaveToBank} className="text-sm bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-2 rounded flex items-center gap-2 font-bold"><Save size={16}/> Simpan ke Bank Soal</button><button onClick={() => downloadWordQuestions(questions, examTitle.trim() || 'TKA_SD')} disabled={!questions.length} className="text-sm bg-purple-100 hover:bg-purple-200 text-purple-700 disabled:opacity-50 disabled:cursor-not-allowed px-3 py-2 rounded flex items-center gap-2 font-bold"><FileText size={16}/> Unduh Word + Kisi-Kisi</button>
                                        </div>
                                    </div>
                                    <div className="p-6 space-y-6">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Judul Ujian <span className="text-red-500">*</span></label>
                                                <input type="text" value={examTitle} onChange={(e) => setExamTitle(e.target.value)} className="w-full p-2 border rounded-lg outline-none focus:border-blue-500" placeholder="Contoh: Try Out TKA 1" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Durasi (Menit) <span className="text-red-500">*</span></label>
                                                <input type="number" value={examDuration} onChange={(e) => setExamDuration(e.target.value)} className="w-full p-2 border rounded-lg outline-none focus:border-blue-500" />
                                            </div>
                                        </div>
                                        
                                        <div className="border rounded-xl overflow-hidden shadow-sm">
                                            <div className="bg-gray-100 p-3 font-bold text-gray-700 border-b flex flex-col md:flex-row md:justify-between md:items-center gap-3">
                                                <span className="flex items-center gap-2"><List size={18}/> Daftar Soal ({questions.length})</span>
                                                <button onClick={() => { setEditingItem(null); setIsEditorOpen(true); }} className="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 hover:bg-blue-700"><Plus size={16}/> Tambah Soal Baru</button>
                                            </div>
                                            <div className="p-3 bg-white border-b space-y-3">
                                      <div className="flex flex-wrap gap-2 items-center">
                                          <span className="text-sm font-semibold text-gray-600">Mata Pelajaran:</span>
                                          <button onClick={() => { setEditorSubjectFilter('Semua'); setEditorTitleFilter('Semua Judul'); }} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition ${editorSubjectFilter === 'Semua' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}`}>Semua ({questions.length})</button>
                                          <button onClick={() => { setEditorSubjectFilter('Bahasa Indonesia'); setEditorTitleFilter('Semua Judul'); }} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition ${editorSubjectFilter === 'Bahasa Indonesia' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-blue-700 border-blue-200 hover:bg-blue-50'}`}>Bahasa Indonesia ({questions.filter(q => q.subject === 'Bahasa Indonesia').length})</button>
                                          <button onClick={() => { setEditorSubjectFilter('Matematika'); setEditorTitleFilter('Semua Judul'); }} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition ${editorSubjectFilter === 'Matematika' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-emerald-700 border-emerald-200 hover:bg-emerald-50'}`}>Matematika ({questions.filter(q => q.subject === 'Matematika').length})</button>
                                      </div>
                                      <div className="flex flex-wrap gap-2 items-center">
                                          <span className="text-sm font-semibold text-gray-600">Judul Soal:</span>
                                          {(() => {
                                              const titleSource = editorSubjectFilter === 'Semua' ? questions : questions.filter(q => q.subject === editorSubjectFilter);
                                              const titles = [...new Set(titleSource.map(q => String(q.examTitle || examTitle || 'Tanpa Judul').trim() || 'Tanpa Judul'))];
                                              return (
                                                  <>
                                                      <button onClick={() => setEditorTitleFilter('Semua Judul')} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition ${editorTitleFilter === 'Semua Judul' ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'}`}>Semua Judul</button>
                                                      {titles.map(title => (
                                                          <button key={title} onClick={() => setEditorTitleFilter(title)} title={title} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition max-w-xs truncate ${editorTitleFilter === title ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-amber-700 border-amber-200 hover:bg-amber-50'}`}>
                                                              {title}
                                                          </button>
                                                      ))}
                                                  </>
                                              );
                                          })()}
                                      </div>
                                  </div>
                                  <div className="bg-white divide-y max-h-[500px] overflow-y-auto">
                                                {(() => {
                                                    const subjectsToShow = editorSubjectFilter === 'Semua'
                                                        ? ['Bahasa Indonesia', 'Matematika']
                                                        : [editorSubjectFilter];
                                                    const renderQuestion = (q, displayNo) => (
                                                        <div key={q.id} className="p-4 hover:bg-gray-50 group relative">
                                                            <div className="flex items-center gap-2 mb-2 flex-wrap">
                                                                <span className="font-bold text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded">No. {displayNo}</span>
                                                                <span className={`font-bold text-xs px-2 py-0.5 rounded uppercase ${q.type === 'single' ? 'bg-blue-100 text-blue-700' : q.type === 'complex' ? 'bg-purple-100 text-purple-700' : 'bg-orange-100 text-orange-700'}`}>{q.type === 'single' ? 'PG Sederhana' : q.type === 'complex' ? 'PGK MCMA' : 'PGK Kategori'}</span>
                                                                {q.cognitiveLevel && <span className="text-xs px-2 py-0.5 rounded bg-yellow-100 text-yellow-800 border border-yellow-200 font-semibold">{q.cognitiveLevel}</span>}
                                                                {q.itemType && <span className="text-xs px-2 py-0.5 rounded bg-green-100 text-green-700 border border-green-200">{q.itemType}</span>}
                                                            </div>
                                                            {q.image && <img src={q.image} alt="Thumbnail" className="h-12 w-auto object-contain border rounded mb-2" />}
                                                            <p className="text-gray-800 font-medium mb-1 whitespace-pre-wrap text-sm line-clamp-2">{q.text}</p>
                                                            <div className="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                                <button onClick={() => { setEditingItem(q); setIsEditorOpen(true); }} className="p-1.5 bg-blue-50 text-blue-600 rounded hover:bg-blue-100"><Edit3 size={16}/></button>
                                                                <button onClick={() => { if(window.confirm("Hapus?")) setQuestions(questions.filter(qi => qi.id !== q.id)) }} className="p-1.5 bg-red-50 text-red-600 rounded hover:bg-red-50"><Trash2 size={16}/></button>
                                                            </div>
                                                        </div>
                                                    );
                                                    let runningNo = 0;
                                                    const sections = subjectsToShow.map(subjectName => {
                                                        const subjectQuestions = questions
                                                             .filter(q => q.subject === subjectName)
                                                             .filter(q => editorTitleFilter === 'Semua Judul' || String(q.examTitle || examTitle || 'Tanpa Judul').trim() === editorTitleFilter);
                                                        if (!subjectQuestions.length) return null;
                                                        const titleGroups = subjectQuestions.reduce((groups, q) => {
                                                            const title = String(q.examTitle || examTitle || 'Tanpa Judul').trim() || 'Tanpa Judul';
                                                            if (!groups[title]) groups[title] = [];

       const ExamInterface = ({ examData, studentData, onFinish }) => {
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [showFinishConfirm, setShowFinishConfirm] = useState(false);
             
            // Kunci penyimpanan lokal
            const storageKeyAnswers = `tka_answers_${studentData.nisn}_${examData.token}`;
            const storageKeyDoubtful = `tka_doubtful_${studentData.nisn}_${examData.token}`;
            const storageKeyTime = `tka_time_${studentData.nisn}_${examData.token}`;

            // Ambil data jika ada, jika tidak mulai dari awal
            const [answers, setAnswers] = useState(() => {
                const saved = localStorage.getItem(storageKeyAnswers);
                return saved ? JSON.parse(saved) : {};
            });

            const [doubtful, setDoubtful] = useState(() => {
                const saved = localStorage.getItem(storageKeyDoubtful);
                return saved ? JSON.parse(saved) : {};
            });

            const [timeLeft, setTimeLeft] = useState(() => {
                const savedTime = localStorage.getItem(storageKeyTime);
                return savedTime ? parseInt(savedTime, 10) : examData.duration * 60;
            });
            
            // Set isFullscreen awal menjadi true agar tidak langsung menampilkan layar peringatan
            const [isFullscreen, setIsFullscreen] = React.useState(true);

            React.useEffect(() => {
                const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
                const handleVisibility = () => {
                    if (document.hidden) alert("PERINGATAN: Dilarang pindah tab selama ujian! Setiap pelanggaran akan terekam!");
                };

                document.addEventListener("fullscreenchange", handleFullscreenChange);
                document.addEventListener("visibilitychange", handleVisibility);
                return () => {
                    document.removeEventListener("fullscreenchange", handleFullscreenChange);
                    document.removeEventListener("visibilitychange", handleVisibility);
                };
            }, []);

            const forceFullscreen = () => {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.warn("Fullscreen API diblokir oleh browser:", err);
                        // Jika Iframe memblokir, kita loloskan agar siswa tetap bisa ikut ujian
                        setIsFullscreen(true);
                    });
                } else {
                    setIsFullscreen(true); // Fallback browser lama
                }
            };
            
            // Fitur Auto-Save
            useEffect(() => {
                localStorage.setItem(storageKeyAnswers, JSON.stringify(answers));
            }, [answers, storageKeyAnswers]);

            useEffect(() => {
                localStorage.setItem(storageKeyDoubtful, JSON.stringify(doubtful));
            }, [doubtful, storageKeyDoubtful]);

            useEffect(() => {
                localStorage.setItem(storageKeyTime, timeLeft.toString());
            }, [timeLeft, storageKeyTime]);

            const submitExam = async () => {
                try {
                    let correctCount = 0;
                    const totalQuestions = examData.questions.length;

                    // 1. Menghitung skor berdasarkan jawaban yang tersimpan
                    examData.questions.forEach((q) => {
                        const userAnswer = answers[q.id];
                        if (!userAnswer) return;

                        if (q.type === 'single') {
                            if (userAnswer === q.correct) correctCount++;
                        } 
                        else if (q.type === 'complex') {
                            const isCorrect = Array.isArray(userAnswer) &&
                                userAnswer.length === q.correct.length &&
                                userAnswer.every(val => q.correct.includes(val));
                            if (isCorrect) correctCount++;
                        } 
                        else if (q.type === 'statement') {
                            const isCorrect = q.statements.every(s => userAnswer[s.id] === s.correct);
                            if (isCorrect) correctCount++;
                        }
                    });

                    const score = Math.round((correctCount / totalQuestions) * 100);

                    // 2. Menyiapkan data hasil untuk dikirim

                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'exam_results'), resultPayload);

                    onFinish(resultPayload);

            useEffect(() => {

ms-center gap-2"><ChevronLeft size={20}/> Sebelumnya</button>{currentQIndex === examData.questions.length - 1 ? <button onClick={() => setShowFinishConfirm(true)} className="px-8 py-3 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 shadow-lg flex items-center gap-2">Selesai Ujian <CheckCircle size={20}/></button> : <button onClick={()=>setCurrentQIndex(c=>c+1)} className="px-6 py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 flex items-center gap-2">Selanjutnya <ChevronRight size={20}/></button>}</div></div>

                        return `${i + 1}. ${value === true ? 'Benar' : value === false ? 'Salah' : 'Tidak dijawab'}`;
                    }).join(' • ');
                }

                if (Array.isArray(item.userAnswer)) return item.userAnswer.join(', ');
                return String(item.userAnswer ?? 'Tidak dijawab');

            const formatCorrect = (item) => {
                if (item.type === 'statement') {

                    return item.statements.map((st, i) => `${i + 1}. ${st.correct ? 'Benar' : 'Salah'}`).join(' • ');

                                <div className="px-5 py-4 border-b flex items-center justify-between sticky top-0 bg-white rounded-t-2xl">
                                    <div>
                                        <h3 className="text-xl md:text-2xl font-bold text-gray-800">Pembahasan Soal</h3>

                                <div className="overflow-y-auto custom-scrollbar p-4 md:p-6 space-y-5">
                                    {analysis.map((item, idx) => (

                                                                    <div className="flex gap-2">

                                                                            {selected && correct ? 'Jawaban Anda • Kunci jawaban' : selected ? 'Jawaban Anda' : 'Kunci jawaban'}

        const App = () => {
            const [view, setView] = useState('landing'); 
            const [authMode, setAuthMode] = useState('login'); // login | register
            const [user, setUser] = useState(null);
            
            // Data states
            const [activeExamData, setActiveExamData] = useState(null);
            const [studentData, setStudentData] = useState(null);
            const [resultData, setResultData] = useState(null);

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.log("Auto-login failed:", e);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                });
                return () => unsubscribe();
            }, []);

            // PERBAIKAN FUNGSI LOGOUT (Pindah halaman dulu, baru signout)
            const handleLogout = async () => {
                // 1. Pindah ke Landing Page TERLEBIH DAHULU

                // 2. Bersihkan data sesi

                setResultData(null);
                setActiveExamData(null);

                    await signOut(auth);
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);

                            <Loader2 className="animate-spin mb-2" size={32}/>
                            <p>Memuat sesi guru...</p>
                            {setTimeout(() => { if(!user || user.isAnonymous) setView('auth'); }, 2000) && ""}
                         </div>
                    )}

                    {view === 'login' && (
                        <StudentLogin 
                            onBack={() => setView('landing')} 
                            onStartExam={(sData, examData) => {
                                setStudentData(sData);
                                setActiveExamData(examData);
                                setView('exam');
                                
                                // --- FITUR FULLSCREEN ---
                                const elem = document.documentElement;
                                if (elem.requestFullscreen) {
                                    elem.requestFullscreen().catch(err => console.warn("Fullscreen diblokir:", err));
                                }
                            }} 
                        />
                    )}
                   
                    {view === 'exam' && activeExamData && studentData && (
                        <ExamInterface 
                            examData={activeExamData} 
                            studentData={studentData} 
                            onFinish={(res) => {
                                setResultData(res);
                                setView('result');
                                
                                // --- KELUAR DARI FULLSCREEN ---
                                if (document.fullscreenElement && document.exitFullscreen) {
                                    document.exitFullscreen().catch(err => console.warn("Exit Fullscreen diblokir:", err));
                                }
                            }} 
                        />
                    )}
                    
                    {view === 'result' && resultData && (
                        <ResultView 
                            result={resultData} 
                            onLogout={() => {
                                setView('landing');
                                setStudentData(null);
                                setActiveExamData(null);
                            }} 
                        />
                    )}
                </>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
